[package]
name = "ovner"
version = "0.8.4"
edition = "2021"
description = "Browser ringan untuk Windows: mesin WebView2 + pemblokir iklan Brave (adblock-rust), tanpa hak admin"
license = "MIT"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
# Mesin pemblokir iklan Brave Shields (format EasyList/uBlock).
adblock = { version = "0.13", features = ["css-validation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
tray-icon = "0.26"
# SHA-256 untuk pemecah tantangan Anubis (Startpage) dan sidik berkas.
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_Dns",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com_Urlmon",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_Threading",
    "Win32_System_Performance",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_IO",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
