[package]
name = "ovner"
version = "0.2.0"
edition = "2021"
description = "Browser ringan untuk Windows: mesin WebView2 + pemblokir iklan Brave (adblock-rust), tanpa hak admin"
license = "MIT"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
# Mesin pemblokir iklan Brave Shields (format EasyList/uBlock).
adblock = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
sha2 = "0.11"
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Com_Urlmon",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
