# Build Ovner (browser WebView2) untuk Windows dan terbitkan rilisnya.
# Setiap versi baru di Cargo.toml yang di-push ke main otomatis menjadi rilis
# `ovner-vX.Y.Z` berisi Ovner-Setup.exe, Ovner-Portable.zip, dan ovner-latest.json
# (dibaca fitur update otomatis Ovner).
name: Ovner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ovner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Uji
        run: cargo test

      - name: Build
        run: cargo build --release

      # Runtime Visual C++ sudah ditanam di exe (crt-static, lihat .cargo/config.toml), jadi Ovner
      # jalan di PC tanpa VC++ Redistributable. Langkah ini memastikan tidak ada DLL non-bawaan.
      - name: Cek DLL yang dibutuhkan exe
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          @'
          import pefile, sys
          pe = pefile.PE("target/release/ovner.exe")
          dlls = sorted({e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT})
          print("Import DLL:", ", ".join(dlls))
          bad = [d for d in dlls if d.startswith(("vcruntime", "msvcp", "api-ms-win-crt", "ucrtbase", "webview2loader"))]
          if bad:
              sys.exit("DLL non-bawaan Windows dibutuhkan: " + ", ".join(bad))
          '@ | Set-Content check_imports.py
          python check_imports.py

      - name: Kemas
        shell: pwsh
        run: |
          $ver = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "OVNER_VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory -Force dist, dist/Ovner | Out-Null
          Copy-Item target/release/ovner.exe dist/Ovner-Setup.exe

          # Versi portabel: exe + penanda portable.txt, semua data di folder Data di sebelahnya.
          Copy-Item target/release/ovner.exe dist/Ovner/ovner.exe
          "File ini membuat Ovner berjalan portabel: semua data disimpan di folder Data di sebelah ovner.exe." |
            Set-Content -Encoding utf8 dist/Ovner/portable.txt
          Copy-Item README.md dist/Ovner/README.md
          Compress-Archive -Path dist/Ovner -DestinationPath dist/Ovner-Portable.zip -CompressionLevel Optimal
          Remove-Item -Recurse dist/Ovner

          $hash = (Get-FileHash dist/Ovner-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/ovner-v$ver/Ovner-Setup.exe"
          [ordered]@{ version = $ver; url = $url; sha256 = $hash } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM dist/ovner-latest.json
          Get-Content dist/ovner-latest.json
          Get-ChildItem dist | ForEach-Object { "{0,-24} {1,10:N0} KB" -f $_.Name, ($_.Length / 1KB) }

      - uses: actions/upload-artifact@v4
        with:
          name: ovner-windows
          path: dist/*

      - name: Rilis otomatis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ovner-v$env:OVNER_VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "Rilis $tag sudah ada, dilewati. Naikkan versi di Cargo.toml untuk rilis baru."
            exit 0
          }
          $notes = git log -1 --pretty=%B | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8NoBOM release-notes.md
          gh release create $tag dist/Ovner-Setup.exe dist/Ovner-Portable.zip dist/ovner-latest.json `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Ovner $env:OVNER_VERSION" `
            --notes-file release-notes.md `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Gagal membuat rilis $tag" }
          "Rilis $tag diterbitkan."
