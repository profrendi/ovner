# Build Ovner (browser WebView2) untuk Windows dan terbitkan rilisnya, dua kanal:
# - Stabil: setiap versi baru di Cargo.toml yang di-push ke main menjadi rilis `ovner-vX.Y.Z`.
# - Nightly: setiap push ke main memperbarui prarilis `ovner-nightly`.
# Keduanya berisi Ovner-Setup.exe, Ovner-Portable.zip, dan ovner-latest.json (dibaca fitur
# update otomatis Ovner sesuai kanal yang dipilih di Pengaturan).
name: Ovner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Scriptlet dan resource pengganti uBlock Origin/Brave disusun ulang setiap hari.
  schedule:
    - cron: "17 21 * * *"

permissions:
  contents: write

concurrency:
  group: ovner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # resources.json untuk pemblokir Ovner: scriptlet (+js) dan resource pengganti ($redirect)
  # dari uBlock Origin, ditambah scriptlet khusus Brave. Diunduh Ovner tiap beberapa jam.
  resources:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Susun resources.json
        run: |
          git clone --depth 1 https://github.com/gorhill/uBlock.git ubo
          node tools/build-resources.mjs ubo ubo-resources.json
          curl -fsSL https://raw.githubusercontent.com/brave/adblock-resources/master/dist/resources.json -o brave-resources.json || echo "[]" > brave-resources.json
          node -e '
            const fs = require("fs");
            const ubo = JSON.parse(fs.readFileSync("ubo-resources.json"));
            const brave = JSON.parse(fs.readFileSync("brave-resources.json"));
            const names = new Set(ubo.flatMap((r) => [r.name, ...(r.aliases || [])]));
            const extra = brave.filter((r) => !names.has(r.name));
            fs.writeFileSync("resources.json", JSON.stringify(ubo.concat(extra)));
            console.log(`uBO ${ubo.length} + Brave ${extra.length} resource`);
          '
          test "$(stat -c%s resources.json)" -gt 100000
      - name: Terbitkan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          if ! gh release view ovner-resources --repo "$repo" >/dev/null 2>&1; then
            gh release create ovner-resources --repo "$repo" --prerelease --latest=false \
              --title "Ovner: scriptlet pemblokir" \
              --notes "Scriptlet (+js) dan resource pengganti uBlock Origin + Brave untuk pemblokir Ovner. Diperbarui otomatis setiap hari; tidak perlu diunduh manual."
          fi
          gh release upload ovner-resources resources.json --repo "$repo" --clobber

  windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Uji
        run: cargo test

      - name: Build
        env:
          OVNER_BUILD: ${{ github.run_number }}
          OVNER_CHANNEL: stable
        run: cargo build --release

      # Runtime Visual C++ sudah ditanam di exe (crt-static, lihat .cargo/config.toml), jadi Ovner
      # jalan di PC tanpa VC++ Redistributable. Langkah ini memastikan tidak ada DLL non-bawaan.
      - name: Cek DLL yang dibutuhkan exe
        shell: pwsh
        run: |
          python -m pip install --quiet pefile
          @'
          import pefile, sys
          pe = pefile.PE("target/release/ovner.exe")
          dlls = sorted({e.dll.decode().lower() for e in pe.DIRECTORY_ENTRY_IMPORT})
          print("Import DLL:", ", ".join(dlls))
          bad = [d for d in dlls if d.startswith(("vcruntime", "msvcp", "api-ms-win-crt", "ucrtbase", "webview2loader"))]
          if bad:
              sys.exit("DLL non-bawaan Windows dibutuhkan: " + ", ".join(bad))
          '@ | Set-Content check_imports.py
          python check_imports.py

      - name: Kemas (stabil)
        shell: pwsh
        env:
          # Kunci privat Ed25519 penanda tangan update (lihat tools/sign_update.py).
          OVNER_SIGN_KEY: ${{ secrets.OVNER_SIGN_KEY }}
        run: |
          python -m pip install --quiet cryptography
          $ver = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "OVNER_VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          @'
          param($dir, $tag, $ver, $build)
          New-Item -ItemType Directory -Force $dir, "$dir/Ovner" | Out-Null
          Copy-Item target/release/ovner.exe "$dir/Ovner-Setup.exe"
          # Versi portabel: exe + penanda portable.txt, semua data di folder Data di sebelahnya.
          Copy-Item target/release/ovner.exe "$dir/Ovner/ovner.exe"
          "File ini membuat Ovner berjalan portabel: semua data disimpan di folder Data di sebelah ovner.exe.`r`nThis file makes Ovner portable: all data is kept in the Data folder next to ovner.exe." |
            Set-Content -Encoding utf8 "$dir/Ovner/portable.txt"
          Copy-Item README.md "$dir/Ovner/README.md"
          Compress-Archive -Path "$dir/Ovner" -DestinationPath "$dir/Ovner-Portable.zip" -CompressionLevel Optimal
          Remove-Item -Recurse "$dir/Ovner"
          $hash = (Get-FileHash "$dir/Ovner-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Ovner-Setup.exe"
          $sig = (python tools/sign_update.py $ver $build $hash | Out-String).Trim()
          if (-not $sig) { "PERINGATAN: OVNER_SIGN_KEY belum diatur, update tidak ditandatangani." }
          [ordered]@{ version = $ver; url = $url; sha256 = $hash; build = [int]$build; sig = $sig } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$dir/ovner-latest.json"
          Get-Content "$dir/ovner-latest.json"
          Get-ChildItem $dir | ForEach-Object { "{0,-24} {1,10:N0} KB" -f $_.Name, ($_.Length / 1KB) }
          '@ | Set-Content package.ps1
          ./package.ps1 dist "ovner-v$ver" $ver ${{ github.run_number }}

      - name: Build dan kemas (nightly)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          OVNER_BUILD: ${{ github.run_number }}
          OVNER_CHANNEL: nightly
          OVNER_SIGN_KEY: ${{ secrets.OVNER_SIGN_KEY }}
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw "Build nightly gagal" }
          ./package.ps1 dist-nightly ovner-nightly $env:OVNER_VERSION ${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: ovner-windows
          path: dist/*

      - name: Rilis otomatis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "ovner-v$env:OVNER_VERSION"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "Rilis $tag sudah ada, dilewati. Naikkan versi di Cargo.toml untuk rilis baru."
            exit 0
          }
          $notes = git log -1 --pretty=%B | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8NoBOM release-notes.md
          gh release create $tag dist/Ovner-Setup.exe dist/Ovner-Portable.zip dist/ovner-latest.json `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Ovner $env:OVNER_VERSION" `
            --notes-file release-notes.md `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Gagal membuat rilis $tag" }
          "Rilis $tag diterbitkan."

      - name: Rilis nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          # Prarilis lama dibuang lalu dibuat ulang, supaya tag menunjuk commit terbaru.
          gh release delete ovner-nightly --repo $repo --cleanup-tag --yes *> $null
          # Sisa rilis "nightly" Lumen dari masa repo ini masih berisi Lumen.
          gh release delete nightly --repo $repo --cleanup-tag --yes *> $null
          $global:LASTEXITCODE = 0
          $subject = git log -1 --pretty=%s
          @"
          Build nightly #${{ github.run_number }} dari commit ${{ github.sha }}.

          $subject

          Pilih kanal Nightly di Pengaturan → Sistem → Kanal update agar Ovner memperbarui diri dari sini.
          Choose the Nightly channel in Settings → System → Update channel to auto-update from here.
          "@ | Set-Content -Encoding utf8NoBOM nightly-notes.md
          gh release create ovner-nightly dist-nightly/Ovner-Setup.exe dist-nightly/Ovner-Portable.zip dist-nightly/ovner-latest.json `
            --repo $repo `
            --target "${{ github.sha }}" `
            --title "Ovner nightly $env:OVNER_VERSION (build ${{ github.run_number }})" `
            --notes-file nightly-notes.md `
            --prerelease `
            --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Gagal membuat rilis nightly" }
          "Rilis nightly diterbitkan."
