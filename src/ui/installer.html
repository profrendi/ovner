<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Ovner</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --line: #d9dde3; --text: #1f2328; --muted: #5f6672; --accent: #2f6fde; --sel: #e8f0fe; --err: #c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1f23; --card: #26292e; --line: #3a3e45; --text: #e8eaed; --muted: #9aa0a6; --accent: #7aa7ff; --sel: #23324d; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; padding: 22px 26px 18px; user-select: none; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; cursor: pointer; }
  .opt.on { border-color: var(--accent); background: var(--sel); }
  .opt input[type=radio] { margin: 3px 0 0; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .opt b { display: block; font-size: 15px; margin-bottom: 3px; }
  .opt .d { color: var(--muted); line-height: 1.45; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; margin-left: 6px; vertical-align: 1px; background: var(--line); color: var(--text); }
  .tag.admin { background: #fde7c7; color: #7a4a00; }
  @media (prefers-color-scheme: dark) { .tag.admin { background: #5a4214; color: #ffd591; } }
  .dir { display: none; gap: 6px; margin-top: 9px; }
  .opt.on .dir { display: flex; }
  .dir input { flex: 1; min-width: 0; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text); user-select: text; }
  button { font: inherit; padding: 7px 16px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; min-width: 110px; }
  button:disabled { opacity: .55; cursor: default; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 2px 0; }
  .row input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .note { color: var(--muted); font-size: 12px; margin: 10px 2px 0; line-height: 1.45; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 14px; }
  #status { flex: 1; color: var(--muted); font-size: 13px; }
  #status.err { color: var(--err); }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div id="opts"></div>
  <label class="row"><input type="checkbox" id="desktop" checked> <span id="desktopL"></span></label>
  <p class="note" id="note"></p>
  <div class="foot">
    <span id="status"></span>
    <button id="cancel"></button>
    <button id="go" class="primary"></button>
  </div>
<script>
  const CFG = /*CONFIG*/{"lang":"id","version":"0.0.0","portableDir":"C:\\Users\\Rendi\\Downloads\\Ovner Portable","machine":null,"user":null,"elevated":false}/*END*/;
  const T = {
    id: {
      title: "Pasang Ovner " + CFG.version,
      sub: "Pilih cara memasang. Keduanya tidak butuh Visual C++ Redistributable.",
      machine: "Install", machineD: "Seperti software lain: dipasang di Program Files untuk semua pengguna PC ini, dengan ikon di Start Menu dan entri di Apps & features. Update berikutnya meminta izin admin.",
      machineUp: (v) => "Terpasang versi " + v + " di Program Files: akan diperbarui.",
      admin: "perlu admin",
      portable: "Portable", portableD: "Tanpa admin. Ovner dan semua datanya (folder Data) disimpan di folder pilihan Anda, bisa dibawa di flashdisk.",
      noadmin: "tanpa admin",
      user: "Perbarui instalasi saat ini", userD: (v) => "Instalasi pengguna ini (tanpa admin, di AppData) versi " + v + ".",
      browse: "Pilih…", desktop: "Buat ikon di Desktop",
      note: "Butuh Microsoft Edge WebView2 Runtime (sudah ada di Windows 10/11). Ovner yang sedang terbuka akan ditutup sebentar saat memasang.",
      cancel: "Batal", go: "Pasang", working: "Memasang…", needDir: "Pilih folder untuk versi portable.", uac: "Menunggu izin admin (UAC)…",
    },
    en: {
      title: "Install Ovner " + CFG.version,
      sub: "Choose how to install. Neither needs the Visual C++ Redistributable.",
      machine: "Install", machineD: "Like other software: installed in Program Files for every user of this PC, with a Start Menu icon and an Apps & features entry. Later updates ask for admin permission.",
      machineUp: (v) => "Version " + v + " is installed in Program Files: it will be updated.",
      admin: "needs admin",
      portable: "Portable", portableD: "No admin needed. Ovner and all its data (Data folder) live in the folder you choose; carry it on a USB drive.",
      noadmin: "no admin",
      user: "Update current installation", userD: (v) => "This user's installation (no admin, in AppData) version " + v + ".",
      browse: "Browse…", desktop: "Create a Desktop icon",
      note: "Requires the Microsoft Edge WebView2 Runtime (included in Windows 10/11). A running Ovner is closed briefly while installing.",
      cancel: "Cancel", go: "Install", working: "Installing…", needDir: "Choose a folder for the portable version.", uac: "Waiting for admin permission (UAC)…",
    },
  };
  const W = T[CFG.lang] || T.en;
  const $ = (id) => document.getElementById(id);
  const send = (m) => window.ipc && window.ipc.postMessage(JSON.stringify(m));
  let mode = CFG.user ? "user" : "machine";
  function card(key, name, desc, tag, admin) {
    const el = document.createElement("label");
    el.className = "opt"; el.dataset.mode = key;
    el.innerHTML = '<input type="radio" name="m"><div style="flex:1;min-width:0"><b></b><div class="d"></div></div>';
    el.querySelector("b").textContent = name;
    if (tag) { const s = document.createElement("span"); s.className = "tag" + (admin ? " admin" : ""); s.textContent = tag; el.querySelector("b").append(s); }
    el.querySelector(".d").textContent = desc;
    el.querySelector("input").onchange = () => select(key);
    return el;
  }
  function select(m) {
    mode = m;
    for (const o of document.querySelectorAll(".opt")) { const on = o.dataset.mode === m; o.classList.toggle("on", on); o.querySelector("input").checked = on; }
  }
  function render() {
    $("title").textContent = W.title; $("sub").textContent = W.sub;
    $("desktopL").textContent = W.desktop; $("note").textContent = W.note;
    $("cancel").textContent = W.cancel; $("go").textContent = W.go;
    const opts = $("opts");
    if (CFG.user) opts.append(card("user", W.user, W.userD(CFG.user), W.noadmin, false));
    opts.append(card("machine", W.machine, W.machineD + (CFG.machine ? " " + W.machineUp(CFG.machine) : ""), CFG.elevated ? "" : W.admin, true));
    const p = card("portable", W.portable, W.portableD, W.noadmin, false);
    const dir = document.createElement("div"); dir.className = "dir";
    dir.innerHTML = '<input id="pdir" spellcheck="false"><button id="browse" type="button"></button>';
    p.querySelector(".d").after(dir);
    opts.append(p);
    $("pdir").value = CFG.portableDir;
    $("browse").textContent = W.browse;
    $("browse").onclick = (e) => { e.preventDefault(); send({ t: "browse", dir: $("pdir").value }); };
    select(mode);
  }
  window.setDir = (d) => { $("pdir").value = d; select("portable"); };
  window.setStatus = (text, err) => {
    const s = $("status"); s.textContent = text || ""; s.className = err ? "err" : "";
    if (err) { $("go").disabled = false; $("cancel").disabled = false; }
  };
  $("cancel").onclick = () => send({ t: "cancel" });
  $("go").onclick = () => {
    const dir = $("pdir").value.trim();
    if (mode === "portable" && !dir) return setStatus(W.needDir, true);
    $("go").disabled = true; $("cancel").disabled = true;
    setStatus(mode === "machine" && !CFG.elevated ? W.uac : W.working, false);
    send({ t: "install", mode, dir, desktop: $("desktop").checked });
  };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") send({ t: "cancel" }); });
  render();
</script>
</body>
</html>
