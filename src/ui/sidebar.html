<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg: #dfe3e8; --hover: #eceff3; --active: #ffffff; --text: #1d2228; --muted: #5d6670; --line: #c9cfd6; --accent: #1863dc; --private: #6b3fc9; }
  :root[data-theme="dark"] { --bg: #1c1f23; --hover: #2a2e34; --active: #33383f; --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --private: #b592ff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1c1f23; --hover: #2a2e34; --active: #33383f; --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --private: #b592ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  #new { margin: 8px; height: 32px; border: 1px dashed var(--line); border-radius: 8px; background: none; color: var(--text); font: inherit; cursor: pointer; text-align: left; padding: 0 12px; }
  #new:hover { background: var(--hover); }
  #list { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
  .tab.out { opacity: .45; outline: 2px dashed currentColor; }
  .tab.dragging { opacity: .7; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .tab { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; border-radius: 8px; cursor: default; }
  .tab:hover { background: var(--hover); }
  .tab.active { background: var(--active); box-shadow: 0 1px 2px #0002; }
  .tab .ic { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); }
  .tab.private .ic { background: var(--private); }
  .tab .ic.img { background: center / 16px 16px no-repeat; }
  .tab.sleep .ic { background: var(--muted); }
  .tab.sleep .t { color: var(--muted); font-style: italic; }
  .tab.split { box-shadow: inset 3px 0 0 var(--accent); }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { flex: none; width: 22px; height: 22px; border: 0; border-radius: 50%; background: none; color: var(--muted); font-size: 15px; cursor: pointer; visibility: hidden; }
  .tab:hover .x, .tab.active .x { visibility: visible; }
  .tab .x:hover { background: var(--line); color: var(--text); }
  .tab.loading .ic { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<button id="new">+</button>
<div id="list"></div>
<script>
(function () {
  const send = (o) => window.ipc.postMessage(JSON.stringify(o));
  const list = document.getElementById("list");
  const els = new Map();
  // Seret tab untuk memindah urutannya (lepas = kirim posisi baru ke Ovner). Klik biasa tetap
  // mengaktifkan tab; seret baru dimulai setelah bergeser 6 piksel.
  let tabDragging = false;
  function tabDrag(el, id, box, axis) {
    el.dataset.id = id;
    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || e.target.closest(".x")) return;
      const start = axis === "x" ? e.clientX : e.clientY;
      let moved = false;
      const move = (ev) => {
        const pos = axis === "x" ? ev.clientX : ev.clientY;
        if (!moved) {
          if (Math.abs(pos - start) < 6) return;
          moved = true; tabDragging = true; el.classList.add("dragging");
          try { el.setPointerCapture(e.pointerId); } catch (x) {}
        }
        // Ditarik jauh keluar dari daftar tab: lepas ke jendela baru.
        el.classList.toggle("out", outside(ev));
        for (const s of box.querySelectorAll(".tab")) {
          if (s === el) continue;
          const r = s.getBoundingClientRect();
          const lo = axis === "x" ? r.left : r.top, hi = axis === "x" ? r.right : r.bottom;
          if (pos < lo || pos > hi) continue;
          if (pos < (lo + hi) / 2) { if (el.nextSibling !== s) box.insertBefore(el, s); }
          else if (s.nextSibling !== el) box.insertBefore(el, s.nextSibling);
          break;
        }
      };
      const outside = (ev) => {
        const r = box.getBoundingClientRect();
        return axis === "x" ? ev.clientY > r.bottom + 48 || ev.clientY < r.top - 48 : ev.clientX > r.right + 64 || ev.clientX < r.left - 64;
      };
      const up = (ev) => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        window.removeEventListener("pointercancel", up);
        if (!moved) return;
        el.classList.remove("dragging", "out");
        tabDragging = false;
        if (ev.type === "pointerup" && outside(ev)) {
          send({ cmd: "tab-detach", id, x: ev.screenX, y: ev.screenY });
          return;
        }
        const order = [...box.querySelectorAll(".tab")].map((x) => +x.dataset.id);
        send({ cmd: "tab-move", id, to: order.indexOf(id) });
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      window.addEventListener("pointercancel", up);
    });
  }

  const W = { id: { nt: "Tab baru", newk: "+  Tab baru", close: "Tutup tab (Ctrl+W)" }, en: { nt: "New tab", newk: "+  New tab", close: "Close tab (Ctrl+W)" } };
  let w = W.id;
  function letter(t) {
    const m = (t.title || t.url || "").replace(/^https?:\/\/(www\.)?/, "").match(/[A-Za-z0-9]/);
    return m ? m[0].toUpperCase() : "•";
  }
  function el(id) {
    let e = els.get(id);
    if (e) return e;
    e = document.createElement("div");
    const ic = document.createElement("span"); ic.className = "ic";
    const ti = document.createElement("span"); ti.className = "t";
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×";
    x.addEventListener("mousedown", (ev) => { ev.stopPropagation(); ev.preventDefault(); });
    x.addEventListener("click", (ev) => { ev.stopPropagation(); send({ cmd: "close", id }); });
    e.addEventListener("mousedown", (ev) => { if (ev.button === 0) send({ cmd: "activate", id }); else if (ev.button === 1) ev.preventDefault(); });
    e.addEventListener("auxclick", (ev) => { if (ev.button === 1) send({ cmd: "close", id }); });
    e.addEventListener("contextmenu", (ev) => { ev.preventDefault(); send({ cmd: "tabmenu", id, x: ev.clientX, y: ev.clientY, side: true }); });
    e.append(ic, ti, x);
    tabDrag(e, id, list, "y");
    els.set(id, e);
    return e;
  }
  // Data dari Ovner datang sebagai pesan WebView2 (bukan skrip) supaya proses halaman tidak
  // membengkak; ikon dikirim terpisah dan hanya saat berubah.
  let iconsCache = {};
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener("message", (e) => {
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      if (!m || typeof m !== "object") return;
      if (m.icons) window.ovner.icons(m.icons);
      if (m.render) window.ovner.render(m.render);
      if ("usage" in m && window.ovner.usage) window.ovner.usage(m.usage);
    });
  }
  window.ovner = {
    // Tab dari jendela lain dijatuhkan di titik (y) ini: pindahkan ke urutan yang sesuai.
    dropAt(id, x, y) {
      const p = y;
      const els = [...list.querySelectorAll(".tab")].filter((el) => +el.dataset.id !== id);
      let to = els.length;
      for (let k = 0; k < els.length; k++) { const e = els[k].getBoundingClientRect(); if (p < e.top + e.height / 2) { to = k; break; } }
      send({ cmd: "tab-move", id, to });
    },
    icons(map) { iconsCache = map || {}; },
    render(s) {
      s.icons = iconsCache;
      w = W[s.lang] || W.id;
      document.documentElement.dataset.theme = s.theme === "system" ? "" : s.theme;
      document.getElementById("new").textContent = w.newk;
      const keep = new Set();
      for (const t of s.tabs) {
        keep.add(t.id);
        const e = el(t.id);
        e.className = "tab" + (t.active ? " active" : "") + (t.sleeping ? " sleep" : "") + (t.loading ? " loading" : "") + (t.private ? " private" : "") + (t.split ? " split" : "");
        e.title = (t.title || w.nt) + "\n" + (t.url || "");
        let host = ""; try { host = new URL(t.url).hostname.replace(/^www\./, ""); } catch (x) {}
        const ico = s.icons && s.icons[host];
        e.children[0].className = "ic" + (ico ? " img" : "");
        e.children[0].style.backgroundImage = ico ? `url("${ico}")` : "";
        e.children[0].textContent = ico ? "" : letter(t);
        e.children[1].textContent = t.title || w.nt;
        e.children[2].title = w.close;
        if (!tabDragging) list.append(e);
        if (t.active && !tabDragging) e.scrollIntoView({ block: "nearest" });
      }
      for (const [id, e] of els) if (!keep.has(id)) { e.remove(); els.delete(id); }
    },
  };
  document.getElementById("new").onclick = () => send({ cmd: "newtab" });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  send({ cmd: "ready" });
})();
</script>
</body>
</html>
