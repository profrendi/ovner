<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tab baru</title>
<style>
  :root { --bg: #f4f6f8; --card: #fff; --text: #1d2228; --muted: #5d6670; --line: #d3d8de; --accent: #1863dc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1f23; --card: #262a30; --text: #e8eaed; --muted: #a2a9b1; --line: #3c424a; --accent: #7cacf8; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 var(--ovner-font, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif); }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 16px 12vh; }
  .logo { display: flex; align-items: center; gap: 12px; font-size: 34px; font-weight: 650; letter-spacing: -.5px; }
  .logo svg { width: 46px; height: 46px; }
  form { width: min(620px, 100%); }
  input { width: 100%; box-sizing: border-box; height: 48px; padding: 0 20px; border: 1px solid var(--line); border-radius: 24px;
    background: var(--card); color: var(--text); font: inherit; font-size: 16px; outline: none; box-shadow: 0 1px 3px #0001; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  p { margin: 0; color: var(--muted); font-size: 13px; text-align: center; max-width: 560px; }
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1863dc"/><stop offset="1" stop-color="#0ea6a0"/></linearGradient></defs>
      <circle cx="24" cy="24" r="23" fill="url(#g)"/>
      <circle cx="24" cy="24" r="13.5" fill="none" stroke="#fff" stroke-width="4.5"/>
      <circle cx="34.5" cy="34.5" r="9" fill="#fff"/><circle cx="34.5" cy="34.5" r="7" fill="#ff8c1a"/>
    </svg>
    Ovner
  </div>
  <form id="f"><input id="q" autocomplete="off" spellcheck="false"></form>
  <p id="tip"></p>
</main>
<script>
  const NT = {
    id: ["Tab baru", "Cari di web atau ketik alamat", "Iklan dan pelacak diblokir otomatis. Tab yang lama tidak dibuka akan ditidurkan supaya RAM tetap lega. Coba !w, !yt, atau !gh di depan kata kunci."],
    en: ["New tab", "Search the web or type an address", "Ads and trackers are blocked automatically. Tabs you haven't opened in a while go to sleep to keep RAM free. Try !w, !yt or !gh before a query."],
  };
  function setLang(l) {
    const w = NT[l] || NT.en;
    document.documentElement.lang = l; document.title = w[0];
    document.getElementById("q").placeholder = w[1]; document.getElementById("tip").textContent = w[2];
  }
  setLang((navigator.language || "id").toLowerCase().startsWith("id") ? "id" : "en");
  window.ovnerPage = (s) => {
    setLang(s.lang);
    if (s.theme === "dark" || s.theme === "light") document.documentElement.style.colorScheme = s.theme;
  };
  window.ipc.postMessage(JSON.stringify({ t: "page-ready" }));
  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = document.getElementById("q").value.trim();
    if (text) window.ipc.postMessage(JSON.stringify({ t: "go", text }));
  });
</script>
</body>
</html>
