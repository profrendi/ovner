<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sandi</title>
<link rel="stylesheet" href="ovner://page/page.css">
<style>
  body { margin: 0; }
  .shell { display: grid; grid-template-columns: 240px 1fr; gap: 24px; padding: 18px 22px; align-content: start; min-height: 100vh; box-sizing: border-box; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; }
  header h1 { margin: 0; font-size: 22px; min-width: 220px; display: flex; align-items: center; gap: 10px; }
  header input { flex: 1; max-width: 680px; }
  nav button { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; border: 0; background: none; padding: 10px 14px; border-radius: 8px; font: inherit; color: var(--text); cursor: pointer; }
  nav button.on { outline: 2px solid var(--accent); font-weight: 600; }
  nav button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  main { max-width: 720px; width: 100%; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .top h2 { margin: 0; text-transform: none; font-size: 18px; color: var(--text); letter-spacing: 0; }
  .card { margin-top: 12px; }
  .site { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 48px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .site:last-child { border-bottom: 0; }
  .site:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .site .n { flex: 1; } .site .c { color: var(--muted); font-size: 12.5px; margin-left: 8px; }
  .fi { width: 18px; height: 18px; border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: center / 16px 16px no-repeat; }
  .acc { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 120px 1fr auto; gap: 8px 12px; align-items: center; }
  .acc:last-child { border-bottom: 0; }
  .acc .k { color: var(--muted); font-size: 12.5px; }
  .acc .v { font-family: Consolas, "Cascadia Mono", monospace; word-break: break-all; }
  .acc .btns { display: flex; gap: 6px; grid-row: span 3; align-self: start; flex-direction: column; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); padding: 20px; width: min(460px, 90vw); }
  dialog::backdrop { background: #0006; }
  dialog label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; }
  dialog input, dialog textarea { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit; }
  dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .empty { padding: 26px; color: var(--muted); text-align: center; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <header><h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></svg><span id="h1"></span></h1><input type="search" id="q"></header>
  <nav><button id="navPw" class="on"></button><button id="navSet"></button></nav>
  <main>
    <section id="pwView">
      <div class="top"><h2 id="pwH"></h2><button id="add"></button></div>
      <p class="muted" id="pwIntro"></p>
      <div class="card" id="list"></div>
    </section>
    <section id="setView" class="hide">
      <div class="top"><h2 id="setH"></h2></div>
      <div class="card" id="setCard"></div>
    </section>
  </main>
</div>
<dialog id="dlg"><h2 id="dlgTitle" style="margin:0"></h2><div id="dlgBody"></div><div class="acts"><button id="dlgCancel"></button><button class="primary" id="dlgOk"></button></div></dialog>
<input type="file" id="file" accept=".csv" hidden>
<script>
(function () {
  const post = (o) => window.ipc.postMessage(JSON.stringify(o));
  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); Object.assign(e, attrs || {}); e.append(...kids); return e; };
  const W = {
    id: { h1: "Pengelola sandi", q: "Cari sandi", pw: "Sandi", set: "Pengaturan", add: "Tambah", intro: "Sandi disimpan terenkripsi dengan akun Windows Anda (DPAPI) dan hanya diisikan ke situs asalnya.",
      accounts: (n) => `${n} akun`, user: "Nama pengguna", pass: "Sandi", note: "Catatan", site: "Situs (alamat)", show: "Tampilkan", hideP: "Sembunyikan", copy: "Salin", edit: "Edit", del: "Hapus", save: "Simpan", cancel: "Batal",
      empty: "Belum ada sandi tersimpan. Masuk ke sebuah situs dan pilih Simpan, atau impor dari Brave/Chrome.", back: "← Semua sandi", confirmDel: "Hapus sandi ini?",
      offer: ["Tawarkan untuk menyimpan sandi", "Saat Anda masuk ke situs, Ovner menawarkan menyimpan sandinya."],
      auto: ["Masuk otomatis", "Bila situs hanya punya satu akun tersimpan, nama pengguna dan sandi langsung diisi."],
      fill: ["Isi otomatis alamat dan pembayaran", "Alamat, nomor telepon, dan kartu yang Anda ketik di formulir ditawarkan lagi (fitur Microsoft Edge WebView2)."],
      imp: ["Impor sandi", "Pilih berkas CSV hasil ekspor Brave, Chrome, Edge, atau Firefox."], impBtn: "Pilih berkas",
      exp: ["Ekspor sandi", "Simpan semua sandi ke berkas CSV. Hapus berkasnya setelah dipakai."], expBtn: "Unduh berkas",
      clr: ["Hapus semua data pengelola sandi", "Semua sandi tersimpan di Ovner dihapus permanen."], clrBtn: "Hapus data" },
    en: { h1: "Password Manager", q: "Search passwords", pw: "Passwords", set: "Settings", add: "Add", intro: "Passwords are stored encrypted with your Windows account (DPAPI) and only filled into their own site.",
      accounts: (n) => `${n} accounts`, user: "Username", pass: "Password", note: "Note", site: "Site (address)", show: "Show", hideP: "Hide", copy: "Copy", edit: "Edit", del: "Delete", save: "Save", cancel: "Cancel",
      empty: "No saved passwords yet. Sign in to a site and choose Save, or import from Brave/Chrome.", back: "← All passwords", confirmDel: "Delete this password?",
      offer: ["Offer to save passwords", "When you sign in to a site, Ovner offers to save the password."],
      auto: ["Sign in automatically", "If a site has only one saved account, the username and password are filled in right away."],
      fill: ["Autofill addresses and payments", "Addresses, phone numbers and cards you type into forms are offered again (Microsoft Edge WebView2 feature)."],
      imp: ["Import passwords", "Choose a CSV file exported from Brave, Chrome, Edge or Firefox."], impBtn: "Select file",
      exp: ["Export passwords", "Save all passwords to a CSV file. Delete it after use."], expBtn: "Download file",
      clr: ["Delete all Password Manager data", "All passwords saved in Ovner are permanently deleted."], clrBtn: "Delete data" },
  };
  let w = W.id, S = { logins: [], icons: {}, settings: {} }, open = null;
  const revealed = {};
  function icon(site) {
    const e = h("span", { className: "fi" });
    const ico = S.icons[site];
    if (ico) { e.style.backgroundImage = `url("${ico}")`; return e; }
    let n = 0; for (const c of site) n = (n * 31 + c.charCodeAt(0)) >>> 0;
    e.style.background = `hsl(${n % 360} 55% 45%)`;
    e.textContent = (site.match(/[a-z0-9]/i) || ["•"])[0].toUpperCase();
    return e;
  }
  function dialog(title, fields, ok) {
    $("dlgTitle").textContent = title;
    const body = $("dlgBody"); body.textContent = "";
    const inputs = {};
    for (const [key, lab, el] of fields) { body.append(h("label", { textContent: lab }), el); inputs[key] = el; }
    $("dlgOk").textContent = w.save; $("dlgCancel").textContent = w.cancel;
    $("dlgOk").onclick = () => { ok(inputs); $("dlg").close(); };
    $("dlgCancel").onclick = () => $("dlg").close();
    body.onkeydown = (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); $("dlgOk").click(); } };
    $("dlg").showModal();
  }
  function renderList() {
    const list = $("list"); list.textContent = "";
    const q = $("q").value.trim().toLowerCase();
    const items = S.logins.filter((l) => !q || l.site.includes(q) || l.user.toLowerCase().includes(q));
    if (open) {
      const mine = S.logins.filter((l) => l.site === open);
      const back = h("div", { className: "site" }, h("span", { className: "n", textContent: w.back }));
      back.onclick = () => { open = null; renderList(); };
      list.append(back);
      for (const l of mine) {
        const pv = h("span", { className: "v", textContent: revealed[l.id] || "••••••••••" });
        const acc = h("div", { className: "acc" });
        const btns = h("div", { className: "btns" });
        const b = (text, fn) => { const x = h("button", { textContent: text }); x.onclick = fn; btns.append(x); };
        b(revealed[l.id] ? w.hideP : w.show, () => { if (revealed[l.id]) { delete revealed[l.id]; renderList(); } else post({ t: "pw-reveal", id: l.id }); });
        b(w.copy, () => { if (revealed[l.id]) navigator.clipboard.writeText(revealed[l.id]); else { post({ t: "pw-reveal", id: l.id }); copyNext = l.id; } });
        b(w.edit, () => dialog(w.edit, [["user", w.user, h("input", { value: l.user })], ["pass", w.pass + " (kosong = tetap)", h("input", { type: "password", value: "" })], ["note", w.note, h("textarea", { value: l.note })]],
          (i) => post({ t: "pw-edit", id: l.id, user: i.user.value, pass: i.pass.value, note: i.note.value })));
        b(w.del, () => { if (confirm(w.confirmDel)) post({ t: "pw-delete", id: l.id }); });
        acc.append(h("span", { className: "k", textContent: w.user }), h("span", { className: "v", textContent: l.user || "—" }), btns,
          h("span", { className: "k", textContent: w.pass }), pv,
          h("span", { className: "k", textContent: w.site }), h("span", { className: "v", textContent: l.url }));
        list.append(acc);
      }
      return;
    }
    const sites = [];
    for (const l of items) if (!sites.includes(l.site)) sites.push(l.site);
    sites.sort();
    if (!sites.length) { list.append(h("div", { className: "empty", textContent: w.empty })); return; }
    for (const s of sites) {
      const n = items.filter((l) => l.site === s).length;
      const r = h("div", { className: "site" }, icon(s), h("span", { className: "n" }, s, h("span", { className: "c", textContent: n > 1 ? w.accounts(n) : "" })), h("span", { textContent: "›" }));
      r.onclick = () => { open = s; renderList(); };
      list.append(r);
    }
  }
  let copyNext = null;
  window.ovnerReveal = (id, pass) => {
    revealed[id] = pass;
    if (copyNext === id) { navigator.clipboard.writeText(pass); copyNext = null; }
    renderList();
  };
  function renderSettings() {
    const c = $("setCard"); c.textContent = "";
    const toggle = ([lab, hint], key) => {
      const inp = h("input", { type: "checkbox", checked: !!S.settings[key] });
      inp.onchange = () => post({ t: "set", key, value: inp.checked });
      const row = h("div", { className: "row" });
      row.append(h("div", { className: "lbl", innerHTML: `${lab}<small>${hint}</small>` }), h("label", { className: "switch" }, inp, h("span")));
      c.append(row);
    };
    const action = ([lab, hint], text, fn) => {
      const b = h("button", { textContent: text }); b.onclick = fn;
      const row = h("div", { className: "row" });
      row.append(h("div", { className: "lbl", innerHTML: `${lab}<small>${hint}</small>` }), b);
      c.append(row);
    };
    toggle(w.offer, "password_manager");
    toggle(w.auto, "password_autosignin");
    toggle(w.fill, "autofill");
    action(w.imp, w.impBtn, () => $("file").click());
    action(w.exp, w.expBtn, () => post({ t: "pw-export" }));
    action(w.clr, w.clrBtn, () => post({ t: "pw-clear" }));
  }
  function view(set) {
    $("navPw").classList.toggle("on", !set); $("navSet").classList.toggle("on", set);
    $("pwView").classList.toggle("hide", set); $("setView").classList.toggle("hide", !set);
  }
  $("navPw").onclick = () => view(false);
  $("navSet").onclick = () => view(true);
  $("add").onclick = () => dialog(w.add, [["url", w.site, h("input", { value: "https://" })], ["user", w.user, h("input")], ["pass", w.pass, h("input", { type: "password" })]],
    (i) => post({ t: "pw-add", url: i.url.value, user: i.user.value, pass: i.pass.value }));
  $("file").onchange = () => {
    const f = $("file").files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => post({ t: "pw-import-csv", csv: String(r.result) });
    r.readAsText(f); $("file").value = "";
  };
  window.ovnerSave = (name, type, text) => {
    const a = h("a", { href: URL.createObjectURL(new Blob([text], { type })), download: name });
    document.body.append(a); a.click(); a.remove();
  };
  $("q").oninput = () => { open = null; renderList(); };
  window.ovnerPage = (s) => {
    S = s; w = W[s.lang] || W.id;
    document.documentElement.lang = s.lang;
    document.documentElement.dataset.theme = s.theme === "system" ? "" : s.theme;
    document.title = w.h1; $("h1").textContent = w.h1; $("q").placeholder = w.q;
    $("navPw").textContent = w.pw; $("navSet").textContent = w.set; $("pwH").textContent = w.pw; $("setH").textContent = w.set;
    $("add").textContent = w.add; $("pwIntro").textContent = w.intro;
    if (open && !S.logins.some((l) => l.site === open)) open = null;
    renderList(); renderSettings();
  };
  post({ t: "page-ready" });
})();
</script>
</body>
</html>
