<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #dfe3e8; --tab-hover: #eceff3; --tab-active: #ffffff; --bar: #ffffff; --field: #eef1f4; --field-focus: #ffffff;
    --text: #1d2228; --muted: #5d6670; --line: #c9cfd6; --accent: #1863dc; --shield: #e8730c; --ok: #148a4a; --private: #6b3fc9;
  }
  :root[data-theme="dark"] {
    --bg: #1c1f23; --tab-hover: #2a2e34; --tab-active: #33383f; --bar: #33383f; --field: #24282d; --field-focus: #1c1f23;
    --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --shield: #ff9a3d; --ok: #5fd08f; --private: #b592ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1f23; --tab-hover: #2a2e34; --tab-active: #33383f; --bar: #33383f; --field: #24282d; --field-focus: #1c1f23;
      --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --shield: #ff9a3d; --ok: #5fd08f; --private: #b592ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  #tabs { height: 36px; display: flex; align-items: flex-end; padding: 0 6px; gap: 2px; overflow: hidden; }
  .tab { position: relative; flex: 0 1 220px; min-width: 48px; height: 30px; display: flex; align-items: center;
    gap: 7px; padding: 0 6px 0 10px; border-radius: 8px 8px 0 0; cursor: default; }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--tab-active); }
  .tab.out { opacity: .45; outline: 2px dashed currentColor; }
  .tab.dragging { opacity: .7; box-shadow: 0 2px 8px rgba(0,0,0,.35); z-index: 2; }
  .tab .ic { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); }
  .tab.private .ic { background: var(--private); }
  .tab .ic.img, .bm .fi.img { background: center / 16px 16px no-repeat; }
  .tab.sleep .ic { background: var(--muted); }
  .tab.sleep .t { color: var(--muted); font-style: italic; }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { flex: none; width: 20px; height: 20px; border: 0; border-radius: 50%; background: none; color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer; }
  .tab .x:hover { background: var(--line); color: var(--text); }
  .tab.loading .ic { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #new { flex: none; width: 28px; height: 28px; margin-bottom: 2px; border: 0; border-radius: 6px; background: none;
    color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
  #new:hover { background: var(--tab-hover); }
  #bar { height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bar); }
  .b { flex: none; width: 32px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--text);
    display: grid; place-items: center; cursor: pointer; }
  .b:hover { background: var(--field); }
  .b:disabled { opacity: .35; cursor: default; }
  .b svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .b.hidden { display: none; }
  #addrwrap { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
  #addr { width: 100%; height: 30px; border: 1px solid transparent; border-radius: 15px; padding: 0 36px 0 36px;
    background: var(--field); color: var(--text); font: inherit; font-size: 14px; outline: none; user-select: text; }
  #addr:focus { background: var(--field-focus); border-color: var(--accent); }
  #star { position: absolute; right: 4px; width: 26px; height: 26px; color: var(--muted); }
  /* Ikon asli situs di kiri kolom alamat (tanpa kotak warna). */
  #ghost { position: absolute; top: 0; height: 30px; line-height: 30px; pointer-events: none; white-space: pre; overflow: hidden; display: none;
    font: inherit; font-size: 14px; color: var(--muted); }
  #ghost.show { display: block; }
  #ghost b { font-weight: inherit; background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--text); border-radius: 2px; }
  #measure { position: absolute; visibility: hidden; white-space: pre; font: inherit; font-size: 14px; left: -9999px; top: 0; }
  #siteicon { position: absolute; left: 11px; width: 16px; height: 16px; background: center / 16px 16px no-repeat; pointer-events: none; color: var(--muted); }
  #siteicon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  /* Indikator pemakaian RAM/CPU/GPU (ujung kanan baris tab, dekat tombol minimize). */
  #usage { flex: none; margin-left: auto; align-self: center; display: none; gap: 10px; padding: 3px 10px; border-radius: 10px;
    background: var(--field); color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: default; }
  #usage.show { display: flex; }
  #usage b { color: var(--text); font-weight: 600; }
  #usage .sep { opacity: .5; }
  #bar #usage { margin-left: 0; }
  #star.on { color: var(--shield); }
  #star.on svg { fill: currentColor; }
  #shield { width: auto; min-width: 32px; padding: 0 8px; gap: 4px; display: flex; align-items: center; color: var(--shield); font-weight: 600; }
  #shield.off { color: var(--muted); }
  #shield.off svg { stroke-dasharray: 3 2; }
  #upd { display: none; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: var(--ok); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; }
  #upd.show { display: block; }
  #bmbar { height: 30px; display: none; align-items: center; gap: 2px; padding: 0 6px; background: var(--bar); overflow: hidden; }
  #bmbar.show { display: flex; }
  #bmitems { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow: hidden; }
  .bm { flex: none; max-width: 170px; height: 24px; padding: 0 8px 0 6px; border: 0; border-radius: 6px; background: none; color: var(--text);
    font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bm:hover { background: var(--field); }
  .bm .lb { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .bm .fi { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; }
  .bm svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .bm.hide { display: none; }
  #bmmore, #bmother { flex: none; }
  #bmmore { width: 26px; padding: 0; justify-content: center; font-size: 15px; }
  .bmsep { flex: none; width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
  #find { height: 34px; display: none; align-items: center; gap: 6px; padding: 0 8px 0 14px; background: var(--bar); }
  #find.show { display: flex; }
  #findq { width: 280px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: var(--field); color: var(--text);
    font: inherit; outline: none; user-select: text; }
  #findq:focus { border-color: var(--accent); }
  .line { height: 1px; background: var(--line); }
  .tab.split { box-shadow: inset 0 -2px 0 var(--accent); }
  html, body { overflow: hidden; }
  #ov { position: absolute; left: 0; right: 0; }
  #omni { position: absolute; display: none; background: var(--bar); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px;
    box-shadow: 0 10px 24px #0004; padding: 4px 0 6px; }
  #omni.show { display: block; }
  .om { display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 14px; cursor: default; }
  .om.sel, .om:hover { background: var(--field); }
  .om .oi { flex: none; width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); background: center / 16px 16px no-repeat; border-radius: 3px; }
  .om .oi svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .om .ot { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
  .om .ou { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--accent); font-size: 12.5px; }
  #bubble { position: absolute; right: 8px; top: 4px; width: 360px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 28px #0005; padding: 12px 14px; }
  #bubble.show { display: block; }
  #bubble h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
  #bubble .xb { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .bb { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .bb button { height: 30px; padding: 0 14px; border-radius: 15px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; cursor: pointer; }
  .bb button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pwf { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 13px; }
  .pwf .k { color: var(--muted); }
  .di { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-radius: 8px; }
  .di:hover { background: var(--field); }
  .di .dn { flex: 1; min-width: 0; }
  .di .dn b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .di .ds { font-size: 11.5px; color: var(--muted); }
  .di .pb { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .di .pb i { display: block; height: 100%; background: var(--accent); }
  .di .db { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; }
  .di .db:hover { background: var(--line); color: var(--text); }
  .dall { display: block; width: 100%; margin-top: 6px; padding: 8px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font: inherit; cursor: pointer; text-align: center; }
  /* Download box v2 (seperti Mister Download Manager), di dalam gelembung unduhan. */
  #bubble.v2 { width: 470px; }
  #bubble.v2 .dls { max-height: 430px; overflow-y: auto; overscroll-behavior: contain; }
  #bubble.v2 .di { align-items: flex-start; padding: 10px 6px; border-bottom: 1px solid var(--line); border-radius: 0; }
  #bubble.v2 .di:last-child { border-bottom: 0; }
  #bubble.v2 .pb { height: 8px; border-radius: 4px; margin: 6px 0 4px; display: flex; gap: 1px; background: none; }
  #bubble.v2 .pb span { flex: 1; background: var(--line); border-radius: 2px; overflow: hidden; }
  #bubble.v2 .pb span i { display: block; height: 100%; background: #2ea043; }
  #bubble.v2 .pb span.busy i { background: var(--accent); }
  #bubble.v2 .pb.ind span i { width: 35%; animation: dlind 1.1s linear infinite; }
  @keyframes dlind { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  #bubble.v2 .dg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; font-size: 11.5px; margin-top: 2px; }
  #bubble.v2 .dg div { min-width: 0; }
  #bubble.v2 .dg span { display: block; color: var(--muted); font-size: 10.5px; }
  #bubble.v2 .dg b { font-weight: 600; font-size: 12px; display: block; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #bubble.v2 .sv { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.45; overflow-wrap: anywhere; }
  #bubble.v2 .sv b { display: inline; font-size: inherit; cursor: auto; color: var(--text); font-weight: 600; white-space: normal; }
  #bubble.v2 .ping.near { color: #2ea043; } #bubble.v2 .ping.mid { color: #d29922; } #bubble.v2 .ping.far { color: #e5534b; }
  #bubble.v2 .sv b.yes { color: #2ea043; } #bubble.v2 .sv b.no { color: #e5534b; }
  #bubble.v2 .tg { display: inline-block; font-size: 10.5px; padding: 0 6px; border-radius: 8px; background: var(--field); color: var(--muted); margin-left: 6px; font-weight: 500; vertical-align: 1px; }
  #bubble.v2 .pc { float: right; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
  #dlbtn { display: none; position: relative; }
  #dlbtn.show { display: grid; }
  #dlbtn.busy svg { color: var(--accent); }
  #darkbtn.on { color: var(--accent); }
  #darkpanel { position: absolute; right: 48px; top: 4px; width: 330px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 28px #0005; padding: 12px 14px; font-size: 13px; }
  #darkpanel.show { display: block; }
  #vidpanel { position: absolute; right: 90px; top: 4px; width: 300px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.28); padding: 12px 14px; color: var(--text); font-size: 13px; }
  #vidpanel.show { display: block; }
  /* Dialog "Unduh video dari halaman" (seperti Mister Download Manager). */
  #viddlg { position: absolute; left: calc(50% - 290px); top: 6px; width: 580px; display: none; background: var(--bar); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.35); padding: 14px 16px; font-size: 13px; box-sizing: border-box; }
  #viddlg.show { display: block; }
  #viddlg h3 { margin: 0 0 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #viddlg h3 button { all: unset; cursor: pointer; padding: 2px 6px; border-radius: 6px; color: var(--muted); }
  #viddlg h3 button:hover { background: var(--tab-hover); }
  #viddlg .lbl { color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
  #viddlg .row { display: flex; gap: 8px; align-items: center; }
  #viddlg input[type=text], #viddlg select { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; }
  #viddlg button.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; cursor: pointer; }
  #viddlg button.btn:hover { border-color: var(--accent); }
  #viddlg button.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  #viddlg button.btn:disabled { opacity: .5; cursor: default; }
  #viddlg .ttl { font-weight: 600; margin: 10px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #viddlg .list { height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
  #viddlg .it { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: default; }
  #viddlg .it:hover { background: var(--tab-hover); }
  #viddlg .it.sel { background: var(--accent); color: #fff; }
  #viddlg .it .sz { margin-left: auto; font-variant-numeric: tabular-nums; }
  #viddlg .it svg { width: 16px; height: 16px; flex: none; }
  #viddlg .msg { padding: 14px; color: var(--muted); }
  #viddlg .msg.err { color: #d93025; }
  #viddlg .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #viddlg .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  #viddlg label.chk { display: flex; gap: 6px; align-items: center; white-space: nowrap; color: var(--text); }
  #vidpanel h3 { margin: 0 0 4px; font-size: 14px; }
  #vidpanel .t { color: var(--muted); font-size: 12px; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vidpanel button.f { display: flex; width: 100%; justify-content: space-between; align-items: center; margin: 5px 0; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; cursor: pointer; text-align: left; }
  #vidpanel button.f:hover { border-color: var(--accent); }
  #vidpanel button.f small { color: var(--muted); }
  #vidpanel .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  #vidbtn[hidden] { display: none; }
  /* Kotak "Bookmark ditambahkan" seperti Chrome. */
  #bmdlg { position: absolute; right: 120px; top: 4px; width: 420px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 28px #0005; padding: 16px 18px; color: var(--text); font-size: 13px; }
  #bmdlg.show { display: flex; gap: 16px; }
  #bmdlg .pic { width: 92px; height: 92px; flex: none; border-radius: 10px; background: var(--field); display: grid; place-items: center; border: 1px solid var(--line); }
  #bmdlg .pic span { transform: scale(1.4); }
  #bmdlg .fm { flex: 1; min-width: 0; }
  #bmdlg h3 { margin: 0 0 12px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  #bmdlg h3 button { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  #bmdlg label { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--muted); }
  #bmdlg input, #bmdlg select { height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; padding: 0 10px; min-width: 0; }
  #bmdlg input:focus, #bmdlg select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #bmdlg .bb { margin-top: 4px; }
  /* Seret-dan-lepas bookmark: garis tempat jatuh dan folder yang dituju. */
  .bm.dropL { box-shadow: inset 2px 0 0 var(--accent); }
  .bm.dropR { box-shadow: inset -2px 0 0 var(--accent); }
  .bm.dropIn, .bmm .r.dropIn { background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .bmm .r.dropT { box-shadow: inset 0 2px 0 var(--accent); }
  .bmm .r.dropB { box-shadow: inset 0 -2px 0 var(--accent); }
  .bm.dragging, .bmm .r.dragging { opacity: .45; }
  /* Menu klik kanan bookmark (seperti Brave): Edit, Potong, Salin, Tempel, Hapus. */
  #bmctx { position: absolute; display: none; min-width: 230px; background: var(--bar); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 8px 24px #0006; padding: 5px; color: var(--text); font-size: 13px; z-index: 30; }
  #bmctx.show { display: block; }
  #bmctx .ci { display: flex; justify-content: space-between; gap: 24px; height: 30px; align-items: center; padding: 0 14px; border-radius: 5px; cursor: default; }
  #bmctx .ci:hover { background: var(--field); }
  #bmctx .ci.off { opacity: .4; pointer-events: none; }
  #bmctx .ci kbd { font: inherit; color: var(--muted); font-size: 12px; }
  #bmctx hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }
  .bm.cut, .bmm .r.cut { opacity: .5; }
  #darkpanel h3 { margin: 0 0 2px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #darkpanel .site { color: var(--muted); font-size: 12px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #darkpanel .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  #darkpanel .seg button { flex: 1; border: 0; background: none; color: var(--text); padding: 6px 4px; font: inherit; cursor: pointer; }
  #darkpanel .seg button + button { border-left: 1px solid var(--line); }
  #darkpanel .seg button.on { background: var(--accent); color: #fff; }
  #darkpanel label.r { display: grid; grid-template-columns: 96px 1fr 40px; align-items: center; gap: 8px; margin: 6px 0; }
  #darkpanel label.r span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  #darkpanel select { width: 100%; background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  #darkpanel input[type=range] { width: 100%; accent-color: var(--accent); }
  #darkpanel .k { color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
  #darkpanel .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  /* Menu folder bookmark seperti Brave: ikon situs, baris lega, submenu ke samping. */
  .bmm { position: absolute; min-width: 260px; max-width: 440px; max-height: 620px; overflow-y: auto; background: var(--bar); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 10px 28px #0006; padding: 6px; font-size: 13.5px; }
  .bmm .r { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 12px 0 10px; border-radius: 6px; cursor: default; white-space: nowrap; }
  .bmm .r:hover, .bmm .r.open { background: var(--field); }
  .bmm .r .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .bmm .r .fi { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; }
  .bmm .r .fi.img { background: center / 16px 16px no-repeat; }
  .bmm .r svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .bmm .r .ar { flex: none; color: var(--muted); font-size: 12px; }

      shOn: (n, r) => `${n} ads/trackers blocked on this page${r ? "" : " (full lists are downloading)"}.\nClick to adjust Shields for this site.`, bm: "★ " },
  };
  let W = D.id;
  const $ = (id) => document.getElementById(id);
  const tabsEl = $("tabs"), addr = $("addr"), findq = $("findq");
  let state = { tabs: [], url: "", loading: false, bookmarks: [] };
  const reloadIcon = $("reload").innerHTML;
  const stopIcon = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function letter(t) {
    const m = (t.title || t.url || "").replace(/^https?:\/\/(www\.)?/, "").match(/[A-Za-z0-9]/);
    return m ? m[0].toUpperCase() : "•";
  }

  // Elemen tab dipakai ulang (berdasarkan id) supaya klik tidak hilang saat toolbar
  // diperbarui di tengah klik, misalnya tombol × pada tab yang sedang dimuat.
  const tabEls = new Map();
  // Seret tab untuk memindah urutannya (lepas = kirim posisi baru ke Ovner). Klik biasa tetap
  // mengaktifkan tab; seret baru dimulai setelah bergeser 6 piksel.
  let tabDragging = false;
  function tabDrag(el, id, box, axis) {
    el.dataset.id = id;
    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || e.target.closest(".x")) return;
      const start = axis === "x" ? e.clientX : e.clientY;
      let moved = false;
      const move = (ev) => {
        const pos = axis === "x" ? ev.clientX : ev.clientY;
        if (!moved) {
          if (Math.abs(pos - start) < 6) return;
          moved = true; tabDragging = true; el.classList.add("dragging");
          try { el.setPointerCapture(e.pointerId); } catch (x) {}
        }
        // Ditarik jauh keluar dari daftar tab: lepas ke jendela baru.
        el.classList.toggle("out", outside(ev));
        for (const s of box.querySelectorAll(".tab")) {
          if (s === el) continue;
          const r = s.getBoundingClientRect();
          const lo = axis === "x" ? r.left : r.top, hi = axis === "x" ? r.right : r.bottom;
          if (pos < lo || pos > hi) continue;
          if (pos < (lo + hi) / 2) { if (el.nextSibling !== s) box.insertBefore(el, s); }
          else if (s.nextSibling !== el) box.insertBefore(el, s.nextSibling);
          break;
        }
      };
      const outside = (ev) => {
        const r = box.getBoundingClientRect();
        return axis === "x" ? ev.clientY > r.bottom + 48 || ev.clientY < r.top - 48 : ev.clientX > r.right + 64 || ev.clientX < r.left - 64;
      };
      const up = (ev) => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        window.removeEventListener("pointercancel", up);
        if (!moved) return;
        el.classList.remove("dragging", "out");
        tabDragging = false;
        if (ev.type === "pointerup" && outside(ev)) {
          send({ cmd: "tab-detach", id, x: ev.screenX, y: ev.screenY });
          return;
        }
        const order = [...box.querySelectorAll(".tab")].map((x) => +x.dataset.id);
        send({ cmd: "tab-move", id, to: order.indexOf(id) });
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      window.addEventListener("pointercancel", up);
    });
  }

  function tabEl(id) {
    let el = tabEls.get(id);
    if (el) return el;
    el = document.createElement("div");
    const ic = document.createElement("span"); ic.className = "ic";
    const ti = document.createElement("span"); ti.className = "t";
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×";
    x.addEventListener("mousedown", (e) => { e.stopPropagation(); e.preventDefault(); });
    x.addEventListener("click", (e) => { e.stopPropagation(); send({ cmd: "close", id }); });
    el.addEventListener("mousedown", (e) => { if (e.button === 0) send({ cmd: "activate", id }); else if (e.button === 1) e.preventDefault(); });
    el.addEventListener("auxclick", (e) => { if (e.button === 1) send({ cmd: "close", id }); });
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); send({ cmd: "tabmenu", id, x: e.clientX, y: e.clientY }); });

    tabDrag(el, id, tabsEl, "x");
    tabEls.set(id, el);
    return el;
  }
  function renderTabs() {
    const plus = $("new");
    const keep = new Set();
    for (const t of state.tabs) {
      keep.add(t.id);
      const el = tabEl(t.id);
      el.className = "tab" + (t.active ? " active" : "") + (t.sleeping ? " sleep" : "") + (t.loading ? " loading" : "") + (t.private ? " private" : "") + (t.split ? " split" : "");
      el.title = (t.title || W.newtab) + (t.private ? W.priv : "") + (t.sleeping ? W.sleep : "");
      const ico = state.icons && state.icons[hostOf(t.url)];
      el.children[0].className = "ic" + (ico ? " img" : "");
      el.children[0].style.backgroundImage = ico ? `url("${ico}")` : "";
      el.children[0].textContent = ico ? "" : letter(t);
      el.children[1].textContent = t.title || W.newtab;
      el.children[2].title = W.close;
      if (el.nextSibling !== plus && tabsEl.lastChild !== el) { /* urutan diperbaiki di bawah */ }
      if (!tabDragging) tabsEl.insertBefore(el, plus);
    }
    for (const [id, el] of tabEls) if (!keep.has(id)) { el.remove(); tabEls.delete(id); }
  }

  const globeSvg = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>';
  const lockSvg = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  function renderSiteIcon() {
    const el = $("siteicon");
    const t = (state.tabs || []).find((x) => x.active);
    const u = t ? t.url : "";
    const ico = u && state.icons && state.icons[hostOf(u)];
    if (ico) { el.innerHTML = ""; el.style.backgroundImage = `url("${ico}")`; }
    else { el.style.backgroundImage = ""; el.innerHTML = /^https:/.test(u) ? lockSvg : globeSvg; }
  }
  const mb = (b) => (b >= 1073741824 ? (b / 1073741824).toFixed(2) + " GB" : Math.round(b / 1048576) + " MB");
  const pct = (v) => (v >= 10 ? Math.round(v) : (Math.round(v * 10) / 10)) + "%";
  let curUsage = null;
  function renderUsage() {
    const el = $("usage");
    const u = curUsage;
    // Saat tab vertikal, baris tab tersembunyi: indikator pindah ke baris alamat.
    const home = state.vertical ? $("bar") : $("tabs");
    if (el.parentElement !== home) home.insertBefore(el, state.vertical ? $("menu") : null);
    // Di Windows angka ini tampil di bilah judul (dekat tombol minimize), tidak memakan baris tab.
    if (!u || (!u.app && !u.tab) || u.title) { el.classList.remove("show"); return; }
    let html = "";
    if (u.app) html += `<span title="${W.usageApp}">Ovner <b>${mb(u.app.ram)}</b> · CPU <b>${pct(u.app.cpu)}</b> · GPU <b>${pct(u.app.gpu)}</b></span>`;
    if (u.app && u.tab) html += `<span class="sep">|</span>`;
    if (u.tab) html += `<span title="${W.usageTab}">${W.tab} <b>${u.tab.ram ? mb(u.tab.ram) : "—"}</b>${u.tab.proc ? "" : " JS"}${u.tab.shared > 1 ? "*" : ""} · CPU <b>${pct(u.tab.cpu)}</b></span>`;
    el.innerHTML = html;
    el.classList.add("show");
  }

  const folderSvg = '<svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7v9.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>';
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
  function badge(u, title) {
    const h = hostOf(u) || title || "?";
    let n = 0; for (const c of h) n = (n * 31 + c.charCodeAt(0)) >>> 0;
    const el = document.createElement("span"); el.className = "fi";
    const ico = state.icons && state.icons[hostOf(u)];
    if (ico) { el.classList.add("img"); el.style.backgroundImage = `url("${ico}")`; return el; }
    el.style.background = `hsl(${n % 360} 55% 45%)`;
    el.textContent = (h.match(/[a-z0-9]/i) || ["•"])[0].toUpperCase();
    return el;
  }
  let bmKey = "";
  function renderBookmarks() {
    const bar = $("bmbar");
    bar.classList.toggle("show", !!state.bookmarkBar);
    if (!state.bookmarkBar) return;
    const list = state.bookmarks || [];
    const key = JSON.stringify(list) + W.other + Object.keys(state.icons || {}).length;
    if (key === bmKey) { fitBookmarks(); return; }
    bmKey = key;
    const box = $("bmitems"); box.textContent = "";
    // Item di bilah: bookmark tanpa folder dan folder tingkat pertama, sesuai urutan.
    const seen = new Set();
    list.forEach((b, i) => {
      if (b.folder === "@other" || b.folder.startsWith("@other/")) return;
      if (!b.folder) {
        const el = document.createElement("button"); el.className = "bm"; el.title = b.title + "\n" + b.url;
        const lb = document.createElement("span"); lb.className = "lb"; lb.textContent = b.title;
        el.append(badge(b.url, b.title), lb);
        el.dataset.i = i;
        barDnD(el, { url: b.url }, box.children.length);
        el.onclick = () => send({ cmd: "open", url: b.url });
        el.onauxclick = (e) => { if (e.button === 1) send({ cmd: "open", url: b.url, newtab: true }); };
        box.append(el);
        return;
      }
      const top = b.folder.split("/")[0];
      if (seen.has(top)) return;
      seen.add(top);
      const el = document.createElement("button"); el.className = "bm"; el.title = top;
      el.innerHTML = folderSvg;
      const lb = document.createElement("span"); lb.className = "lb"; lb.textContent = top;
      el.append(lb);
      el.dataset.f = top;
      barDnD(el, { folder: top }, box.children.length);
      el.onclick = () => toggleBmMenu(el, () => folderEntries(top));
      el.onmouseenter = () => { if (bmOpenBtn && bmOpenBtn !== el) openBmMenu(el, () => folderEntries(top)); };
      box.append(el);
    });
    if (!box.children.length) {
      const el = document.createElement("span"); el.className = "bm"; el.style.color = "var(--muted)";
      el.textContent = W.bmEmpty;
      box.append(el);
    }
    const hasOther = list.some((b) => b.folder === "@other" || b.folder.startsWith("@other/"));
    const other = $("bmother");
    other.style.display = hasOther ? "" : "none";
    $("bmsep").style.display = hasOther ? "" : "none";
    other.innerHTML = folderSvg + `<span class="lb"></span>`;
    other.querySelector(".lb").textContent = W.other;
    fitBookmarks();
  }
  // Sembunyikan item yang tidak muat lalu tampilkan tombol » seperti Brave.
  function fitBookmarks() {
    const box = $("bmitems"), more = $("bmmore");
    const items = [...box.children].filter((e) => e.dataset.i || e.dataset.f);
    items.forEach((e) => e.classList.remove("hide"));
    more.style.display = "none";
    const limit = box.getBoundingClientRect().right;
    let over = items.some((e) => e.getBoundingClientRect().right > limit + 0.5);
    if (!over) return;
    more.style.display = "";
    const limit2 = box.getBoundingClientRect().right;
    for (const e of items) if (e.getBoundingClientRect().right > limit2 + 0.5) e.classList.add("hide");
  }
  // ---- Menu folder bookmark (HTML, seperti Brave) ----
  let bmOpenBtn = null;
  function folderEntries(path) {
    // Isi satu folder sesuai urutan: subfolder (di posisi kemunculan pertamanya) dan bookmark.
    const out = [], seen = new Set();
    (state.bookmarks || []).forEach((b) => {
      if (b.folder === path) out.push({ b });
      else if (b.folder.startsWith(path + "/")) {
        const name = b.folder.slice(path.length + 1).split("/")[0];

  function showPanel(list, x, y, level, alignRight, parent) {
    const box = $("bmmenus");

    list.forEach((e, idx) => {
      const row = document.createElement("div"); row.className = "r";

      const t = document.createElement("span"); t.className = "t";

        const b = e.b;

          [...box.querySelectorAll(".bmm")].forEach((q) => { if (Number(q.dataset.level) > level) q.remove(); });

  // ---- Kotak "Bookmark ditambahkan" (nama, folder, Selesai, Hapus) ----

  // ---- Menu klik kanan bookmark (bilah dan menu folder) + tombol Delete ----
  // `it`: {url, title, from} untuk bookmark atau {folder} untuk folder; `after()`: tempat
  // "Tempel" (sesudah item ini) → {dest, beforeUrl, beforeFolder}; `into`: folder tujuan bila
  // item ini folder.
  let clip = null, hoverIt = null;
  function ctxClose() { const c = $("bmctx"); if (c.classList.contains("show")) { c.classList.remove("show"); sendHeight(); } }
  function bmDelete(it) {
    if (it.url) send({ cmd: "bm-delete", url: it.url, from: it.from || "" });
    else if (it.folder) send({ cmd: "bm-delete", folder: it.folder });

  function renameFolder(path) {
    const d = $("bmdlg");

    d.dataset.folder = "1";
    d.innerHTML = `<div class="fm"><h3><span></span><button class="x">×</button></h3><label><span></span><input></label><div class="bb"><button class="pri dn"></button></div></div>`;

    d.querySelector(".dn").textContent = W.bmDone; d.querySelector(".dn").onclick = done;
    d.querySelector(".x").onclick = close;

  function ctxMenu(ev, it, after, into) {
    ev.preventDefault(); ev.stopPropagation();
    const c = $("bmctx"); c.textContent = "";
    const add = (label, fn, on = true, key = "") => {
      const r = document.createElement("div"); r.className = "ci" + (on ? "" : " off");
      r.innerHTML = "<span></span><kbd></kbd>"; r.firstChild.textContent = label; r.lastChild.textContent = key;
      r.onmousedown = (e) => e.preventDefault();
      r.onclick = () => { ctxClose(); fn(); };
      c.append(r);
    };

    const pasteAt = into ? { dest: into } : after ? after() : { dest: "" };
    const paste = () => {
      if (!clip) return;
      send({ cmd: "bm-paste", mode: clip.mode, url: clip.url || "", from: clip.from || "", folder: clip.folder || "", dest: pasteAt.dest,
        beforeUrl: pasteAt.beforeUrl || "", beforeFolder: pasteAt.beforeFolder || "" });
      if (clip.mode === "cut") clip = null;
    };
    if (it && it.url) {
      add(W.cxNewTab, () => send({ cmd: "open", url: it.url, newtab: true }));
      sep();
      add(W.cxEdit, () => { closeBm(); send({ cmd: "bm-edit-open", url: it.url, from: it.from || "" }); });
    } else if (it && it.folder) {
      add(W.cxRename, () => renameFolder(it.folder));
    }
    if (it) {
      sep();
      add(W.cxCut, () => { clip = { mode: "cut", ...it }; }, true, "Ctrl+X");
      add(W.cxCopy, () => { clip = { mode: "copy", ...it }; if (it.url) send({ cmd: "copy-text", text: it.url }); }, true, "Ctrl+C");
    }

  document.addEventListener("mousedown", (e) => { if (!e.target.closest("#bmctx")) ctxClose(); }, true);

    if (!hoverIt || (e.target instanceof HTMLInputElement) || (e.target instanceof HTMLSelectElement)) return;
    if (e.key === "Delete") { e.preventDefault(); ctxClose(); bmDelete(hoverIt); hoverIt = null; }
    else if (e.ctrlKey && e.key.toLowerCase() === "x") { e.preventDefault(); clip = { mode: "cut", ...hoverIt }; }
    else if (e.ctrlKey && e.key.toLowerCase() === "c") { e.preventDefault(); clip = { mode: "copy", ...hoverIt }; if (hoverIt.url) send({ cmd: "copy-text", text: hoverIt.url }); }
  });

  // ---- Seret-dan-lepas bookmark di bilah dan menu folder (keluar/masuk folder) ----
  let drag = null, hoverTimer = 0;
  const clearDrop = () => document.querySelectorAll(".dropL,.dropR,.dropIn,.dropT,.dropB").forEach((x) => x.classList.remove("dropL", "dropR", "dropIn", "dropT", "dropB"));
  // Item yang diseret: bookmark (url) atau folder (path).
  function dragItem(el, item) {
    el.draggable = true;
    el.addEventListener("dragstart", (ev) => {
      drag = item; el.classList.add("dragging");
      ev.dataTransfer.effectAllowed = "move";
      ev.dataTransfer.setData("text/plain", item.url || item.folder);
    });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); drag = null; clearDrop(); clearTimeout(hoverTimer); });
  }
  // Tempat jatuh: `info(ev)` → {dest, beforeUrl, beforeFolder, cls} atau null.
  function dropZone(el, info) {
    el.addEventListener("dragover", (ev) => {
      if (!drag) return;
      const z = info(ev);
      if (!z) return;
      ev.preventDefault(); ev.dataTransfer.dropEffect = "move";
      clearDrop(); el.classList.add(z.cls);
      if (z.open && !el.__hover) { el.__hover = true; clearTimeout(hoverTimer); hoverTimer = setTimeout(z.open, 550); }
    });
    el.addEventListener("dragleave", () => { el.classList.remove("dropL", "dropR", "dropIn", "dropT", "dropB"); el.__hover = false; clearTimeout(hoverTimer); });
    el.addEventListener("drop", (ev) => {
      if (!drag) return;
      const z = info(ev);
      ev.preventDefault(); clearDrop(); clearTimeout(hoverTimer);
      if (!z) return;
      const it = drag; drag = null;
      if (it.url && it.url === z.beforeUrl) return;
      if (it.folder && (it.folder === z.beforeFolder || z.dest === it.folder || z.dest.startsWith(it.folder + "/"))) return;
      send({ cmd: "bm-move", url: it.url || "", folder: it.folder || "", dest: z.dest, beforeUrl: z.beforeUrl || "", beforeFolder: z.beforeFolder || "" });
    });
  }
  // Bilah: kiri/kanan item = sebelum/sesudah; tengah folder = masuk ke folder.
  function barDnD(el, item, index) {
    dragItem(el, item);
    const it = item.url ? { url: item.url, from: "" } : { folder: item.folder };
    const after = () => {
      const next = [...$("bmitems").children].filter((c) => c.dataset.i || c.dataset.f)[index + 1];
      return next ? { dest: "", beforeUrl: next.__item.url, beforeFolder: next.__item.folder } : { dest: "" };
    };
    el.addEventListener("contextmenu", (ev) => ctxMenu(ev, it, after, item.folder));
    el.addEventListener("mouseenter", () => { hoverIt = it; });
    el.addEventListener("mouseleave", () => { if (hoverIt === it && !$("bmctx").classList.contains("show")) hoverIt = null; });
    dropZone(el, (ev) => {
      const r = el.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width;
      if (item.folder && x > 0.25 && x < 0.75) return { dest: item.folder, cls: "dropIn", open: () => openBmMenu(el, () => folderEntries(item.folder)) };
      if (x < 0.5) return { dest: "", beforeUrl: item.url, beforeFolder: item.folder, cls: "dropL" };
      const next = [...$("bmitems").children].filter((c) => c.dataset.i || c.dataset.f)[index + 1];
      return next ? { dest: "", beforeUrl: next.__item.url, beforeFolder: next.__item.folder, cls: "dropR" } : { dest: "", cls: "dropR" };
    });
    el.__item = item;
  }
  // Menu folder: atas/bawah baris = sebelum/sesudah; tengah subfolder = masuk.
  function menuDnD(row, e, parent, list, idx) {
    const item = e.f ? { folder: e.f } : { url: e.b.url };
    dragItem(row, item);
    const it = e.f ? { folder: e.f } : { url: e.b.url, from: e.b.folder };
    const after = () => { const n = list[idx + 1]; return n ? { dest: parent, beforeUrl: n.b && n.b.url, beforeFolder: n.f } : { dest: parent }; };
    row.addEventListener("contextmenu", (ev) => ctxMenu(ev, it, after, e.f));
    row.addEventListener("mouseenter", () => { hoverIt = it; });
    row.addEventListener("mouseleave", () => { if (hoverIt === it && !$("bmctx").classList.contains("show")) hoverIt = null; });
    dropZone(row, (ev) => {
      const r = row.getBoundingClientRect(), y = (ev.clientY - r.top) / r.height;
      if (e.f && y > 0.25 && y < 0.75) return { dest: e.f, cls: "dropIn" };

      const n = list[idx + 1];

  // Data dari Ovner datang sebagai pesan WebView2 (bukan skrip) supaya proses halaman tidak

  let iconsCache = {};

    window.chrome.webview.addEventListener("message", (e) => {
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }

    // Data dialog unduh video dari Ovner: {open, url, title, ...} lalu {choices, subs, name} / {error} / {dir}.
    videoDlg(o) {

        hideOmni(); closeDark(); closeVid(); closeBm(); send({ cmd: "bubble-close" });
        vd = { open: true, url: o.url, title: o.title, loading: true, videoDir: o.videoDir, audioDir: o.audioDir, dir: o.videoDir, dirEdited: false, sub: "", embed: false };

      renderVidDlg();
    },
    // Tab dari jendela lain dijatuhkan di titik (x) ini: pindahkan ke urutan yang sesuai.
    dropAt(id, x, y) {
      const p = x;
      const els = [...$("tabs").querySelectorAll(".tab")].filter((el) => +el.dataset.id !== id);
      let to = els.length;
      for (let k = 0; k < els.length; k++) { const e = els[k].getBoundingClientRect(); if (p < e.left + e.width / 2) { to = k; break; } }

    },
    icons(map) { iconsCache = map || {}; if (state && typeof state === "object") { state.icons = iconsCache; } },
    render(s) {
      s.icons = iconsCache;
      state = s;
      if (D[s.lang] !== W || !document.documentElement.lang) applyLang(s.lang);
      addr.placeholder = s.noSearch ? W.addrNs : W.addr;

      sh.title = !s.blockAds ? W.shOff : !s.shieldOn ? W.shSite : W.shOn(s.blocked, s.listsReady);

      u.classList.toggle("show", !!s.update);

    send({ cmd: "video-open" });
  };
  // ---- Dialog "Unduh video dari halaman": format/kualitas, audio saja, subtitle, folder, nama ----
  let vd = { open: false };
  const VW = {
    id: { title: "Unduh video dari halaman", page: "Alamat halaman", look: "Telusuri", saveTo: "Simpan ke", name: "Nama berkas", subs: "Subtitle", noSubs: "Tidak ada di halaman ini",
          none: "Tanpa subtitle", embed: "Masukkan ke video", now: "Unduh sekarang", later: "Nanti", cancel: "Batal", loading: "Mencari format video…", audio: "Audio saja", empty: "Tidak ada format yang bisa diunduh.",
          tools: "Komponen yt-dlp/ffmpeg diunduh sekali saat pertama dipakai." },
    en: { title: "Download video from a page", page: "Page address", look: "Look up", saveTo: "Save to", name: "File name", subs: "Subtitles", noSubs: "None on this page",
          none: "No subtitles", embed: "Put them into the video", now: "Download Now", later: "Later", cancel: "Cancel", loading: "Looking up video formats…", audio: "Audio only", empty: "No downloadable formats.",
          tools: "The yt-dlp/ffmpeg components are downloaded once on first use." },
  };
  const vfmt = (n) => (n >= 1073741824 ? (n / 1073741824).toFixed(2) + " GB" : (n / 1048576).toFixed(2) + " MB");
  function closeVidDlg() { if (!vd.open) return; vd.open = false; $("viddlg").classList.remove("show"); sendHeight(); }
  function vdChoice() { return (vd.choices || []).find((c) => c.key === vd.sel); }
  function vdBase() { return (vd.name || "video").replace(/\.(mp4|m4a|mp3|opus|flac|webm|mkv)$/i, ""); }
  function vdSelect(key) {
    vd.sel = key;
    const c = vdChoice();
    if (!c) { renderVidDlg(); return; }
    vd.name = vdBase() + "." + c.ext;
    if (!vd.dirEdited) vd.dir = c.kind === "audio" ? vd.audioDir : vd.videoDir;
    renderVidDlg();
  }
  function vdStart(later) {
    const c = vdChoice();
    if (!c || !vd.dir) return;
    send({ cmd: "video-start", url: vd.url, key: c.key, dir: vd.dir, name: vd.name, sub: c.kind === "audio" ? "" : vd.sub || "", embed: !!vd.embed, later: !!later });
    closeVidDlg();
  }
  function renderVidDlg() {
    const w = VW[state && state.lang === "en" ? "en" : "id"];
    const p = $("viddlg");
    const ae = document.activeElement, focusId = ae && p.contains(ae) ? ae.dataset.k : null;
    p.textContent = "";
    const el = (tag, props, ...kids) => { const e = document.createElement(tag); Object.assign(e, props || {}); for (const k of kids) e.append(k); return e; };
    const x = el("button", { textContent: "✕", title: w.cancel, onclick: closeVidDlg });
    p.append(el("h3", {}, el("span", { textContent: w.title }), x));
    p.append(el("div", { className: "lbl", textContent: w.page }));
    const url = el("input", { type: "text", value: vd.url || "" }); url.dataset.k = "url";
    url.oninput = () => { vd.url = url.value; };
    url.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); look.click(); } };
    const look = el("button", { className: "btn", textContent: w.look, onclick: () => { vd.loading = true; vd.error = ""; vd.choices = []; renderVidDlg(); send({ cmd: "video-lookup", url: vd.url }); } });
    p.append(el("div", { className: "row" }, url, look));
    p.append(el("div", { className: "ttl", textContent: vd.title || "", title: vd.title || "" }));
    const list = el("div", { className: "list", tabIndex: 0 }); list.dataset.k = "list";
    if (vd.loading) list.append(el("div", { className: "msg", textContent: vd.note || w.loading }));
    else if (vd.error) list.append(el("div", { className: "msg err", textContent: vd.error }));
    else if (!(vd.choices || []).length) list.append(el("div", { className: "msg", textContent: w.empty }));
    for (const c of vd.loading ? [] : vd.choices || []) {
      const ic = c.kind === "audio"
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>';
      const row = el("div", { className: "it" + (c.key === vd.sel ? " sel" : "") });
      row.innerHTML = ic;
      const label = c.kind === "audio" && state && state.lang === "en" && c.en ? c.en : c.label;
      row.append(el("span", { textContent: label }), el("span", { className: "sz", textContent: (c.approx ? "≈ " : "") + (c.size ? vfmt(c.size) : "—") }));
      row.onclick = () => vdSelect(c.key);
      row.ondblclick = () => { vdSelect(c.key); vdStart(false); };
      list.append(row);
    }
    list.onkeydown = (e) => {
      const cs = vd.choices || [], k = cs.findIndex((c) => c.key === vd.sel);
      if (e.key === "ArrowDown" && k < cs.length - 1) { e.preventDefault(); vdSelect(cs[k + 1].key); }
      else if (e.key === "ArrowUp" && k > 0) { e.preventDefault(); vdSelect(cs[k - 1].key); }
    };
    p.append(list);
    p.append(el("div", { className: "lbl", textContent: w.saveTo }));
    const dir = el("input", { type: "text", value: vd.dir || "" }); dir.dataset.k = "dir";
    dir.oninput = () => { vd.dir = dir.value; vd.dirEdited = true; };
    p.append(el("div", { className: "row" }, dir, el("button", { className: "btn", textContent: "…", onclick: () => send({ cmd: "video-browse", dir: vd.dir || "" }) })));
    p.append(el("div", { className: "lbl", textContent: w.name }));
    const name = el("input", { type: "text", value: vd.name || "" }); name.dataset.k = "name";
    name.oninput = () => { vd.name = name.value; };
    p.append(el("div", { className: "row" }, name));
    const c = vdChoice(), audio = c && c.kind === "audio", subs = vd.subs || [];
    p.append(el("div", { className: "lbl", textContent: w.subs }));
    const sel = el("select", { disabled: audio || !subs.length }); sel.dataset.k = "sub";
    sel.append(el("option", { value: "", textContent: subs.length ? w.none : w.noSubs }));
    for (const sb of subs) sel.append(el("option", { value: sb.lang, textContent: sb.name + " (" + sb.lang + ")", selected: sb.lang === vd.sub }));
    sel.onchange = () => { vd.sub = sel.value; renderVidDlg(); };
    const emb = el("input", { type: "checkbox", checked: !!vd.embed, disabled: audio || !vd.sub }); emb.dataset.k = "embed";
    emb.onchange = () => { vd.embed = emb.checked; };
    p.append(el("div", { className: "row" }, sel, el("label", { className: "chk" }, emb, w.embed)));
    if (vd.tools && (!vd.tools[0] || !vd.tools[1])) p.append(el("div", { className: "note", textContent: w.tools }));
    const ready = !vd.loading && !!c;
    const now = el("button", { className: "btn pri", textContent: w.now, disabled: !ready, onclick: () => vdStart(false) });
    const later = el("button", { className: "btn", textContent: w.later, disabled: !ready, onclick: () => vdStart(true) });
    p.append(el("div", { className: "foot" }, now, later, el("button", { className: "btn", textContent: w.cancel, onclick: closeVidDlg })));
    p.onkeydown = (e) => {
      if (e.key === "Escape") { e.preventDefault(); closeVidDlg(); }
      else if (e.key === "Enter" && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON" && ready) { e.preventDefault(); vdStart(false); }
    };
    if (focusId) { const f = p.querySelector(`[data-k="${focusId}"]`); if (f) f.focus(); }
    else if (ready) list.focus();
    sendHeight();
  }
  findq.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); send({ cmd: "find", text: findq.value, back: e.shiftKey }); }
    else if (e.key === "Escape") send({ cmd: "find-close" });
  });
  findq.addEventListener("input", () => send({ cmd: "find", text: findq.value, back: false, fresh: true }));
  $("findnext").onclick = () => send({ cmd: "find", text: findq.value, back: false });
  $("findprev").onclick = () => send({ cmd: "find", text: findq.value, back: true });
  $("findclose").onclick = () => send({ cmd: "find-close" });
  $("new").onclick = () => send({ cmd: "newtab" });
  $("back").onclick = () => send({ cmd: "back" });
  $("fwd").onclick = () => send({ cmd: "forward" });
  $("home").onclick = () => send({ cmd: "home" });
  $("star").onclick = () => send({ cmd: "bookmark" });
  $("reload").onclick = () => send({ cmd: state.loading ? "stop" : "reload" });
  $("shield").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); send({ cmd: "shield", x: r.left, y: r.bottom }); };
  $("swap").onclick = () => send({ cmd: "split-swap" });
  $("unsplit").onclick = () => send({ cmd: "split-close" });
  $("upd").onclick = () => send({ cmd: "restart" });
  $("menu").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); send({ cmd: "menu", x: r.right, y: r.bottom }); };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    let c = null;
    if (e.ctrlKey && !e.altKey) {
      if (k === "t") c = e.shiftKey ? "reopen" : "newtab";
      else if (k === "n") c = e.shiftKey ? "private" : "newwindow";
      else if (k === "w" || k === "f4") c = "close";
      else if (k === "l") { e.preventDefault(); window.ovner.focusAddress(); return; }
      else if (k === "f") c = "findbar";
      else if (k === "d") c = "bookmark";
      else if (k === "h") c = "history";
      else if (k === "j") c = "downloads";
      else if (k === "p") c = "print";
      else if (k === "tab" || k === "pagedown") c = e.shiftKey || k === "pageup" ? "prevtab" : "nexttab";
      else if (k === "pageup") c = "prevtab";
      else if (/^[1-9]$/.test(k)) c = "tab" + k;
    } else if (e.shiftKey && k === "escape") c = "tasks";
    else if (k === "f5") c = "reload";
    else if (k === "escape" && $("find").classList.contains("show")) c = "find-close";
    if (c) { e.preventDefault(); send({ cmd: "key", k: c }); }
  });
  document.addEventListener("contextmenu", (e) => { if (e.target !== addr && e.target !== findq) e.preventDefault(); });
  applyLang("id");
  document.documentElement.lang = "";
  send({ cmd: "ready" });
})();
</script>
</body>
</html>
