<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #dfe3e8; --tab-hover: #eceff3; --tab-active: #ffffff; --bar: #ffffff; --field: #eef1f4; --field-focus: #ffffff;
    --text: #1d2228; --muted: #5d6670; --line: #c9cfd6; --accent: #1863dc; --shield: #e8730c; --ok: #148a4a; --private: #6b3fc9;
  }
  :root[data-theme="dark"] {
    --bg: #1c1f23; --tab-hover: #2a2e34; --tab-active: #33383f; --bar: #33383f; --field: #24282d; --field-focus: #1c1f23;
    --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --shield: #ff9a3d; --ok: #5fd08f; --private: #b592ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1f23; --tab-hover: #2a2e34; --tab-active: #33383f; --bar: #33383f; --field: #24282d; --field-focus: #1c1f23;
      --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --shield: #ff9a3d; --ok: #5fd08f; --private: #b592ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  #tabs { height: 36px; display: flex; align-items: flex-end; padding: 0 6px; gap: 2px; overflow: hidden; }
  .tab { position: relative; flex: 0 1 220px; min-width: 48px; height: 30px; display: flex; align-items: center;
    gap: 7px; padding: 0 6px 0 10px; border-radius: 8px 8px 0 0; cursor: default; }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--tab-active); }
  .tab .ic { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); }
  .tab.private .ic { background: var(--private); }
  .tab .ic.img, .bm .fi.img { background: center / 16px 16px no-repeat; }
  .tab.sleep .ic { background: var(--muted); }
  .tab.sleep .t { color: var(--muted); font-style: italic; }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { flex: none; width: 20px; height: 20px; border: 0; border-radius: 50%; background: none; color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer; }
  .tab .x:hover { background: var(--line); color: var(--text); }
  .tab.loading .ic { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #new { flex: none; width: 28px; height: 28px; margin-bottom: 2px; border: 0; border-radius: 6px; background: none;
    color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
  #new:hover { background: var(--tab-hover); }
  #bar { height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bar); }
  .b { flex: none; width: 32px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--text);
    display: grid; place-items: center; cursor: pointer; }
  .b:hover { background: var(--field); }
  .b:disabled { opacity: .35; cursor: default; }
  .b svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .b.hidden { display: none; }
  #addrwrap { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
  #addr { width: 100%; height: 30px; border: 1px solid transparent; border-radius: 15px; padding: 0 36px 0 36px;
    background: var(--field); color: var(--text); font: inherit; font-size: 14px; outline: none; user-select: text; }
  #addr:focus { background: var(--field-focus); border-color: var(--accent); }
  #star { position: absolute; right: 4px; width: 26px; height: 26px; color: var(--muted); }
  /* Ikon asli situs di kiri kolom alamat (tanpa kotak warna). */
  #ghost { position: absolute; top: 0; height: 30px; line-height: 30px; pointer-events: none; white-space: pre; overflow: hidden; display: none;
    font: inherit; font-size: 14px; color: var(--muted); }
  #ghost.show { display: block; }
  #ghost b { font-weight: inherit; background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--text); border-radius: 2px; }
  #measure { position: absolute; visibility: hidden; white-space: pre; font: inherit; font-size: 14px; left: -9999px; top: 0; }
  #siteicon { position: absolute; left: 11px; width: 16px; height: 16px; background: center / 16px 16px no-repeat; pointer-events: none; color: var(--muted); }
  #siteicon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  /* Indikator pemakaian RAM/CPU/GPU (ujung kanan baris tab, dekat tombol minimize). */
  #usage { flex: none; margin-left: auto; align-self: center; display: none; gap: 10px; padding: 3px 10px; border-radius: 10px;
    background: var(--field); color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: default; }
  #usage.show { display: flex; }
  #usage b { color: var(--text); font-weight: 600; }
  #usage .sep { opacity: .5; }
  #bar #usage { margin-left: 0; }
  #star.on { color: var(--shield); }
  #star.on svg { fill: currentColor; }
  #shield { width: auto; min-width: 32px; padding: 0 8px; gap: 4px; display: flex; align-items: center; color: var(--shield); font-weight: 600; }
  #shield.off { color: var(--muted); }
  #shield.off svg { stroke-dasharray: 3 2; }
  #upd { display: none; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: var(--ok); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; }
  #upd.show { display: block; }
  #bmbar { height: 30px; display: none; align-items: center; gap: 2px; padding: 0 6px; background: var(--bar); overflow: hidden; }
  #bmbar.show { display: flex; }
  #bmitems { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow: hidden; }
  .bm { flex: none; max-width: 170px; height: 24px; padding: 0 8px 0 6px; border: 0; border-radius: 6px; background: none; color: var(--text);
    font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bm:hover { background: var(--field); }
  .bm .lb { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .bm .fi { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; }
  .bm svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .bm.hide { display: none; }
  #bmmore, #bmother { flex: none; }
  #bmmore { width: 26px; padding: 0; justify-content: center; font-size: 15px; }
  .bmsep { flex: none; width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
  #find { height: 34px; display: none; align-items: center; gap: 6px; padding: 0 8px 0 14px; background: var(--bar); }
  #find.show { display: flex; }
  #findq { width: 280px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: var(--field); color: var(--text);
    font: inherit; outline: none; user-select: text; }
  #findq:focus { border-color: var(--accent); }
  .line { height: 1px; background: var(--line); }
  .tab.split { box-shadow: inset 0 -2px 0 var(--accent); }
  html, body { overflow: hidden; }
  #ov { position: absolute; left: 0; right: 0; }
  #omni { position: absolute; display: none; background: var(--bar); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px;
    box-shadow: 0 10px 24px #0004; padding: 4px 0 6px; }
  #omni.show { display: block; }
  .om { display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 14px; cursor: default; }
  .om.sel, .om:hover { background: var(--field); }
  .om .oi { flex: none; width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); background: center / 16px 16px no-repeat; border-radius: 3px; }
  .om .oi svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .om .ot { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
  .om .ou { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--accent); font-size: 12.5px; }
  #bubble { position: absolute; right: 8px; top: 4px; width: 360px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 28px #0005; padding: 12px 14px; }
  #bubble.show { display: block; }
  #bubble h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
  #bubble .xb { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .bb { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .bb button { height: 30px; padding: 0 14px; border-radius: 15px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; cursor: pointer; }
  .bb button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pwf { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 13px; }
  .pwf .k { color: var(--muted); }
  .di { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-radius: 8px; }
  .di:hover { background: var(--field); }
  .di .dn { flex: 1; min-width: 0; }
  .di .dn b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .di .ds { font-size: 11.5px; color: var(--muted); }
  .di .pb { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .di .pb i { display: block; height: 100%; background: var(--accent); }
  .di .db { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; }
  .di .db:hover { background: var(--line); color: var(--text); }
  .dall { display: block; width: 100%; margin-top: 6px; padding: 8px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font: inherit; cursor: pointer; text-align: center; }
  #dlbtn { display: none; position: relative; }
  #dlbtn.show { display: grid; }
  #dlbtn.busy svg { color: var(--accent); }
  #darkbtn.on { color: var(--accent); }
  #darkpanel { position: absolute; right: 48px; top: 4px; width: 330px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 28px #0005; padding: 12px 14px; font-size: 13px; }
  #darkpanel.show { display: block; }
  #vidpanel { position: absolute; right: 90px; top: 4px; width: 300px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.28); padding: 12px 14px; color: var(--text); font-size: 13px; }
  #vidpanel.show { display: block; }
  #vidpanel h3 { margin: 0 0 4px; font-size: 14px; }
  #vidpanel .t { color: var(--muted); font-size: 12px; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vidpanel button.f { display: flex; width: 100%; justify-content: space-between; align-items: center; margin: 5px 0; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; cursor: pointer; text-align: left; }
  #vidpanel button.f:hover { border-color: var(--accent); }
  #vidpanel button.f small { color: var(--muted); }
  #vidpanel .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  #vidbtn[hidden] { display: none; }
  #darkpanel h3 { margin: 0 0 2px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #darkpanel .site { color: var(--muted); font-size: 12px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #darkpanel .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  #darkpanel .seg button { flex: 1; border: 0; background: none; color: var(--text); padding: 6px 4px; font: inherit; cursor: pointer; }
  #darkpanel .seg button + button { border-left: 1px solid var(--line); }
  #darkpanel .seg button.on { background: var(--accent); color: #fff; }
  #darkpanel label.r { display: grid; grid-template-columns: 96px 1fr 40px; align-items: center; gap: 8px; margin: 6px 0; }
  #darkpanel label.r span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  #darkpanel select { width: 100%; background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  #darkpanel input[type=range] { width: 100%; accent-color: var(--accent); }
  #darkpanel .k { color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
  #darkpanel .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  /* Menu folder bookmark seperti Brave: ikon situs, baris lega, submenu ke samping. */
  .bmm { position: absolute; min-width: 260px; max-width: 440px; max-height: 620px; overflow-y: auto; background: var(--bar); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 10px 28px #0006; padding: 6px; font-size: 13.5px; }
  .bmm .r { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 12px 0 10px; border-radius: 6px; cursor: default; white-space: nowrap; }
  .bmm .r:hover, .bmm .r.open { background: var(--field); }
  .bmm .r .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .bmm .r .fi { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; }
  .bmm .r .fi.img { background: center / 16px 16px no-repeat; }
  .bmm .r svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .bmm .r .ar { flex: none; color: var(--muted); font-size: 12px; }
  .bmm .sep { height: 1px; background: var(--line); margin: 5px 4px; }
  .bmm .empty { color: var(--muted); padding: 8px 12px; }
  #splitbox { display: none; gap: 2px; }
  #splitbox.show { display: flex; }
</style>
</head>
<body>
<div id="base">
<div id="tabs"><button id="new">+</button><span id="usage"></span></div>
<div id="bar">
  <button class="b" id="back" title="Kembali (Alt+←)"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <button class="b" id="fwd" title="Maju (Alt+→)"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <button class="b" id="reload" title="Muat ulang (F5)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
  <button class="b hidden" id="home" title="Beranda"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg></button>
  <div id="addrwrap">
    <span id="siteicon"></span>
    <input id="addr" spellcheck="false" autocomplete="off"><span id="ghost"></span><span id="measure"></span>
    <button class="b" id="star" title="Bookmark halaman ini (Ctrl+D)"><svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4l-5.7 3.1 1.2-6.4L2.8 9.7l6.4-.8z"/></svg></button>
  </div>
  <span id="splitbox">
    <button class="b" id="swap"><svg viewBox="0 0 24 24"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg></button>
    <button class="b" id="unsplit"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M15 9l-3 3 3 3"/></svg></button>
  </span>
  <button id="upd"></button>
  <button class="b" id="vidbtn" hidden><svg viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M17 10l4-2.5v9L17 14M10 9v6M7.5 12.5 10 15l2.5-2.5"/></svg></button>
  <button class="b" id="dlbtn"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
  <button class="b" id="darkbtn"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  <button class="b" id="shield" title=""><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/></svg><span id="count"></span></button>
  <button class="b" id="menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="bmbar"><div id="bmitems"></div><button class="bm" id="bmmore">»</button><span class="bmsep" id="bmsep"></span><button class="bm" id="bmother"></button></div>
<div id="find">
  <input id="findq">
  <button class="b" id="findprev" title="Sebelumnya (Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <button class="b" id="findnext" title="Berikutnya (Enter)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <button class="b" id="findclose" title="Tutup (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="line"></div>
</div>
<div id="ov"><div id="omni"></div><div id="bubble"></div><div id="darkpanel"></div><div id="vidpanel"></div><div id="bmmenus"></div></div>

        const full = strip(hit.url);
        const host = full.split("/")[0];
        const done = host.toLowerCase().startsWith(raw.toLowerCase()) && host.length > raw.length ? host : full;
        if (done.length > raw.length) showGhost(done.slice(raw.length));
      }
    }
    const rect = $("addrwrap").getBoundingClientRect();
    box.style.left = rect.left + "px"; box.style.width = rect.width + "px";
    omniItems.forEach((it, k) => {
      const row = document.createElement("div"); row.className = "om";
      const ic = document.createElement("span"); ic.className = "oi";
      const ico = it.url && state.icons && state.icons[hostOf(it.url)];
      if (ico) ic.style.backgroundImage = `url("${ico}")`; else ic.innerHTML = iconSvg[it.icon];
      const t = document.createElement("span"); t.className = "ot"; t.textContent = it.title;
      const u = document.createElement("span"); u.className = "ou"; u.textContent = it.sub ? " — " + it.sub : "";
      row.append(ic, t, u);
      row.addEventListener("mousedown", (e) => { e.preventDefault(); go(it.go, e.button === 1 || e.ctrlKey); });
      row.addEventListener("mousemove", () => { if (omniSel !== k) [...box.children].forEach((e2, j) => e2.classList.toggle("sel", j === k)); });
      box.append(row);
    });
    box.classList.toggle("show", omniItems.length > 0 && document.activeElement === addr);
    sendHeight();
  }
  function go(text, newtab) {
    text = (text || "").trim();
    if (text) send({ cmd: "go", text, newtab: !!newtab });
    typing = false; hideOmni(); addr.blur();
  }
  addr.addEventListener("input", (e) => {
    typing = true;
    clearGhost();
    // Isi otomatis hanya saat mengetik di akhir, tidak saat menghapus.
    autoOk = e.inputType === "insertText" || e.inputType === "insertFromPaste";
    typed = addr.value.trim();
    clearTimeout(sugTimer);
    if (!typed) { hideOmni(); return; }
    sugTimer = setTimeout(() => send({ cmd: "suggest", text: typed }), 60);
  });
  addr.addEventListener("blur", () => { hideOmni(); clearGhost(); if (!addr.value.trim()) typing = false; });
  addr.addEventListener("scroll", clearGhost);
  addr.addEventListener("mousedown", () => clearGhost());
  addr.addEventListener("focus", () => setTimeout(() => addr.select(), 0));
  addr.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      go(ghost && omniSel < 0 ? addr.value + ghost : addr.value, e.altKey);
    } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!omniItems.length) return;
      e.preventDefault();
      const n = omniItems.length;
      pickOmni(e.key === "ArrowDown" ? (omniSel + 1) % n : (omniSel - 1 + n) % n);
    } else if (e.key === "Escape") {
      if (ghost) { clearGhost(); return; }
      if ($("omni").classList.contains("show")) { addr.value = typed; hideOmni(); return; }
      typing = false; addr.value = state.url; addr.blur(); send({ cmd: "focus-page" });
    } else if (e.key === "Delete" || e.key === "Backspace") {
      autoOk = false;
      clearGhost();
    } else if ((e.key === "Tab" || e.key === "ArrowRight" || e.key === "End") && ghost && !e.shiftKey && addr.selectionStart === addr.value.length) {
      // Terima isi otomatis: sisa alamat masuk ke kolom, kursor di akhir, tetap bisa diedit.
      e.preventDefault();
      acceptGhost();
    } else if (e.key === "ArrowLeft" || e.key === "Home") {
      clearGhost();
    }
  });

  // ---- Gelembung kanan atas: tawaran simpan sandi dan unduhan (seperti Brave) ----
  const sizeOf = (b) => b <= 0 ? "" : b < 1048576 ? (b / 1024).toFixed(0) + " KB" : (b / 1048576).toFixed(1) + " MB";
  let bubbleKey = "";
  function renderBubble() {
    const b = $("bubble");
    const pw = state.pwOffer, dl = state.dlBubble && (state.downloads || []).length;
    const key = JSON.stringify([pw, dl ? state.downloads : null, state.lang]);
    if (key === bubbleKey) return;
    bubbleKey = key;
    b.textContent = "";
    if (pw) {
      b.innerHTML = `<h3><span></span><button class="xb">×</button></h3><div class="pwf"><span class="k"></span><span class="u"></span><span class="k"></span><span>••••••••</span></div>
        <div class="bb"><button class="nv"></button><button class="pri sv"></button></div>`;
      b.querySelector("h3 span").textContent = (pw.update ? W.pwUpdate : W.pwSave) + " " + pw.site + "?";
      const ks = b.querySelectorAll(".k"); ks[0].textContent = W.pwUser; ks[1].textContent = W.pwPass;
      b.querySelector(".u").textContent = pw.user || "—";
      b.querySelector(".nv").textContent = W.pwNever; b.querySelector(".sv").textContent = pw.update ? W.pwDoUpdate : W.pwDoSave;
      b.querySelector(".nv").onclick = () => send({ cmd: "pw-never" });
      b.querySelector(".sv").onclick = () => send({ cmd: "pw-save" });
      b.querySelector(".xb").onclick = () => send({ cmd: "bubble-close" });
    } else if (dl) {
      b.innerHTML = `<h3><span></span><button class="xb">×</button></h3><div class="dls"></div><button class="dall"></button>`;
      b.querySelector("h3 span").textContent = W.dlTitle;
      b.querySelector(".xb").onclick = () => send({ cmd: "bubble-close" });
      b.querySelector(".dall").textContent = W.dlAll;
      b.querySelector(".dall").onclick = () => send({ cmd: "dl-all" });
      const box = b.querySelector(".dls");
      for (const d of state.downloads) {
        const it = document.createElement("div"); it.className = "di";
        const pct = d.total > 0 ? Math.min(100, (d.received / d.total) * 100) : 30;
        const live = d.state === "progress" || d.state === "paused";
        it.innerHTML = `<div class="dn"><b></b><div class="ds"></div>${live ? `<div class="pb"><i style="width:${pct}%"></i></div>` : ""}</div><button class="db pz"></button><button class="db"></button>`;
        it.querySelector("b").textContent = d.name;
        it.querySelector(".ds").textContent = live ? `${sizeOf(d.received)}${d.total > 0 ? " / " + sizeOf(d.total) : ""}${d.state === "paused" ? " · " + W.dlPaused : d.speed ? " · " + sizeOf(d.speed) + "/s" : ""}${d.engine && d.conns && d.state === "progress" ? " · " + d.conns + "×" : ""}`
          : d.state === "failed" ? W.dlFailed : d.exists ? sizeOf(d.received || d.total) : W.dlDeleted;
        const pz = it.querySelector(".pz");
        if (d.engine && live) {
          pz.innerHTML = d.state === "paused"
            ? '<svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>'
            : '<svg viewBox="0 0 24 24" width="14" height="14"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="2.6" fill="none"/></svg>';
          pz.title = d.state === "paused" ? W.dlResume : W.dlPause;
          pz.onclick = () => send({ cmd: d.state === "paused" ? "dl-resume" : "dl-pause", id: d.id });
        } else pz.remove();
        const act = it.querySelector(".db:not(.pz)");
        if (live) { act.textContent = "✕"; act.title = W.dlCancel; act.onclick = () => send({ cmd: "dl-cancel", id: d.id }); }
        else if (d.exists) { act.textContent = "📂"; act.title = W.dlShow; act.onclick = () => send({ cmd: "dl-show", id: d.id }); it.querySelector("b").onclick = () => send({ cmd: "dl-open", id: d.id }); }
        else act.remove();
        box.append(it);
      }
    }
    b.classList.toggle("show", !!(pw || dl));
  }
  function sendHeight() {
    const base = $("base").offsetHeight;
    $("ov").style.top = base + "px";
    const om = $("omni").classList.contains("show") ? $("omni").offsetHeight : 0;
    const bu = $("bubble").classList.contains("show") ? $("bubble").offsetHeight + 12 : 0;
    const dp = Math.max($("darkpanel").classList.contains("show") ? $("darkpanel").offsetHeight + 12 : 0,
      $("vidpanel").classList.contains("show") ? $("vidpanel").offsetHeight + 12 : 0);
    let bm = 0;
    for (const p of document.querySelectorAll("#bmmenus .bmm")) bm = Math.max(bm, p.offsetTop + p.offsetHeight + 12);
    // Kotak-kotak overlay yang terlihat: Ovner hanya menutup halaman di kotak ini (bukan
    // selebar layar), jadi halaman tetap terlihat di sekeliling menu seperti di Brave.
    const rects = [];
    for (const el of [$("omni"), $("bubble"), $("darkpanel"), $("vidpanel"), ...document.querySelectorAll("#bmmenus .bmm")]) {
      if (!el || !el.offsetParent || !el.offsetWidth) continue;
      const r = el.getBoundingClientRect();
      rects.push([r.left, r.top, r.width, r.height + 10]);
    }
    send({ cmd: "height", h: base, over: Math.max(om, bu, dp, bm), rects });
  }
  // Bagian kosong lapisan overlay menutup gelembung.
  $("ov").addEventListener("mousedown", (e) => { if (e.target.id === "ov" || e.target.id === "bmmenus") { hideOmni(); closeDark(); closeVid(); closeBm(); send({ cmd: "bubble-close" }); } });
  // ---- Panel mode gelap (seperti popup Dark Reader): per situs + kecerahan/kontras/sepia ----
  let darkOpen = false, darkKey = "";
  function closeDark() { if (!darkOpen) return; darkOpen = false; $("darkpanel").classList.remove("show"); darkKey = ""; sendHeight(); }
  function renderDark() {
    const d = state.dark || {};
    $("darkbtn").classList.toggle("on", !!d.active);
    $("darkbtn").title = W.darkTitle;
    const p = $("darkpanel");
    if (!darkOpen) return;
    const key = JSON.stringify([d, state.site, state.lang]);
    if (key === darkKey) return;
    darkKey = key;
    p.textContent = "";
    const h = document.createElement("h3");
    h.innerHTML = `<span></span><button class="xb" style="border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer">×</button>`;
    h.querySelector("span").textContent = W.dark;
    h.querySelector("button").onclick = closeDark;
    const site = document.createElement("div"); site.className = "site";
    site.textContent = state.site ? W.darkSite + " " + state.site : W.darkNoSite;
    p.append(h, site);
    if (state.site) {
      const seg = document.createElement("div"); seg.className = "seg";
      for (const [v, label] of [["default", W.darkDefault], ["on", W.darkOn], ["off", W.darkOff]]) {
        const b = document.createElement("button"); b.textContent = label;
        b.classList.toggle("on", d.site === v);
        b.onclick = () => send({ cmd: "dark-site", v });
        seg.append(b);
      }
      p.append(seg);
    }
    const sel = (key, val, opts, label) => {
      const l = document.createElement("label"); l.className = "r"; l.style.gridTemplateColumns = "96px 1fr";
      const t = document.createElement("span"); t.textContent = label;
      const s2 = document.createElement("select");
      for (const [v, txt] of opts) { const o = document.createElement("option"); o.value = v; o.textContent = txt; s2.append(o); }
      s2.value = val;
      s2.onchange = () => send({ cmd: "dark-set", key, value: s2.value });
      l.append(t, s2); return l;
    };
    p.append(sel("dark_mode", d.mode, [["off", W.darkAllOff], ["on", W.darkAllOn], ["system", W.darkAllSys]], W.darkAll));
    p.append(sel("dark_engine", d.engine, [["dynamic", W.engDyn], ["filter", W.engFilter], ["chromium", W.engChromium]], W.darkEngine));
    const sliders = document.createElement("div");
    for (const [key, label, min, max, val] of [["dark_brightness", W.bright, 30, 150, d.b], ["dark_contrast", W.contrast, 30, 150, d.c], ["dark_sepia", "Sepia", 0, 100, d.se], ["dark_grayscale", W.gray, 0, 100, d.g]]) {
      const l = document.createElement("label"); l.className = "r";
      const t = document.createElement("span"); t.textContent = label;
      const r = document.createElement("input"); r.type = "range"; r.min = min; r.max = max; r.value = val;
      const v = document.createElement("span"); v.textContent = val + "%";
      r.oninput = () => { v.textContent = r.value + "%"; };
      r.onchange = () => send({ cmd: "dark-set", key, value: Number(r.value) });
      r.disabled = d.engine === "chromium";
      l.append(t, r, v); sliders.append(l);
    }
    p.append(sliders);
    const note = document.createElement("div"); note.className = "note"; note.textContent = W.darkNote;
    p.append(note);
    sendHeight();
  }
  $("darkbtn").onclick = () => {
    if (darkOpen) { closeDark(); return; }
    hideOmni(); send({ cmd: "bubble-close" });
    darkOpen = true; darkKey = "";
    $("darkpanel").classList.add("show");
    renderDark();
  };
  $("dlbtn").onclick = () => send({ cmd: "dl-toggle" });
  // ---- Unduh video (yt-dlp), seperti tombol video di IDM/Mister Download Manager ----
  let vidOpen = false;
  function closeVid() { if (!vidOpen) return; vidOpen = false; $("vidpanel").classList.remove("show"); sendHeight(); }
  function renderVid() {
    const b = $("vidbtn");
    b.hidden = !state.video;
    b.title = W.vidTitle;
    if (!state.video && vidOpen) closeVid();
  }
  $("vidbtn").onclick = () => {
    if (vidOpen) { closeVid(); return; }
    hideOmni(); closeDark(); send({ cmd: "bubble-close" });
    const p = $("vidpanel"); p.textContent = "";
    const h = document.createElement("h3"); h.textContent = W.vid;
    const t = document.createElement("div"); t.className = "t"; t.textContent = state.pageTitle || state.url || "";
    p.append(h, t);
    for (const [fmt, label, small] of [["best", W.vidBest, W.vidMp4], ["720", W.vid720, W.vidMp4], ["audio", W.vidAudio, "M4A"]]) {
      const x = document.createElement("button"); x.className = "f";
      x.innerHTML = "<span></span><small></small>";
      x.firstChild.textContent = label; x.lastChild.textContent = small;
      x.onclick = () => { send({ cmd: "video-dl", fmt }); closeVid(); };
      p.append(x);
    }
    const tools = state.videoTools || [];
    if (!tools[0] || !tools[1]) {
      const n = document.createElement("div"); n.className = "note";
      n.textContent = (tools[0] ? W.vidNoteFf : W.vidNote1 + W.vidNote2) + W.vidNote3;
      p.append(n);
    }
    vidOpen = true; p.classList.add("show"); sendHeight();
  };
  findq.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); send({ cmd: "find", text: findq.value, back: e.shiftKey }); }
    else if (e.key === "Escape") send({ cmd: "find-close" });
  });
  findq.addEventListener("input", () => send({ cmd: "find", text: findq.value, back: false, fresh: true }));
  $("findnext").onclick = () => send({ cmd: "find", text: findq.value, back: false });
  $("findprev").onclick = () => send({ cmd: "find", text: findq.value, back: true });
  $("findclose").onclick = () => send({ cmd: "find-close" });
  $("new").onclick = () => send({ cmd: "newtab" });
  $("back").onclick = () => send({ cmd: "back" });
  $("fwd").onclick = () => send({ cmd: "forward" });
  $("home").onclick = () => send({ cmd: "home" });
  $("star").onclick = () => send({ cmd: "bookmark" });
  $("reload").onclick = () => send({ cmd: state.loading ? "stop" : "reload" });
  $("shield").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); send({ cmd: "shield", x: r.left, y: r.bottom }); };
  $("swap").onclick = () => send({ cmd: "split-swap" });
  $("unsplit").onclick = () => send({ cmd: "split-close" });
  $("upd").onclick = () => send({ cmd: "restart" });
  $("menu").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); send({ cmd: "menu", x: r.right, y: r.bottom }); };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    let c = null;
    if (e.ctrlKey && !e.altKey) {
      if (k === "t") c = e.shiftKey ? "reopen" : "newtab";
      else if (k === "n") c = e.shiftKey ? "private" : "newtab";
      else if (k === "w" || k === "f4") c = "close";
      else if (k === "l") { e.preventDefault(); window.ovner.focusAddress(); return; }
      else if (k === "f") c = "findbar";
      else if (k === "d") c = "bookmark";
      else if (k === "h") c = "history";
      else if (k === "j") c = "downloads";
      else if (k === "p") c = "print";
      else if (k === "tab" || k === "pagedown") c = e.shiftKey || k === "pageup" ? "prevtab" : "nexttab";
      else if (k === "pageup") c = "prevtab";
      else if (/^[1-9]$/.test(k)) c = "tab" + k;
    } else if (e.shiftKey && k === "escape") c = "tasks";
    else if (k === "f5") c = "reload";
    else if (k === "escape" && $("find").classList.contains("show")) c = "find-close";
    if (c) { e.preventDefault(); send({ cmd: "key", k: c }); }
  });
  document.addEventListener("contextmenu", (e) => { if (e.target !== addr && e.target !== findq) e.preventDefault(); });
  applyLang("id");
  document.documentElement.lang = "";
  send({ cmd: "ready" });
})();
</script>
</body>
</html>
