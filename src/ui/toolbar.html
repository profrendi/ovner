<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #dfe3e8; --tab-hover: #eceff3; --tab-active: #ffffff; --bar: #ffffff; --field: #eef1f4; --field-focus: #ffffff;
    --text: #1d2228; --muted: #5d6670; --line: #c9cfd6; --accent: #1863dc; --shield: #e8730c; --ok: #148a4a; --private: #6b3fc9;
  }
  :root[data-theme="dark"] {
    --bg: #1c1f23; --tab-hover: #2a2e34; --tab-active: #33383f; --bar: #33383f; --field: #24282d; --field-focus: #1c1f23;
    --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --shield: #ff9a3d; --ok: #5fd08f; --private: #b592ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1f23; --tab-hover: #2a2e34; --tab-active: #33383f; --bar: #33383f; --field: #24282d; --field-focus: #1c1f23;
      --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --shield: #ff9a3d; --ok: #5fd08f; --private: #b592ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.2 var(--ovner-font, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif); user-select: none; }
  #tabs { height: 36px; display: flex; align-items: flex-end; padding: 0 6px; gap: 2px; overflow: hidden; }
  .tab { position: relative; flex: 0 1 220px; min-width: 48px; height: 30px; display: flex; align-items: center;
    gap: 7px; padding: 0 6px 0 10px; border-radius: 8px 8px 0 0; cursor: default; }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--tab-active); }
  .tab.out { opacity: .45; outline: 2px dashed currentColor; }
  .tab.dragging { opacity: .7; box-shadow: 0 2px 8px rgba(0,0,0,.35); z-index: 2; }
  .tab .ic { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); }
  .tab.private .ic { background: var(--private); }
  .tab .ic.img, .bm .fi.img { background: center / 16px 16px no-repeat; }
  .tab.sleep .ic { background: var(--muted); }
  .tab.sleep .t { color: var(--muted); font-style: italic; }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { flex: none; width: 20px; height: 20px; border: 0; border-radius: 50%; background: none; color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer; }
  .tab .x:hover { background: var(--line); color: var(--text); }
  .tab.loading .ic { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #new { flex: none; width: 28px; height: 28px; margin-bottom: 2px; border: 0; border-radius: 6px; background: none;
    color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
  #new:hover { background: var(--tab-hover); }
  #bar { height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bar); }
  .b { flex: none; width: 32px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--text);
    display: grid; place-items: center; cursor: pointer; }
  .b:hover { background: var(--field); }
  .b:disabled { opacity: .35; cursor: default; }
  .b svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .b.hidden { display: none; }
  #addrwrap { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
  #addr { width: 100%; height: 30px; border: 1px solid transparent; border-radius: 15px; padding: 0 36px 0 36px;
    background: var(--field); color: var(--text); font: inherit; font-size: 14px; outline: none; user-select: text; }
  #addr:focus { background: var(--field-focus); border-color: var(--accent); }
  #star { position: absolute; right: 4px; width: 26px; height: 26px; color: var(--muted); }
  /* Ikon asli situs di kiri kolom alamat (tanpa kotak warna). */
  #ghost { position: absolute; top: 0; height: 30px; line-height: 30px; pointer-events: none; white-space: pre; overflow: hidden; display: none;
    font: inherit; font-size: 14px; color: var(--muted); }
  #ghost.show { display: block; }
  #ghost b { font-weight: inherit; background: color-mix(in srgb, var(--accent) 28%, transparent); color: var(--text); border-radius: 2px; }
  #measure { position: absolute; visibility: hidden; white-space: pre; font: inherit; font-size: 14px; left: -9999px; top: 0; }
  #siteicon { position: absolute; left: 11px; width: 16px; height: 16px; background: center / 16px 16px no-repeat; pointer-events: none; color: var(--muted); }
  #siteicon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  /* Indikator pemakaian RAM/CPU/GPU (ujung kanan baris tab, dekat tombol minimize). */
  #usage { flex: none; margin-left: auto; align-self: center; display: none; gap: 10px; padding: 3px 10px; border-radius: 10px;
    background: var(--field); color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; cursor: default; }
  #usage.show { display: flex; }
  #usage b { color: var(--text); font-weight: 600; }
  #usage .sep { opacity: .5; }
  #bar #usage { margin-left: 0; }
  #star.on { color: var(--shield); }
  #star.on svg { fill: currentColor; }
  #shield { width: auto; min-width: 32px; padding: 0 8px; gap: 4px; display: flex; align-items: center; color: var(--shield); font-weight: 600; }
  #shield.off { color: var(--muted); }
  #shield.off svg { stroke-dasharray: 3 2; }
  #upd { display: none; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: var(--ok); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; }
  #upd.show { display: block; }
  #bmbar { height: 30px; display: none; align-items: center; gap: 2px; padding: 0 6px; background: var(--bar); overflow: hidden; }
  #bmbar.show { display: flex; }
  #bmitems { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow: hidden; }
  .bm { flex: none; max-width: 170px; height: 24px; padding: 0 8px 0 6px; border: 0; border-radius: 6px; background: none; color: var(--text);
    font: inherit; font-size: 12.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bm:hover { background: var(--field); }
  .bm .lb { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .bm .fi { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; }
  .bm svg { flex: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .bm.hide { display: none; }
  #bmmore, #bmother { flex: none; }
  #bmmore { width: 26px; padding: 0; justify-content: center; font-size: 15px; }
  .bmsep { flex: none; width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
  #find { height: 34px; display: none; align-items: center; gap: 6px; padding: 0 8px 0 14px; background: var(--bar); }
  #find.show { display: flex; }
  #findq { width: 280px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: var(--field); color: var(--text);
    font: inherit; outline: none; user-select: text; }
  #findq:focus { border-color: var(--accent); }
  .line { height: 1px; background: var(--line); }
  .tab.split { box-shadow: inset 0 -2px 0 var(--accent); }
  html, body { overflow: hidden; }
  #ov { position: absolute; left: 0; right: 0; }
  #omni { position: absolute; display: none; background: var(--bar); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px;
    box-shadow: 0 10px 24px #0004; padding: 4px 0 6px; }
  #omni.show { display: block; }
  .om { display: flex; align-items: center; gap: 12px; height: 34px; padding: 0 14px; cursor: default; }
  .om.sel, .om:hover { background: var(--field); }
  .om .oi { flex: none; width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); background: center / 16px 16px no-repeat; border-radius: 3px; }
  .om .oi svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .om .ot { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
  .om .ou { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--accent); font-size: 12.5px; }
  #bubble { position: absolute; right: 8px; top: 4px; width: 360px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 28px #0005; padding: 12px 14px; }
  #bubble.show { display: block; }
  #bubble h3 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
  #bubble .xb { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .bb { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .bb button { height: 30px; padding: 0 14px; border-radius: 15px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; cursor: pointer; }
  .bb button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pwf { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 13px; }
  .pwf .k { color: var(--muted); }
  .di { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-radius: 8px; }
  .di:hover { background: var(--field); }
  .di .dn { flex: 1; min-width: 0; }
  .di .dn b { display: block; font-weight: 600; font-size: 13px; line-height: 1.35; white-space: normal; overflow-wrap: anywhere; cursor: pointer; }
  .di .db.pz.txt { width: auto; padding: 4px 10px; font: inherit; font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); border-radius: 12px; white-space: nowrap; color: var(--accent); }
  .di .ds { font-size: 11.5px; color: var(--muted); }
  .di .pb { height: 3px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .di .pb i { display: block; height: 100%; background: var(--accent); }
  .di .db { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; }
  .di .db:hover { background: var(--line); color: var(--text); }
  .dall { display: block; width: 100%; margin-top: 6px; padding: 8px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font: inherit; cursor: pointer; text-align: center; }
  /* Download box v2 (seperti Mister Download Manager), di dalam gelembung unduhan. */
  #bubble.v2 { width: 560px; }
  #bubble.v2 .dls { max-height: 620px; overflow-y: auto; overscroll-behavior: contain; }
  #bubble.v2 .di { align-items: flex-start; padding: 10px 6px; border-bottom: 1px solid var(--line); border-radius: 0; }
  #bubble.v2 .di:last-child { border-bottom: 0; }
  #bubble.v2 .pb { height: 8px; border-radius: 4px; margin: 6px 0 4px; display: flex; gap: 1px; background: none; }
  #bubble.v2 .pb span { flex: 1; background: var(--line); border-radius: 2px; overflow: hidden; }
  #bubble.v2 .pb span i { display: block; height: 100%; background: #2ea043; }
  #bubble.v2 .pb span.busy i { background: var(--accent); }
  #bubble.v2 .pb.ind span i { width: 35%; animation: dlind 1.1s linear infinite; }
  @keyframes dlind { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  #bubble.v2 .dg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px 8px; font-size: 11.5px; margin-top: 2px; }
  #bubble.v2 .dg div { min-width: 0; }
  #bubble.v2 .dg span { display: block; color: var(--muted); font-size: 10.5px; }
  #bubble.v2 .dg b { font-weight: 600; font-size: 12px; display: block; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #bubble.v2 .sv { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.45; overflow-wrap: anywhere; }
  #bubble.v2 .sv b { display: inline; font-size: inherit; cursor: auto; color: var(--text); font-weight: 600; white-space: normal; }
  #bubble.v2 .ping.near { color: #2ea043; } #bubble.v2 .ping.mid { color: #d29922; } #bubble.v2 .ping.far { color: #e5534b; }
  #bubble.v2 .sv b.yes { color: #2ea043; } #bubble.v2 .sv b.no { color: #e5534b; }
  #bubble.v2 .tg { display: inline-block; font-size: 10.5px; padding: 1px 7px; border-radius: 8px; background: var(--field); color: var(--muted); margin-left: 6px; font-weight: 600; vertical-align: 1px; white-space: nowrap; }
  #bubble.v2 .tg.k-video { color: #c2410c; background: color-mix(in srgb, #f97316 16%, transparent); }
  #bubble.v2 .tg.k-audio { color: #7c3aed; background: color-mix(in srgb, #8b5cf6 16%, transparent); }
  #bubble.v2 .tg.k-subtitle { color: #0e7490; background: color-mix(in srgb, #06b6d4 16%, transparent); }
  #bubble.v2 .tg.k-doc { color: #1d4ed8; background: color-mix(in srgb, #3b82f6 16%, transparent); }
  #bubble.v2 .tg.k-image { color: #15803d; background: color-mix(in srgb, #22c55e 16%, transparent); }
  #bubble.v2 .pc { float: right; font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
  #dlbtn { display: none; position: relative; }
  #dlbtn.show { display: grid; }
  #dlbtn.busy svg { color: var(--accent); }
  #darkbtn.on { color: var(--accent); }
  #codecbtn.on { color: var(--accent); }
  #codecpanel { position: absolute; right: 48px; top: 4px; width: 372px; max-height: 600px; overflow-y: auto; display: none; background: var(--bar); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 10px 28px #0005; padding: 12px 14px; font-size: 13px; }
  #codecpanel.show { display: block; }
  #sleeppanel { position: absolute; right: 84px; top: 4px; width: 300px; display: none; background: var(--bar); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 10px 28px #0005; padding: 8px; font-size: 13px; }
  #sleeppanel.show { display: block; }
  #sleeppanel .it { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 0; background: none; color: var(--text);
    padding: 8px 10px; border-radius: 8px; font: inherit; cursor: pointer; }
  #sleeppanel .it:hover { background: var(--field); }
  #sleeppanel .it b { font-weight: 600; display: block; }
  #sleeppanel .it span { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
  #sleeppanel .sep { height: 1px; background: var(--line); margin: 4px 6px; }
  #sleeppanel .info { color: var(--muted); font-size: 11.5px; padding: 4px 10px 2px; }
  #memnote { position: absolute; right: 12px; top: 6px; width: 340px; display: none; background: var(--bar); border: 1px solid #d9822b;
    border-radius: 12px; box-shadow: 0 10px 28px #0005; padding: 10px 12px; font-size: 13px; line-height: 1.4; }
  #memnote.show { display: block; }
  #memnote .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  #memnote button { border: 1px solid var(--line); background: var(--field); color: var(--text); border-radius: 8px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #memnote button.p { background: var(--accent); border-color: var(--accent); color: #fff; }
  #codecpanel h3 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #codecpanel h3 button { border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  #codecpanel .now { background: var(--field); border-radius: 8px; padding: 7px 9px; font-size: 12px; margin-bottom: 10px; line-height: 1.45; }
  #codecpanel .now b { font-weight: 600; }
  #codecpanel .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 6px; }
  #codecpanel .seg button { flex: 1; border: 0; background: none; color: var(--text); padding: 6px 4px; font: inherit; cursor: pointer; }
  #codecpanel .seg button + button { border-left: 1px solid var(--line); }
  #codecpanel .seg button.on { background: var(--accent); color: #fff; }
  #codecpanel .md { color: var(--muted); font-size: 12px; line-height: 1.4; margin-bottom: 4px; }
  #codecpanel .k { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; margin: 10px 0 2px; }
  #codecpanel .cr { display: grid; grid-template-columns: 18px 1fr auto; gap: 2px 8px; padding: 6px 2px; border-top: 1px solid var(--line); align-items: start; }
  #codecpanel .cr input { margin: 2px 0 0; accent-color: var(--accent); }
  #codecpanel .cr .nm { font-weight: 600; }
  #codecpanel .cr .nm code { font-weight: 400; color: var(--muted); font-size: 11.5px; margin-left: 4px; }
  #codecpanel .cr .ds { grid-column: 2 / 4; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
  #codecpanel .hw { font-size: 11px; padding: 0 7px; border-radius: 9px; background: var(--field); color: var(--muted); white-space: nowrap; }
  #codecpanel .hw.yes { color: #2e9d57; } #codecpanel .hw.no { color: #d9534f; }
  #codecpanel .cr.dis { opacity: .62; }
  #codecpanel .warn { color: #d9822b; font-size: 12px; margin-top: 6px; }
  #codecpanel .apply { width: 100%; margin-top: 10px; padding: 7px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  #codecpanel .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  #darkpanel { position: absolute; right: 48px; top: 4px; width: 330px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 10px 28px #0005; padding: 12px 14px; font-size: 13px; }
  #darkpanel.show { display: block; }
  #vidpanel { position: absolute; right: 90px; top: 4px; width: 300px; display: none; background: var(--bar); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,.28); padding: 12px 14px; color: var(--text); font-size: 13px; }
  #vidpanel.show { display: block; }
  /* Dialog "Unduh video dari halaman" (seperti Mister Download Manager). */
  #viddlg { position: absolute; left: calc(50% - 290px); top: 6px; width: 580px; display: none; background: var(--bar); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 10px 34px rgba(0,0,0,.35); padding: 14px 16px; font-size: 13px; box-sizing: border-box; }
  #viddlg.show { display: block; }
  #viddlg h3 { margin: 0 0 10px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #viddlg h3 button { all: unset; cursor: pointer; padding: 2px 6px; border-radius: 6px; color: var(--muted); }
  #viddlg h3 button:hover { background: var(--tab-hover); }
  #viddlg .lbl { color: var(--muted); font-size: 12px; margin: 8px 0 4px; }
  #viddlg .row { display: flex; gap: 8px; align-items: center; }
  #viddlg input[type=text], #viddlg select { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; }
  #viddlg button.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; cursor: pointer; }
  #viddlg button.btn:hover { border-color: var(--accent); }
  #viddlg button.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
  #viddlg button.btn:disabled { opacity: .5; cursor: default; }
  #viddlg .ttl { font-weight: 600; margin: 10px 0 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #viddlg .list { height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
  #viddlg .it { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: default; }
  #viddlg .it:hover { background: var(--tab-hover); }
  #viddlg .it.sel { background: var(--accent); color: #fff; }
  #viddlg .it .sz { margin-left: auto; font-variant-numeric: tabular-nums; }
  #viddlg .it svg { width: 16px; height: 16px; flex: none; }
  #viddlg .msg { padding: 14px; color: var(--muted); }
  #viddlg .msg.err { color: #d93025; }
  #viddlg .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  #viddlg .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  #viddlg label.chk { display: flex; gap: 6px; align-items: center; white-space: nowrap; color: var(--text); }
  #vidpanel h3 { margin: 0 0 4px; font-size: 14px; }
  #vidpanel .t { color: var(--muted); font-size: 12px; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vidpanel button.f { display: flex; width: 100%; justify-content: space-between; align-items: center; margin: 5px 0; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--text); font: inherit; cursor: pointer; text-align: left; }
  #vidpanel button.f:hover { border-color: var(--accent); }
  #vidpanel button.f small { color: var(--muted); }
  #vidpanel .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  #vidbtn[hidden] { display: none; }

  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const LX = () => state && state.lang === "en";
  const langName = (code) => {
    const c = (code || "").toLowerCase();
    const row = (state.langs || []).find((l) => l[0].toLowerCase() === c) || (state.langs || []).find((l) => l[0].toLowerCase().split("-")[0] === c.split("-")[0]);
    return row ? (LX() ? row[2] : row[1]) : (code || "");
  };

  // ---- Perekam masalah: tameng menjadi tombol rekam merah berkedip ----
  const shOrig = $("shield").onclick;
  $("shield").onclick = (e) => { if (state.recording) { send({ cmd: "shield-rec-stop" }); return; } shOrig(e); };
  $("shield").addEventListener("contextmenu", (e) => { if (state.recording) { e.preventDefault(); shOrig({ currentTarget: $("shield") }); } });

  // ---- Terjemahan (seperti Edge) ----
  let trOpen = false, trSelData = null, trPick = "";
  function closeTr() { if (!trOpen) return; trOpen = false; trSelData = null; $("trpanel").classList.remove("show"); sendHeight(); }
  function renderTr() {
    const tr = state.tr;
    const b = $("trbtn");
    const show = !!tr && (tr.on || (tr.lang && !/^(id|in)\b/i.test(tr.lang)));
    b.hidden = !show;
    b.classList.toggle("on", !!(tr && tr.on));
    b.title = LX() ? "Translate this page" : "Terjemahkan halaman ini";
    $("addr").classList.toggle("trpad", show);
    if (!trOpen) return;
    const p = $("trpanel"); p.textContent = "";
    const hd = mk("h3"); hd.append(mk("span", "", LX() ? "Translate" : "Terjemahan"), xBtn(closeTr)); p.append(hd);
    if (trSelData) {
      const o = trSelData;
      p.append(mk("div", "orig", o.text.length > 300 ? o.text.slice(0, 300) + "…" : o.text));
      if (o.busy) p.append(mk("div", "st", LX() ? "Translating…" : "Menerjemahkan…"));
      else if (o.err) p.append(mk("div", "st err", o.err));
      else {
        p.append(mk("div", "out", o.out));
        const row = mk("div", "bb");
        const cp = mk("button", "pri", LX() ? "Copy" : "Salin"); cp.onclick = () => { send({ cmd: "copy-text", text: o.out }); cp.textContent = LX() ? "Copied" : "Tersalin"; };
        row.append(cp); p.append(row);
        if (o.from) p.append(mk("div", "note", (LX() ? "From " : "Dari bahasa ") + langName(o.from)));
      }
      sendHeight();
      return;
    }
    if (!tr) { p.append(mk("div", "st", LX() ? "This page can't be translated." : "Halaman ini tidak bisa diterjemahkan.")); sendHeight(); return; }
    const pct = tr.total > 0 ? Math.min(100, Math.round(tr.done * 100 / tr.total)) : 0;
    p.append(mk("div", "st", tr.on ? (tr.busy ? (LX() ? `Translating… ${pct}%` : `Menerjemahkan… ${pct}%`) : (LX() ? "Page translated" : "Halaman sudah diterjemahkan"))
      : tr.lang ? (LX() ? `This page is in ${langName(tr.lang)}` : `Halaman ini berbahasa ${langName(tr.lang)}`) : (LX() ? "Translate this page?" : "Terjemahkan halaman ini?")));
    p.append(mk("div", "k", LX() ? "Translate to" : "Terjemahkan ke"));
    const sel = mk("select");
    const cur = trPick || (tr.on ? tr.to : tr.auto);
    for (const l of state.langs || []) { const o = mk("option", "", LX() ? l[2] : l[1]); o.value = l[0]; o.selected = l[0] === cur; sel.append(o); }
    sel.onchange = () => { trPick = sel.value; if (tr.on) send({ cmd: "tr-start", to: sel.value }); };
    p.append(sel);
    if (tr.err) p.append(mk("div", "st err", tr.err));
    const row = mk("div", "bb");
    if (tr.on) {
      const orig = mk("button", "", LX() ? "Show original" : "Tampilkan asli"); orig.onclick = () => { send({ cmd: "tr-restore" }); trPick = ""; };
      const done = mk("button", "pri", LX() ? "Done" : "Selesai"); done.onclick = closeTr;
      row.append(orig, done);
    } else {
      const go = mk("button", "pri", LX() ? "Translate" : "Terjemahkan"); go.onclick = () => send({ cmd: "tr-start", to: sel.value });
      row.append(go);
    }
    p.append(row);
    const note = mk("div", "note");
    note.append((LX() ? "Via " : "Lewat ") + (tr.device ? (LX() ? "Chromium's offline translator" : "penerjemah offline Chromium") : tr.engine === "google" ? "Google" : "Microsoft") + " · ");
    const a = mk("a", "", LX() ? "Settings" : "Pengaturan"); a.href = "#"; a.onclick = (e) => { e.preventDefault(); closeTr(); send({ cmd: "tr-settings" }); };
    note.append(a); p.append(note);
    sendHeight();
  }
  $("trbtn").onclick = () => {
    if (trOpen) { closeTr(); return; }
    closePanels(true); trOpen = true; trSelData = null; trPick = ""; $("trpanel").classList.add("show"); renderTr();
  };

  // ---- Kode QR ----
  let qrData = null;
  function closeQr() { if (!qrData) return; qrData = null; $("qrpanel").classList.remove("show"); sendHeight(); }
  function renderQr() {
    const p = $("qrpanel"); p.textContent = "";
    if (!qrData) return;
    const hd = mk("h3"); hd.append(mk("span", "", LX() ? "QR code" : "Kode QR"), xBtn(closeQr)); p.append(hd);
    const img = mk("img"); img.src = "data:image/svg+xml;utf8," + encodeURIComponent(qrData.svg); img.alt = "QR"; p.append(img);
    p.append(mk("div", "u", qrData.url));
    const row = mk("div", "bb");
    const cp = mk("button", "", LX() ? "Copy address" : "Salin alamat"); cp.onclick = () => { send({ cmd: "copy-text", text: qrData.url }); cp.textContent = LX() ? "Copied" : "Tersalin"; };
    const dl = mk("button", "pri", LX() ? "Download PNG" : "Unduh PNG");
    dl.onclick = () => {
      const c = document.createElement("canvas"); c.width = c.height = 600;
      const g = c.getContext("2d"); g.imageSmoothingEnabled = false; g.fillStyle = "#fff"; g.fillRect(0, 0, 600, 600); g.drawImage(img, 0, 0, 600, 600);
      send({ cmd: "qr-save", png: c.toDataURL("image/png"), url: qrData.url }); closeQr();
    };
    row.append(cp, dl); p.append(row);
    sendHeight();
  }

  // ---- Baca keras (seperti Read aloud Edge): suara Windows atau suara online ----
  const RD = { open: false, n: 0, paras: [], i: 0, playing: false, paused: false, engine: "local", voice: "", rate: 100, lang: "", title: "",
    online: { edge: null, azure: null }, err: "", audio: null, chunks: [], ck: 0, req: 0, cache: new Map(), waiting: null, azure: false };
  const synth = window.speechSynthesis;
  function localVoices() { try { return synth ? synth.getVoices() : []; } catch (e) { return []; } }
  if (synth) synth.onvoiceschanged = () => { if (readOptsOpen) renderReadOpts(); };
  const baseLang = (l) => (l || "").toLowerCase().split(/[-_]/)[0];
  function pickLocal() {
    const vs = localVoices();
    return vs.find((v) => v.name === RD.voice) || vs.find((v) => baseLang(v.lang) === baseLang(RD.lang || "id")) || vs.find((v) => v.default) || vs[0] || null;
  }
  function pickOnline() {
    const list = RD.online[RD.engine] || [];
    if (RD.voice && list.some((v) => v.name === RD.voice)) return RD.voice;
    if (RD.voice && !list.length && RD.voice.includes("Neural")) return RD.voice;
    const want = baseLang(RD.lang || "id");
    const pref = { id: "id-ID-GadisNeural", en: "en-US-AriaNeural", ms: "ms-MY-YasminNeural", jv: "jv-ID-SitiNeural", su: "su-ID-TutiNeural", ja: "ja-JP-NanamiNeural", ar: "ar-SA-ZariyahNeural", zh: "zh-CN-XiaoxiaoNeural", ko: "ko-KR-SunHiNeural" };
    const v = list.find((x) => x.name === pref[want]) || list.find((x) => baseLang(x.locale) === want);
    return v ? v.name : pref[want] || "id-ID-GadisNeural";
  }
  function splitChunks(text) {
    const out = []; let rest = text;
    while (rest.length > 1400) {
      let cut = rest.lastIndexOf(". ", 1400); if (cut < 400) cut = rest.lastIndexOf(" ", 1400); if (cut < 1) cut = 1400;
      out.push(rest.slice(0, cut + 1)); rest = rest.slice(cut + 1);
    }
    if (rest.trim()) out.push(rest);
    return out;
  }
  function mark(i, a, len) { send({ cmd: "read-mark", n: RD.n, i, a, len }); }
  function stopSound() {
    try { if (synth) synth.cancel(); } catch (e) {}
    if (RD.audio) { try { RD.audio.pause(); } catch (e) {} RD.audio = null; }
    RD.waiting = null;
  }
  function playPara(i) {
    stopSound();
    if (i < 0) i = 0;
    if (i >= RD.paras.length) { RD.playing = false; RD.paused = false; renderReadbar(); send({ cmd: "read-mark", n: RD.n, i: -1, a: 0, len: 0 }); return; }
    RD.i = i; RD.playing = true; RD.paused = false; RD.err = "";
    const text = RD.paras[i];
    mark(i, 0, 0);
    if (RD.engine === "local") {
      if (!synth) { RD.err = LX() ? "Windows voices are unavailable" : "Suara Windows tidak tersedia"; renderReadbar(); return; }
      const u = new SpeechSynthesisUtterance(text);
      const v = pickLocal(); if (v) { u.voice = v; u.lang = v.lang; }
      u.rate = Math.max(0.5, Math.min(3, RD.rate / 100));
      u.onboundary = (e) => { if (e.name === "word" && RD.i === i) { const m = /^[\p{L}\p{N}'’-]+/u.exec(text.slice(e.charIndex)); mark(i, e.charIndex, e.charLength || (m ? m[0].length : 1)); } };
      u.onend = () => { if (RD.playing && !RD.paused && RD.i === i) playPara(i + 1); };
      u.onerror = (e) => { if (e.error !== "interrupted" && e.error !== "canceled") { RD.err = String(e.error || "error"); renderReadbar(); } };
      synth.speak(u);
    } else {
      RD.chunks = splitChunks(text); RD.ck = 0;
      playChunk(i, 0);
      // Paragraf berikutnya disiapkan lebih dulu supaya tidak ada jeda.
      if (i + 1 < RD.paras.length) fetchChunk(i + 1, 0, splitChunks(RD.paras[i + 1])[0] || "");
    }
    renderReadbar();
  }
  function chunkKey(i, k) { return `${RD.engine}|${pickOnline()}|${RD.rate}|${i}|${k}`; }
  function fetchChunk(i, k, text) {
    const key = chunkKey(i, k);
    if (RD.cache.has(key) || !text.trim()) return;
    RD.cache.set(key, null);
    send({ cmd: "tts", req: key, engine: RD.engine, voice: pickOnline(), rate: RD.rate, text });
  }
  function playChunk(i, k) {
    const text = RD.chunks[k] || "";
    const key = chunkKey(i, k);
    const got = RD.cache.get(key);
    if (!got) { RD.waiting = { i, k, key }; fetchChunk(i, k, text); renderReadbar(); return; }
    RD.waiting = null;
    if (got.err) { fallbackLocal(got.err); return; }
    const offset = RD.chunks.slice(0, k).join("").length;
    const au = new Audio("data:audio/mpeg;base64," + got.mp3);
    RD.audio = au;
    let cursor = 0, mi = 0;
    au.ontimeupdate = () => {
      const t = au.currentTime * 1000;
      while (mi < got.marks.length && got.marks[mi][0] <= t + 60) {
        const w = got.marks[mi][2]; const at = text.indexOf(w, cursor);
        if (at >= 0) { cursor = at + w.length; mark(i, offset + at, w.length); }
        mi++;
      }
    };
    au.onended = () => {
      if (!RD.playing || RD.paused || RD.audio !== au) return;
      if (k + 1 < RD.chunks.length) playChunk(i, k + 1); else playPara(i + 1);
    };
    au.play().catch((e) => fallbackLocal(String(e)));
    if (k + 1 < RD.chunks.length) fetchChunk(i, k + 1, RD.chunks[k + 1]);
    renderReadbar();
  }
  function fallbackLocal(err) {
    RD.err = (LX() ? "Online voice failed, using Windows voice: " : "Suara online gagal, memakai suara Windows: ") + err;
    RD.engine = "local";
    playPara(RD.i);
  }
  function closeReader(silent) {
    stopSound();
    RD.open = false; RD.playing = false; RD.cache.clear();
    closeReadOpts();
    $("readbar").classList.remove("show");
    if (!silent) send({ cmd: "read-stop" });
    sendHeight();
  }
  function togglePause() {
    if (!RD.playing) { playPara(RD.i); return; }
    if (RD.paused) {
      RD.paused = false;
      if (RD.engine === "local") { try { synth.resume(); } catch (e) {} if (synth && !synth.speaking) playPara(RD.i); }
      else if (RD.audio) RD.audio.play(); else playPara(RD.i);
    } else {
      RD.paused = true;
      if (RD.engine === "local") { try { synth.pause(); } catch (e) {} } else if (RD.audio) RD.audio.pause();
    }
    renderReadbar();
  }
  const ICON = {
    prev: '<svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></svg>',
    next: '<svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></svg>',
    play: '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>',
  };
  function renderReadbar() {
    const bar = $("readbar");
    bar.classList.toggle("show", RD.open);
    if (!RD.open) { sendHeight(); return; }
    bar.textContent = "";
    const left = mk("div", "rl");
    const wave = mk("span", "wave" + (RD.playing && !RD.paused ? " on" : "")); for (let k = 0; k < 4; k++) wave.append(mk("i"));
    left.append(wave, mk("b", "", LX() ? "Read aloud" : "Baca keras"));
    const mid = mk("div", "rm");
    const btn = (html, title, fn, cls) => { const b = mk("button", "b" + (cls ? " " + cls : "")); b.innerHTML = html; b.title = title; b.onclick = fn; return b; };
    mid.append(btn(ICON.prev, LX() ? "Previous paragraph" : "Paragraf sebelumnya", () => playPara(RD.i - 1)),
      btn(RD.playing && !RD.paused ? ICON.pause : ICON.play, RD.playing && !RD.paused ? (LX() ? "Pause (Ctrl+Shift+U)" : "Jeda (Ctrl+Shift+U)") : (LX() ? "Play" : "Putar"), togglePause, "big"),
      btn(ICON.next, LX() ? "Next paragraph" : "Paragraf berikutnya", () => playPara(RD.i + 1)));
    const right = mk("div", "rr");
    const st = mk("span", "rs", RD.err ? RD.err : RD.waiting ? (LX() ? "Preparing voice…" : "Menyiapkan suara…") : `${Math.min(RD.i + 1, RD.paras.length)}/${RD.paras.length}`);
    if (RD.err) st.classList.add("err");
    const opts = mk("button", "ob", (LX() ? "Voice options" : "Opsi suara") + " ▾"); opts.onclick = () => { readOptsOpen ? closeReadOpts() : openReadOpts(); };
    right.append(st, opts, xBtn(() => closeReader(false)));
    bar.append(left, mid, right);
    sendHeight();
  }
  let readOptsOpen = false;
  function closeReadOpts() { if (!readOptsOpen) return; readOptsOpen = false; $("readopts").classList.remove("show"); sendHeight(); }
  function openReadOpts() {
    readOptsOpen = true; $("readopts").classList.add("show");
    if (RD.engine !== "local" && !RD.online[RD.engine]) send({ cmd: "tts-voices", engine: RD.engine });
    renderReadOpts();
  }
  function renderReadOpts() {
    const p = $("readopts"); p.textContent = "";
    if (!readOptsOpen) return;
    const hd = mk("h3"); hd.append(mk("span", "", LX() ? "Voice options" : "Opsi suara"), xBtn(closeReadOpts)); p.append(hd);
    p.append(mk("div", "k", (LX() ? "Speed: " : "Kecepatan: ") + (RD.rate / 100).toFixed(1) + "×"));
    const rg = mk("input"); rg.type = "range"; rg.min = 50; rg.max = 300; rg.step = 10; rg.value = RD.rate;
    rg.oninput = () => { RD.rate = +rg.value; p.querySelector(".k").textContent = (LX() ? "Speed: " : "Kecepatan: ") + (RD.rate / 100).toFixed(1) + "×"; };
    rg.onchange = () => { send({ cmd: "tts-set", rate: RD.rate }); RD.cache.clear(); if (RD.playing && !RD.paused) playPara(RD.i); };
    p.append(rg);
    p.append(mk("div", "k", LX() ? "Voice source" : "Sumber suara"));
    const eng = mk("select");
    for (const [v, id, en] of [["local", "Suara Windows (offline)", "Windows voices (offline)"], ["edge", "Natural online (seperti Edge)", "Natural online (like Edge)"], ["azure", "Azure Speech (kunci sendiri)", "Azure Speech (your key)"]]) {
      const o = mk("option", "", LX() ? en : id); o.value = v; o.selected = v === RD.engine; eng.append(o);
    }
    eng.onchange = () => { RD.engine = eng.value; RD.voice = ""; RD.err = ""; RD.cache.clear(); send({ cmd: "tts-set", engine: RD.engine, voice: "" }); if (RD.engine !== "local" && !RD.online[RD.engine]) send({ cmd: "tts-voices", engine: RD.engine }); renderReadOpts(); if (RD.playing) playPara(RD.i); };
    p.append(eng);
    p.append(mk("div", "k", LX() ? "Choose a voice" : "Pilih suara"));
    const vs = mk("select");
    if (RD.engine === "local") {
      const cur = pickLocal();
      const list = localVoices();
      if (!list.length) vs.append(mk("option", "", LX() ? "No Windows voices found" : "Tidak ada suara Windows"));
      for (const v of list) { const o = mk("option", "", `${v.name} (${v.lang})`); o.value = v.name; o.selected = cur && v.name === cur.name; vs.append(o); }
      if (!list.some((v) => baseLang(v.lang) === "id")) p.append(mk("div", "note", LX() ? "No Indonesian Windows voice. Install it in Settings → Time & Language → Speech, or use Natural online." : "Belum ada suara Windows bahasa Indonesia. Pasang di Settings → Time & Language → Speech, atau pakai Natural online."));
    } else {
      const list = RD.online[RD.engine];
      if (list && list.err) { vs.append(mk("option", "", list.err)); }
      else if (!list) vs.append(mk("option", "", LX() ? "Loading voices…" : "Memuat daftar suara…"));
      else {
        const cur = pickOnline();
        const want = baseLang(RD.lang || "id");
        const sorted = [...list].sort((a, b) => (baseLang(b.locale) === want) - (baseLang(a.locale) === want) || a.label.localeCompare(b.label));
        for (const v of sorted) { const o = mk("option", "", v.label); o.value = v.name; o.selected = v.name === cur; vs.append(o); }
      }
    }
    vs.onchange = () => { RD.voice = vs.value; RD.cache.clear(); send({ cmd: "tts-set", voice: RD.voice }); if (RD.playing && !RD.paused) playPara(RD.i); };
    p.append(vs);
    if (RD.engine === "azure" && !RD.azure) p.append(mk("div", "note err", LX() ? "Fill in the Azure Speech key in Settings → Translation and read aloud." : "Isi kunci Azure Speech di Pengaturan → Terjemahan dan baca keras."));
    const note = mk("div", "note");
    const a = mk("a", "", LX() ? "Read-aloud settings" : "Pengaturan baca keras"); a.href = "#"; a.onclick = (e) => { e.preventDefault(); closeReadOpts(); send({ cmd: "read-settings" }); };
    note.append(a); p.append(note);
    sendHeight();
  }
  Object.assign(window.ovner, {
    closePanels() { closePanels(false); },
    trOpen() { closePanels(true); panelOpenedAt = Date.now(); trOpen = true; trSelData = null; trPick = ""; $("trpanel").classList.add("show"); renderTr(); },
    trSel(o) { if (!trOpen || !trSelData) closePanels(true); panelOpenedAt = Date.now(); trOpen = true; trSelData = o; $("trpanel").classList.add("show"); renderTr(); },
    qr(o) { closePanels(true); panelOpenedAt = Date.now(); qrData = o; $("qrpanel").classList.add("show"); renderQr(); },
    reader(o) {
      stopSound();
      Object.assign(RD, { open: true, n: o.n, paras: o.paras || [], i: o.start || 0, playing: false, paused: false, engine: o.engine || "local", voice: o.voice || "", rate: o.rate || 100, lang: o.lang || "", title: o.title || "", err: "", azure: !!o.azure });
      RD.cache.clear();
      if (!RD.paras.length) { RD.err = LX() ? "No readable text on this page" : "Tidak ada teks yang bisa dibaca di halaman ini"; renderReadbar(); return; }
      if (RD.engine !== "local" && !RD.online[RD.engine]) send({ cmd: "tts-voices", engine: RD.engine });
      playPara(RD.i);
    },
    readerToggle() { if (RD.open) togglePause(); },
    readerStop() { if (RD.open) closeReader(true); },
    ttsAudio(o) {
      if (!RD.cache.has(o.req)) return;
      RD.cache.set(o.req, o.err ? { err: o.err } : { mp3: o.mp3, marks: o.marks || [] });
      if (RD.waiting && RD.waiting.key === o.req && RD.playing && !RD.paused) playChunk(RD.waiting.i, RD.waiting.k);
    },
    ttsVoices(o) { RD.online[o.engine] = o.err ? { err: o.err } : o.voices; if (readOptsOpen) renderReadOpts(); },
  });
  function renderExtras() {
    const sh = $("shield");
    sh.classList.toggle("rec", !!state.recording);
    if (state.recording) sh.title = LX() ? "Recording a problem… click to stop and save" : "Merekam masalah… klik untuk berhenti dan menyimpan";
    renderTr();
  }
  document.addEventListener("contextmenu", (e) => { if (e.target !== addr && e.target !== findq) e.preventDefault(); });
  applyLang("id");
  document.documentElement.lang = "";
  send({ cmd: "ready" });
})();
