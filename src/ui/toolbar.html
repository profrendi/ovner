<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #dfe3e8; --tab-hover: #eceff3; --tab-active: #ffffff; --bar: #ffffff; --field: #eef1f4; --field-focus: #ffffff;
    --text: #1d2228; --muted: #5d6670; --line: #c9cfd6; --accent: #1863dc; --shield: #e8730c; --ok: #148a4a; --private: #6b3fc9;
  }
  :root[data-theme="dark"] {
    --bg: #1c1f23; --tab-hover: #2a2e34; --tab-active: #33383f; --bar: #33383f; --field: #24282d; --field-focus: #1c1f23;
    --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --shield: #ff9a3d; --ok: #5fd08f; --private: #b592ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1f23; --tab-hover: #2a2e34; --tab-active: #33383f; --bar: #33383f; --field: #24282d; --field-focus: #1c1f23;
      --text: #e8eaed; --muted: #a2a9b1; --line: #454b53; --accent: #7cacf8; --shield: #ff9a3d; --ok: #5fd08f; --private: #b592ff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
  #tabs { height: 36px; display: flex; align-items: flex-end; padding: 0 6px; gap: 2px; overflow: hidden; }
  .tab { position: relative; flex: 0 1 220px; min-width: 48px; height: 30px; display: flex; align-items: center;
    gap: 7px; padding: 0 6px 0 10px; border-radius: 8px 8px 0 0; cursor: default; }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--tab-active); }
  .tab .ic { flex: none; width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); }
  .tab.private .ic { background: var(--private); }
  .tab.sleep .ic { background: var(--muted); }
  .tab.sleep .t { color: var(--muted); font-style: italic; }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { flex: none; width: 20px; height: 20px; border: 0; border-radius: 50%; background: none; color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer; }
  .tab .x:hover { background: var(--line); color: var(--text); }
  .tab.loading .ic { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #new { flex: none; width: 28px; height: 28px; margin-bottom: 2px; border: 0; border-radius: 6px; background: none;
    color: var(--text); font-size: 20px; line-height: 1; cursor: pointer; }
  #new:hover { background: var(--tab-hover); }
  #bar { height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: var(--bar); }
  .b { flex: none; width: 32px; height: 30px; border: 0; border-radius: 6px; background: none; color: var(--text);
    display: grid; place-items: center; cursor: pointer; }
  .b:hover { background: var(--field); }
  .b:disabled { opacity: .35; cursor: default; }
  .b svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .b.hidden { display: none; }
  #addrwrap { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
  #addr { width: 100%; height: 30px; border: 1px solid transparent; border-radius: 15px; padding: 0 36px 0 14px;
    background: var(--field); color: var(--text); font: inherit; font-size: 14px; outline: none; user-select: text; }
  #addr:focus { background: var(--field-focus); border-color: var(--accent); }
  #star { position: absolute; right: 4px; width: 26px; height: 26px; color: var(--muted); }
  #star.on { color: var(--shield); }
  #star.on svg { fill: currentColor; }
  #shield { width: auto; min-width: 32px; padding: 0 8px; gap: 4px; display: flex; align-items: center; color: var(--shield); font-weight: 600; }
  #shield.off { color: var(--muted); }
  #shield.off svg { stroke-dasharray: 3 2; }
  #upd { display: none; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: var(--ok); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; }
  #upd.show { display: block; }
  #bmbar { height: 28px; display: none; align-items: center; gap: 2px; padding: 0 8px; background: var(--bar); overflow: hidden; }
  #bmbar.show { display: flex; }
  .bm { flex: 0 1 auto; max-width: 180px; height: 22px; padding: 0 8px; border: 0; border-radius: 5px; background: none; color: var(--text);
    font: inherit; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .bm:hover { background: var(--field); }
  #find { height: 34px; display: none; align-items: center; gap: 6px; padding: 0 8px 0 14px; background: var(--bar); }
  #find.show { display: flex; }
  #findq { width: 280px; height: 26px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; background: var(--field); color: var(--text);
    font: inherit; outline: none; user-select: text; }
  #findq:focus { border-color: var(--accent); }
  .line { height: 1px; background: var(--line); }
  .tab.split { box-shadow: inset 0 -2px 0 var(--accent); }
  #splitbox { display: none; gap: 2px; }
  #splitbox.show { display: flex; }
</style>
</head>
<body>
<div id="tabs"><button id="new">+</button></div>
<div id="bar">
  <button class="b" id="back" title="Kembali (Alt+←)"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <button class="b" id="fwd" title="Maju (Alt+→)"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <button class="b" id="reload" title="Muat ulang (F5)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
  <button class="b hidden" id="home" title="Beranda"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg></button>
  <div id="addrwrap">
    <input id="addr" spellcheck="false" autocomplete="off" list="sug">
    <datalist id="sug"></datalist>
    <button class="b" id="star" title="Bookmark halaman ini (Ctrl+D)"><svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.4l-5.7 3.1 1.2-6.4L2.8 9.7l6.4-.8z"/></svg></button>
  </div>
  <span id="splitbox">
    <button class="b" id="swap"><svg viewBox="0 0 24 24"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg></button>
    <button class="b" id="unsplit"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M15 9l-3 3 3 3"/></svg></button>
  </span>
  <button id="upd"></button>
  <button class="b" id="shield" title=""><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/></svg><span id="count"></span></button>
  <button class="b" id="menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</div>
<div id="bmbar"></div>
<div id="find">
  <input id="findq">
  <button class="b" id="findprev" title="Sebelumnya (Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
  <button class="b" id="findnext" title="Berikutnya (Enter)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <button class="b" id="findclose" title="Tutup (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div class="line"></div>
<script>
(function () {
  const send = (o) => window.ipc.postMessage(JSON.stringify(o));
  const D = {
    id: { newtab: "Tab baru", newtabK: "Tab baru (Ctrl+T)", priv: " (privat)", sleep: "\n(Tab tidur: tidak memakai RAM, dimuat lagi saat dibuka)", close: "Tutup tab (Ctrl+W)",
      back: "Kembali (Alt+←)", fwd: "Maju (Alt+→)", reload: "Muat ulang (F5)", stop: "Hentikan (Esc)", home: "Beranda", addr: "Cari atau ketik alamat",
      addrNs: "Ketik alamat", star: "Bookmark halaman ini (Ctrl+D)", upd: "Versi baru sudah diunduh. Klik untuk membuka ulang Ovner.", menu: "Menu",
      find: "Cari di halaman", prev: "Sebelumnya (Shift+Enter)", next: "Berikutnya (Enter)", fclose: "Tutup (Esc)", bmEmpty: "Simpan halaman dengan Ctrl+D; bookmark muncul di sini.",
      swap: "Pindah ke sisi lain", unsplit: "Tutup tampilan terbagi", shOff: "Pemblokir iklan dimatikan di pengaturan", shSite: "Shields MATI di situs ini. Klik untuk mengatur.",
      shOn: (n, r) => `${n} iklan/pelacak diblokir di halaman ini${r ? "" : " (daftar lengkap sedang diunduh)"}.\nKlik untuk mengatur Shields situs ini.`, bm: "★ " },
    en: { newtab: "New tab", newtabK: "New tab (Ctrl+T)", priv: " (private)", sleep: "\n(Sleeping tab: uses no RAM, reloads when opened)", close: "Close tab (Ctrl+W)",
      back: "Back (Alt+←)", fwd: "Forward (Alt+→)", reload: "Reload (F5)", stop: "Stop (Esc)", home: "Home", addr: "Search or type an address",
      addrNs: "Type an address", star: "Bookmark this page (Ctrl+D)", upd: "A new version is downloaded. Click to restart Ovner.", menu: "Menu",
      find: "Find in page", prev: "Previous (Shift+Enter)", next: "Next (Enter)", fclose: "Close (Esc)", bmEmpty: "Save pages with Ctrl+D; bookmarks appear here.",
      swap: "Switch side", unsplit: "Close split view", shOff: "Ad blocking is turned off in settings", shSite: "Shields are DOWN for this site. Click to adjust.",
      shOn: (n, r) => `${n} ads/trackers blocked on this page${r ? "" : " (full lists are downloading)"}.\nClick to adjust Shields for this site.`, bm: "★ " },
  };
  let W = D.id;
  const $ = (id) => document.getElementById(id);
  const tabsEl = $("tabs"), addr = $("addr"), findq = $("findq");
  let state = { tabs: [], url: "", loading: false, bookmarks: [] };
  const reloadIcon = $("reload").innerHTML;
  const stopIcon = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function letter(t) {
    const m = (t.title || t.url || "").replace(/^https?:\/\/(www\.)?/, "").match(/[A-Za-z0-9]/);
    return m ? m[0].toUpperCase() : "•";
  }

  function renderTabs() {
    tabsEl.querySelectorAll(".tab").forEach((e) => e.remove());
    const plus = $("new");
    for (const t of state.tabs) {
      const el = document.createElement("div");
      el.className = "tab" + (t.active ? " active" : "") + (t.sleeping ? " sleep" : "") + (t.loading ? " loading" : "") + (t.private ? " private" : "") + (t.split ? " split" : "");
      el.title = (t.title || W.newtab) + (t.private ? W.priv : "") + (t.sleeping ? W.sleep : "");
      const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = letter(t);
      const ti = document.createElement("span"); ti.className = "t"; ti.textContent = t.title || W.newtab;
      const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = W.close;
      x.onclick = (e) => { e.stopPropagation(); send({ cmd: "close", id: t.id }); };
      el.onmousedown = (e) => { if (e.button === 0) send({ cmd: "activate", id: t.id }); };
      el.onauxclick = (e) => { if (e.button === 1) send({ cmd: "close", id: t.id }); };
      el.oncontextmenu = (e) => { e.preventDefault(); send({ cmd: "tabmenu", id: t.id, x: e.clientX, y: e.clientY }); };
      el.append(ic, ti, x);
      tabsEl.insertBefore(el, plus);
    }
  }

  function renderBookmarks() {
    const bar = $("bmbar");
    bar.classList.toggle("show", !!state.bookmarkBar);
    bar.textContent = "";
    for (const b of state.bookmarks || []) {
      const el = document.createElement("button"); el.className = "bm"; el.textContent = b.title; el.title = b.url;
      el.onclick = () => send({ cmd: "open", url: b.url });
      el.onauxclick = (e) => { if (e.button === 1) send({ cmd: "open", url: b.url, newtab: true }); };
      bar.append(el);
    }
    if (!(state.bookmarks || []).length) {
      const el = document.createElement("span"); el.className = "bm"; el.style.color = "var(--muted)";
      el.textContent = W.bmEmpty;
      bar.append(el);
    }
  }

  window.ovner = {
    render(s) {
      state = s;
      if (D[s.lang] !== W || !document.documentElement.lang) applyLang(s.lang);
      addr.placeholder = s.noSearch ? W.addrNs : W.addr;
      $("splitbox").classList.toggle("show", !!s.split);
      document.documentElement.dataset.theme = s.theme === "system" ? "" : s.theme;
      renderTabs();
      renderBookmarks();
      $("home").classList.toggle("hidden", !s.homeButton);
      if (document.activeElement !== addr) addr.value = s.url;
      $("reload").innerHTML = s.loading ? stopIcon : reloadIcon;
      $("reload").title = s.loading ? W.stop : W.reload;
      $("back").disabled = !s.canBack; $("fwd").disabled = !s.canForward;
      $("star").classList.toggle("on", !!s.bookmarked);
      $("star").style.display = s.url ? "" : "none";
      const sh = $("shield");
      sh.classList.toggle("off", !s.shieldOn);
      $("count").textContent = s.shieldOn && s.blocked > 0 ? String(s.blocked) : "";
      sh.title = !s.blockAds ? W.shOff : !s.shieldOn ? W.shSite : W.shOn(s.blocked, s.listsReady);
      const u = $("upd");
      u.classList.toggle("show", !!s.update);
      u.textContent = s.update ? "Update " + s.update : "";
      $("find").classList.toggle("show", !!s.find);
      send({ cmd: "height", h: document.body.scrollHeight });
    },
    focusAddress() { addr.focus(); addr.select(); },
    suggestions(r) {
      if (r.text !== addr.value.trim()) return;
      const dl = $("sug"); dl.textContent = "";
      for (const it of r.items || []) {
        const o = document.createElement("option");
        o.value = it.url; o.label = (it.bm ? W.bm : "") + (it.title || it.url);
        dl.append(o);
      }
    },
    focusFind() { findq.focus(); findq.select(); },
  };

  function applyLang(l) {
    W = D[l] || D.id;
    document.documentElement.lang = l;
    const tt = { new: W.newtabK, back: W.back, fwd: W.fwd, home: W.home, star: W.star, upd: W.upd, menu: W.menu, findprev: W.prev, findnext: W.next, findclose: W.fclose, swap: W.swap, unsplit: W.unsplit };
    for (const k in tt) $(k).title = tt[k];
    findq.placeholder = W.find;
  }
  let sugTimer = 0, picked = false;
  addr.addEventListener("input", (e) => {
    // Pilihan dari daftar saran: langsung buka.
    if (!e.inputType || e.inputType === "insertReplacementText") {
      const text = addr.value.trim();
      if (text) { picked = true; send({ cmd: "go", text }); addr.blur(); }
      return;
    }
    if (!state.suggest) return;
    clearTimeout(sugTimer);
    const text = addr.value.trim();
    if (!text) { $("sug").textContent = ""; return; }
    sugTimer = setTimeout(() => send({ cmd: "suggest", text }), 120);
  });
  addr.addEventListener("blur", () => { $("sug").textContent = ""; });
  addr.addEventListener("focus", () => setTimeout(() => addr.select(), 0));
  addr.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const text = addr.value.trim();
      if (text) send({ cmd: "go", text, newtab: e.altKey });
      addr.blur();
    } else if (e.key === "Escape") {
      addr.value = state.url; addr.blur(); send({ cmd: "focus-page" });
    }
  });
  findq.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); send({ cmd: "find", text: findq.value, back: e.shiftKey }); }
    else if (e.key === "Escape") send({ cmd: "find-close" });
  });
  findq.addEventListener("input", () => send({ cmd: "find", text: findq.value, back: false, fresh: true }));
  $("findnext").onclick = () => send({ cmd: "find", text: findq.value, back: false });
  $("findprev").onclick = () => send({ cmd: "find", text: findq.value, back: true });
  $("findclose").onclick = () => send({ cmd: "find-close" });
  $("new").onclick = () => send({ cmd: "newtab" });
  $("back").onclick = () => send({ cmd: "back" });
  $("fwd").onclick = () => send({ cmd: "forward" });
  $("home").onclick = () => send({ cmd: "home" });
  $("star").onclick = () => send({ cmd: "bookmark" });
  $("reload").onclick = () => send({ cmd: state.loading ? "stop" : "reload" });
  $("shield").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); send({ cmd: "shield", x: r.left, y: r.bottom }); };
  $("swap").onclick = () => send({ cmd: "split-swap" });
  $("unsplit").onclick = () => send({ cmd: "split-close" });
  $("upd").onclick = () => send({ cmd: "restart" });
  $("menu").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); send({ cmd: "menu", x: r.right, y: r.bottom }); };
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    let c = null;
    if (e.ctrlKey && !e.altKey) {
      if (k === "t") c = e.shiftKey ? "reopen" : "newtab";
      else if (k === "n") c = e.shiftKey ? "private" : "newtab";
      else if (k === "w" || k === "f4") c = "close";
      else if (k === "l") { e.preventDefault(); window.ovner.focusAddress(); return; }
      else if (k === "f") c = "findbar";
      else if (k === "d") c = "bookmark";
      else if (k === "h") c = "history";
      else if (k === "j") c = "downloads";
      else if (k === "p") c = "print";
      else if (k === "tab" || k === "pagedown") c = e.shiftKey || k === "pageup" ? "prevtab" : "nexttab";
      else if (k === "pageup") c = "prevtab";
      else if (/^[1-9]$/.test(k)) c = "tab" + k;
    } else if (e.shiftKey && k === "escape") c = "tasks";
    else if (k === "f5") c = "reload";
    else if (k === "escape" && $("find").classList.contains("show")) c = "find-close";
    if (c) { e.preventDefault(); send({ cmd: "key", k: c }); }
  });
  document.addEventListener("contextmenu", (e) => { if (e.target !== addr && e.target !== findq) e.preventDefault(); });
  applyLang("id");
  document.documentElement.lang = "";
  send({ cmd: "ready" });
})();
</script>
</body>
</html>
