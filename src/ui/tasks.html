<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Task manager</title>
<link rel="stylesheet" href="ovner://page/page.css">
</head>
<body>
<div class="wrap">
<h1 id="h1"></h1>
<div class="bar"><span id="total" class="muted"></span><span style="flex:1"></span><button id="trim"></button><button id="sleepall"></button></div>
<h2 id="hTabs"></h2>
<div class="card"><table id="tabs"><thead><tr><th data-k="title"></th><th data-k="state"></th><th class="num" data-k="ram"></th><th class="num" data-k="blocked"></th><th class="num">Zoom</th><th></th></tr></thead><tbody></tbody></table></div>
<h2 id="hProcs"></h2>
<div class="card"><table id="procs"><thead><tr><th>PID</th><th data-k="kind"></th><th class="num" data-k="ws"></th><th class="num">Commit</th></tr></thead><tbody></tbody></table></div>
<p class="muted" id="note"></p>
</div>
<script>
(function () {
  const post = (o) => window.ipc.postMessage(JSON.stringify(o));
  const mb = (b) => (b / 1048576).toFixed(0) + " MB";
  const W = {
    id: { h1: "Task manager Ovner", trim: "Rapikan RAM sekarang", sleepall: "Tidurkan semua tab lain", tabs: "Tab", procs: "Proses (Ovner + WebView2)",
      title: "Judul", state: "Keadaan", ram: "RAM", blocked: "Diblokir", kind: "Jenis", ws: "RAM (working set)",
      active: "aktif", sleep: "tidur", susp: "ditangguhkan", bg: "latar", priv: "privat", shared: "bersama", close: "Tutup", doSleep: "Tidurkan", total: (n, w, c) => `${n} proses · total ${w} (commit ${c})`,
      kinds: { ovner: "Ovner", browser: "Browser", renderer: "Halaman", gpu: "GPU", utility: "Utilitas", "ppapi-plugin": "Plugin", "sandbox-helper": "Sandbox", "crashpad": "Crashpad", unknown: "Lain", webview2: "WebView2" },
      note: "RAM working set sama dengan kolom Memory di Task Manager Windows. RAM per tab = proses halaman yang melayani tab itu; \"bersama\" berarti satu proses melayani beberapa tab dari situs yang sama. Tab yang tidur tidak punya proses. Diperbarui tiap 2 detik." },
    en: { h1: "Ovner task manager", trim: "Trim memory now", sleepall: "Sleep all other tabs", tabs: "Tabs", procs: "Processes (Ovner + WebView2)",
      title: "Title", state: "State", ram: "RAM", blocked: "Blocked", kind: "Type", ws: "RAM (working set)",
      active: "active", sleep: "sleeping", susp: "suspended", bg: "background", priv: "private", shared: "shared", close: "Close", doSleep: "Sleep", total: (n, w, c) => `${n} processes · total ${w} (commit ${c})`,
      kinds: { ovner: "Ovner", browser: "Browser", renderer: "Page", gpu: "GPU", utility: "Utility", "ppapi-plugin": "Plugin", "sandbox-helper": "Sandbox", "crashpad": "Crashpad", unknown: "Other", webview2: "WebView2" },
      note: "Working-set RAM matches the Memory column in Windows Task Manager. Per-tab RAM = the page process serving that tab; \"shared\" means one process serves several tabs of the same site. Sleeping tabs have no process. Refreshes every 2 seconds." },
  };
  const tag = (txt, on) => `<span class="tag${on ? " on" : ""}">${txt}</span>`;
  window.ovnerPage = (s) => {
    const w = W[s.lang] || W.id;
    document.documentElement.lang = s.lang;
    document.documentElement.dataset.theme = s.theme === "system" ? "" : s.theme;
    for (const [id, k] of [["h1", "h1"], ["trim", "trim"], ["sleepall", "sleepall"], ["hTabs", "tabs"], ["hProcs", "procs"], ["note", "note"]]) document.getElementById(id).textContent = w[k];
    for (const th of document.querySelectorAll("th[data-k]")) th.textContent = w[th.dataset.k];
    const tb = document.querySelector("#tabs tbody"); tb.textContent = "";
    for (const t of s.tabs) {
      const tr = document.createElement("tr");
      const st = t.active ? tag(w.active, true) : t.sleeping ? tag(w.sleep) : t.suspended ? tag(w.susp) : tag(w.bg);
      const ram = t.sleeping ? "—" : t.ram ? mb(t.ram) + (t.shared ? " " + tag(w.shared) : "") : "…";
      tr.innerHTML = `<td></td><td>${st}${t.private ? " " + tag(w.priv) : ""}</td><td class="num">${ram}</td><td class="num">${t.blocked}</td><td class="num">${t.zoom}%</td><td></td>`;
      tr.children[0].textContent = t.title || t.url;
      tr.children[0].title = t.url + (t.pids.length ? "\nPID " + t.pids.join(", ") : "");
      if (!t.active) {
        const b = document.createElement("button"); b.textContent = t.sleeping ? w.close : w.doSleep;
        b.onclick = () => post({ t: t.sleeping ? "tab-close" : "tab-sleep", id: t.id });
        tr.children[5].append(b);
      }
      tb.append(tr);
    }
    const pb = document.querySelector("#procs tbody"); pb.textContent = "";
    let tw = 0, tc = 0;
    for (const p of s.procs) {
      tw += p.working; tc += p.commit;
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${p.pid}</td><td>${w.kinds[p.kind] || p.kind}</td><td class="num">${mb(p.working)}</td><td class="num">${mb(p.commit)}</td>`;
      pb.append(tr);
    }
    document.getElementById("total").textContent = w.total(s.procs.length, mb(tw), mb(tc));
  };
  document.getElementById("trim").onclick = () => post({ t: "trim" });
  document.getElementById("sleepall").onclick = () => post({ t: "sleep-all" });
  post({ t: "page-ready" });
  setInterval(() => post({ t: "page-ready" }), 2000);
})();
</script>
</body>
</html>
