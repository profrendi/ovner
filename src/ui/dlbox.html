<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Unduhan</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#dfe3ea; --fg:#1d2330; --muted:#677087; --acc:#2f6fed; --ok:#1f9d55; --bad:#d64545; --seg:#e7ebf2; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1d22; --card:#24272e; --line:#363a44; --fg:#e8eaef; --muted:#9aa2b4; --acc:#5b8cff; --seg:#2f333c; } }
  :root[data-theme="dark"] { --bg:#1b1d22; --card:#24272e; --line:#363a44; --fg:#e8eaef; --muted:#9aa2b4; --acc:#5b8cff; --seg:#2f333c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; user-select: none; }
  .wrap { display: flex; flex-direction: column; height: 100%; padding: 14px 16px 12px; gap: 10px; }
  .top { display: flex; gap: 12px; align-items: center; }
  .ic { width: 40px; height: 40px; border-radius: 9px; background: var(--acc); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; text-transform: uppercase; }
  .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .url { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
  .grid { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .grid span { color: var(--muted); }
  .grid b { font-weight: 500; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
  .bar { height: 14px; border-radius: 7px; background: var(--seg); overflow: hidden; position: relative; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--acc); border-radius: 7px; transition: width .3s; }
  .bar.ind i { width: 30% !important; animation: ind 1.2s linear infinite; }
  @keyframes ind { from { left: -30%; } to { left: 100%; } }
  .pct { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
  .pct b { color: var(--fg); font-size: 15px; }
  .segs { height: 12px; display: flex; gap: 2px; }
  .segs div { flex: 1; background: var(--seg); border-radius: 3px; position: relative; overflow: hidden; }
  .segs div i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); }
  .segs div.busy i { background: var(--acc); }
  .segl { color: var(--muted); font-size: 11.5px; }
  .btns { display: flex; gap: 8px; margin-top: auto; align-items: center; }
  .btns label { color: var(--muted); font-size: 12px; margin-right: auto; display: flex; gap: 6px; align-items: center; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--acc); }
  button.primary { background: var(--acc); color: #fff; border-color: var(--acc); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  .state-done .bar i { background: var(--ok); }
  .state-failed .bar i, .state-cancelled .bar i { background: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="top">
    <div class="ic" id="ext">…</div>
    <div style="min-width:0;flex:1"><div class="name" id="name"></div><div class="url" id="url"></div></div>
  </div>
  <div class="pct"><span id="status"></span><b id="pct">0%</b></div>
  <div class="bar" id="bar"><i id="fill" style="width:0"></i></div>
  <div class="grid">
    <span id="lSize"></span><b id="size">–</b>
    <span id="lGot"></span><b id="got">–</b>
    <span id="lSpeed"></span><b id="speed">–</b>
    <span id="lEta"></span><b id="eta">–</b>
    <span id="lTime"></span><b id="time">–</b>
    <span id="lServer"></span><b id="server">–</b>
    <span id="lConn"></span><b id="conn">–</b>
    <span id="lPath"></span><b id="path">–</b>
  </div>
  <div id="segbox" hidden><div class="segl" id="lSegs"></div><div class="segs" id="segs"></div></div>
  <div class="btns">
    <label><input type="checkbox" id="never"><span id="lNever"></span></label>
    <button id="pause"></button>
    <button id="cancel" class="danger"></button>
    <button id="show" hidden></button>
    <button id="open" class="primary" hidden></button>
    <button id="close"></button>
  </div>
</div>
<script>
const T = {
  id: { size:"Ukuran", got:"Diterima", speed:"Kecepatan", eta:"Sisa waktu", time:"Berjalan", server:"Server", conn:"Koneksi", path:"Simpan ke", segs:"Bagian yang diunduh bersamaan",
        never:"Jangan tampilkan kotak ini lagi", pause:"Jeda", resume:"Lanjutkan", cancel:"Batal", show:"Buka folder", open:"Buka", close:"Tutup", hide:"Sembunyikan",
        progress:"Mengunduh…", paused:"Dijeda", done:"Selesai", failed:"Gagal", cancelled:"Dibatalkan", unknown:"tidak diketahui", calc:"menghitung…", video:"Video (yt-dlp)", wv:"WebView2 (1 koneksi)", locating:"mencari lokasi…" },
  en: { size:"Size", got:"Received", speed:"Speed", eta:"Time left", time:"Elapsed", server:"Server", conn:"Connections", path:"Save to", segs:"Parts downloading in parallel",
        never:"Don't show this box again", pause:"Pause", resume:"Resume", cancel:"Cancel", show:"Show in folder", open:"Open", close:"Close", hide:"Hide",
        progress:"Downloading…", paused:"Paused", done:"Completed", failed:"Failed", cancelled:"Cancelled", unknown:"unknown", calc:"calculating…", video:"Video (yt-dlp)", wv:"WebView2 (1 connection)", locating:"locating…" },
};
let L = T.id, cur = null;
const $ = (id) => document.getElementById(id);
const send = (t) => window.ipc.postMessage(JSON.stringify({ t, never: $("never").checked }));
function bytes(n) {
  if (!(n > 0)) return "0 B";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(n < 10 ? 2 : 1) : n) + " " + u[i];
}
function dur(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h} j ${m} m` : m ? `${m} m ${x} d` : `${x} d`;
}
function labels() {
  for (const k of ["size", "got", "speed", "eta", "time", "server", "conn", "path", "segs", "never"])
    $("l" + k[0].toUpperCase() + k.slice(1)).textContent = L[k];
  $("cancel").textContent = L.cancel; $("show").textContent = L.show; $("open").textContent = L.open;
}
window.ovnerBox = (s) => {
  cur = s;
  const lang = s.lang === "en" ? "en" : "id";
  if (L !== T[lang]) { L = T[lang]; labels(); }
  document.documentElement.dataset.theme = s.theme === "system" ? "" : s.theme;
  const st = s.state;
  $("wrap").className = "wrap state-" + st;
  $("name").textContent = s.name || s.url;
  document.title = s.name || "Ovner";
  $("url").textContent = s.url;
  const ext = ((s.path || s.name || "").match(/\.([a-z0-9]{1,5})$/i) || [, s.video ? "vid" : "…"])[1];
  $("ext").textContent = ext;
  const pct = s.total > 0 ? Math.min(100, s.received * 100 / s.total) : (st === "done" ? 100 : 0);
  $("pct").textContent = s.total > 0 || st === "done" ? pct.toFixed(1) + "%" : "";
  $("fill").style.width = pct + "%";
  $("bar").classList.toggle("ind", st === "progress" && !(s.total > 0));
  $("status").textContent = L[st] || st;
  $("size").textContent = s.total > 0 ? bytes(s.total) : L.unknown;
  $("got").textContent = bytes(s.received);
  const run = st === "progress";
  $("speed").textContent = run ? (s.speed > 0 ? bytes(s.speed) + "/s" : L.calc) : "–";
  $("eta").textContent = run ? (s.eta > 0 ? dur(s.eta) : L.calc) : st === "done" ? "0 d" : "–";
  $("time").textContent = dur(s.elapsed);
  $("server").textContent = s.server || L.locating;
  $("server").title = s.server || "";
  $("conn").textContent = s.video ? L.video : s.engine ? String(s.conns || (s.segs || []).length || 1) : L.wv;
  $("path").textContent = s.path || "–"; $("path").title = s.path || "";
  const segs = s.segs || [];
  $("segbox").hidden = !(segs.length > 1 && run);
  if (segs.length > 1) {
    const box = $("segs");
    while (box.children.length < segs.length) box.appendChild(document.createElement("div")).appendChild(document.createElement("i"));
    while (box.children.length > segs.length) box.lastChild.remove();
    segs.forEach(([a, p, e, busy], i) => {
      const d = box.children[i];
      d.className = busy ? "busy" : "";
      d.style.flex = String(Math.max(1, e - a));
      d.firstChild.style.width = (e > a ? Math.min(100, (p - a) * 100 / (e - a)) : 100) + "%";
    });
  }
  const canPause = run && s.engine || st === "paused";
  $("pause").hidden = !(canPause || (run && !s.video));
  $("pause").textContent = st === "paused" ? L.resume : L.pause;
  $("cancel").hidden = !(run || st === "paused");
  $("open").hidden = !s.exists;
  $("show").hidden = !s.exists;
  $("close").textContent = run || st === "paused" ? L.hide : L.close;
};
labels();
$("pause").onclick = () => send(cur && cur.state === "paused" ? "dl-resume" : "dl-pause");
$("cancel").onclick = () => send("dl-cancel");
$("open").onclick = () => send("dl-open");
$("show").onclick = () => send("dl-show");
$("close").onclick = () => send($("never").checked ? "never" : "close");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("close").click(); });
window.ipc.postMessage(JSON.stringify({ t: "ready" }));
</script>
</body>
</html>
