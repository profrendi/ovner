<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ovner</title>
<link rel="stylesheet" href="ovner://page/page.css">
<style>
  textarea { width: 100%; min-height: 90px; font: 12.5px/1.4 Consolas, "Cascadia Mono", monospace; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; box-sizing: border-box; resize: vertical; }
  .row.col { flex-direction: column; align-items: stretch; }
  .exp { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; font-size: 11px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  nav { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; background: var(--bg); }
  nav a { font-size: 12.5px; color: var(--muted); text-decoration: none; padding: 3px 9px; border: 1px solid var(--line); border-radius: 12px; }
  nav a:hover { color: var(--accent); border-color: var(--accent); }
  #q { width: 100%; box-sizing: border-box; margin-bottom: 6px; }
  .hide { display: none !important; }
  h2 { scroll-margin-top: 96px; }
</style>
</head>
<body>
<div class="wrap">
<h1><span id="h1"></span> <span class="tag" id="ver"></span></h1>
<p class="muted" id="intro"></p>
<input type="search" id="q">
<nav id="nav"></nav>
<div id="form"></div>
<h2 id="aboutH"></h2>
<div class="card"><div class="row"><div class="lbl" id="about"></div><button id="update"></button></div></div>
</div>
<script>
(function () {
  const post = (o) => window.ipc.postMessage(JSON.stringify(o));
  let L = "id";
  const T = (pair) => (Array.isArray(pair) ? pair[L === "id" ? 0 : 1] : pair || "");
  const UI = {
    h1: ["Pengaturan Ovner", "Ovner settings"],
    intro: ["Perubahan disimpan otomatis. Yang bertanda ↻ berlaku setelah Ovner dibuka ulang:", "Changes are saved automatically. Items marked ↻ apply after Ovner restarts:"],
    restart: ["Buka ulang Ovner", "Restart Ovner"],
    search: ["Cari pengaturan", "Search settings"],
    about: ["Tentang", "About"],
    update: ["Periksa update", "Check for updates"],
    exp: ["eksperimen", "experimental"],
    importNone: ["Tidak ada Chrome, Edge, atau Brave di komputer ini.", "No Chrome, Edge or Brave found on this computer."],
    importBtn: ["Impor", "Import"],
    engine: ["Mesin", "Engine"], blocker: ["Pemblokir", "Blocker"], data: ["Folder data", "Data folder"],
  };
  const R = "r"; // berlaku setelah dibuka ulang
  const X = "x"; // eksperimen
  const yes = (id, en) => [id, en];
  // [kunci, jenis, label, keterangan, pilihan, tanda]
  const schema = [
    ["look", ["Bahasa dan tampilan", "Language and appearance"], [
      ["language", "select", yes("Bahasa", "Language"), "", [["auto", "Ikuti Windows", "Follow Windows"], ["id", "Bahasa Indonesia", "Bahasa Indonesia"], ["en", "English", "English"]]],
      ["theme", "select", yes("Tema", "Theme"), "", [["system", "Ikuti Windows", "Follow Windows"], ["light", "Terang", "Light"], ["dark", "Gelap", "Dark"]]],
      ["bookmark_bar", "bool", yes("Tampilkan bilah bookmark", "Show bookmarks bar"), yes("Brave Origin: mati.", "Brave Origin: off.")],
      ["home_button", "bool", yes("Tampilkan tombol beranda", "Show home button"), yes("Brave Origin: mati.", "Brave Origin: off.")],
      ["home_url", "text", yes("Alamat beranda", "Home page address"), yes("Kosong = halaman tab baru.", "Empty = new tab page.")],
      ["newtab", "select", yes("Halaman tab baru", "New tab page"), "", [["blank", "Kosong (Brave Origin)", "Blank (Brave Origin)"], ["ovner", "Kotak cari Ovner", "Ovner search box"]]],
      ["default_zoom", "number", yes("Zoom bawaan (%)", "Default zoom (%)"), yes("Untuk tab baru. Ctrl + / − untuk tiap tab.", "For new tabs. Ctrl + / − per tab.")],
      ["force_dark", "bool", yes("Paksa mode gelap di semua situs", "Force dark mode on all sites"), yes("Fitur Chromium (seperti Servo: gaya pengguna).", "Chromium feature (like Servo user styles)."), null, [R]],
      ["user_css", "textarea", yes("CSS sendiri", "Custom CSS"), yes("Dipasang di semua halaman. Berlaku saat tab dimuat ulang.", "Applied to every page. Takes effect when a tab reloads.")],
    ]],
    ["search", ["Pencarian dan kolom alamat", "Search and address bar"], [
      ["search_engine", "select", yes("Mesin pencari", "Search engine"), yes("Ovner tidak mengirim saran pencarian saat mengetik.", "Ovner never sends search suggestions while you type."), [["google", "Google", "Google"], ["duckduckgo", "DuckDuckGo", "DuckDuckGo"], ["brave", "Brave Search", "Brave Search"], ["bing", "Bing", "Bing"]]],
      ["search_engine", "text", yes("…atau alamat pencarian sendiri", "…or your own search URL"), yes("Gunakan %s untuk kata kunci, mis. https://www.ecosia.org/search?q=%s", "Use %s for the query, e.g. https://www.ecosia.org/search?q=%s")],
      ["bangs", "bool", yes("!bangs", "!bangs"), yes("Ketik !w, !yt, !gh, !g, !tok, !shp, !kbbi, !tr… di awal atau akhir kata kunci (seperti Helium).", "Type !w, !yt, !gh, !g, !tok, !shp, !tr… at the start or end of a query (like Helium).")],
      ["custom_bangs", "lines", yes("Bang sendiri", "Custom bangs"), yes("Satu per baris: !kode https://alamat?q=%s", "One per line: !code https://address?q=%s")],
      ["address_suggestions", "bool", yes("Saran dari riwayat dan bookmark", "Suggestions from history and bookmarks"), yes("Lokal saja, tanpa koneksi ke mana pun.", "Local only, nothing is sent anywhere.")],
      ["no_search", "bool", yes("Kolom alamat tanpa pencarian (No Search)", "Address bar without search (No Search)"), yes("Seperti ungoogled-chromium: teks bukan alamat tidak dicari.", "Like ungoogled-chromium: text that isn't an address is not searched.")],
    ]],
    ["shields", ["Shields", "Shields"], [
      ["block_ads", "bool", yes("Blokir iklan dan pelacak", "Block ads and trackers"), yes("adblock-rust (Brave): EasyList, EasyPrivacy, ABPindo, uBlock.", "adblock-rust (Brave): EasyList, EasyPrivacy, ABPindo, uBlock.")],
      ["cosmetic_filtering", "bool", yes("Sembunyikan kotak iklan yang kosong", "Hide empty ad boxes"), yes("Aturan kosmetik (##).", "Cosmetic rules (##).")],
      ["block_cookie_notices", "bool", yes("Blokir popup persetujuan cookie", "Block cookie consent pop-ups"), yes("Daftar uBlock cookie dan EasyList Cookie.", "uBlock cookie list and EasyList Cookie.")],
      ["farbling", "select", yes("Acak sidik jari (farbling)", "Randomize fingerprint (farbling)"), yes("Standar aman untuk hampir semua situs. Ketat lebih kuat tapi lebih sering membuat situs rewel. Bisa dimatikan per situs lewat tameng.", "Standard is safe for nearly all sites. Strict is stronger but breaks more sites. Can be turned off per site from the shield."), [["off", "Mati", "Off"], ["standard", "Standar", "Standard"], ["strict", "Ketat", "Strict"]]],
      ["strip_tracking_params", "bool", yes("Buang parameter pelacak dari alamat", "Strip tracking parameters"), yes("fbclid, gclid, utm_*, dan sejenisnya.", "fbclid, gclid, utm_*, and similar.")],
      ["debounce", "bool", yes("Lewati link pengalih pelacak (debounce)", "Skip tracking redirects (debounce)"), yes("l.facebook.com, google.com/url, out.reddit.com, … langsung ke tujuan.", "l.facebook.com, google.com/url, out.reddit.com, … go straight to the target.")],
      ["de_amp", "bool", yes("Buka halaman asli, bukan AMP (de-AMP)", "Open the real page, not AMP (de-AMP)"), ""],
      ["https_only", "bool", yes("Naikkan ke HTTPS", "Upgrade to HTTPS"), yes("Kembali ke http bila situs tidak mendukung HTTPS.", "Falls back to http if the site has no HTTPS.")],
      ["gpc", "bool", yes("Kirim Global Privacy Control dan Do Not Track", "Send Global Privacy Control and Do Not Track"), ""],
      ["block_telemetry", "bool", yes("Blokir telemetri Microsoft Edge/Office", "Block Microsoft Edge/Office telemetry"), ""],
      ["block_privacy_sandbox", "bool", yes("Matikan API iklan Chromium dan eksperimen", "Disable Chromium ad APIs and field trials"), yes("Topics, FLEDGE, Attribution Reporting, FedCM (seperti Helium).", "Topics, FLEDGE, Attribution Reporting, FedCM (like Helium)."), null, [R]],
      ["cname_uncloak", "bool", yes("Ungkap pelacak yang menyamar (CNAME)", "Uncloak disguised trackers (CNAME)"), yes("Mencari nama asli subdomain lewat DNS di latar. Permintaan pertama ke subdomain baru tetap lewat.", "Looks up subdomains' real names via DNS in the background. The first request to a new subdomain still passes."), null, [X]],
      ["auto_update_filters", "bool", yes("Perbarui daftar filter otomatis", "Update filter lists automatically"), yes("Seminggu sekali di latar.", "Weekly in the background.")],
      ["exceptions", "list", yes("Situs tanpa pemblokir iklan", "Sites without ad blocking"), yes("Pisahkan dengan koma. Juga lewat tameng.", "Comma-separated. Also via the shield.")],
      ["script_blocked", "list", yes("Situs dengan JavaScript diblokir", "Sites with JavaScript blocked"), ""],
      ["farbling_off", "list", yes("Situs tanpa acak sidik jari", "Sites without fingerprint randomization"), yes("Mis. situs bank yang rewel.", "E.g. picky banking sites.")],
      ["custom_lists", "lines", yes("Daftar filter tambahan (alamat)", "Extra filter lists (URLs)"), yes("Satu alamat per baris, format EasyList/uBlock.", "One URL per line, EasyList/uBlock format.")],
      ["custom_rules", "textarea", yes("Aturan filter sendiri", "My filter rules"), yes("Format EasyList/uBlock. Pemilih elemen menambah aturan ke sini.", "EasyList/uBlock format. The element picker adds rules here.")],
    ]],
    ["privacy", ["Privasi dan keamanan", "Privacy and security"], [
      ["save_history", "bool", yes("Simpan riwayat kunjungan", "Save browsing history"), ""],
      ["clear_on_exit", "bool", yes("Hapus cookie, cache, dan data situs saat keluar", "Clear cookies, cache and site data on exit"), ""],
      ["deny_sensitive_permissions", "bool", yes("Tolak kamera, mikrofon, dan lokasi", "Deny camera, microphone and location"), ""],
      ["secure_dns", "select", yes("Secure DNS (DNS-over-HTTPS)", "Secure DNS (DNS-over-HTTPS)"), yes("Saran Brave Origin bila halaman terasa lambat.", "Brave Origin's suggestion when pages feel slow."), [["off", "Mati (DNS Windows)", "Off (Windows DNS)"], ["cloudflare", "Cloudflare", "Cloudflare"], ["quad9", "Quad9", "Quad9"], ["adguard", "AdGuard", "AdGuard"]], [R, X]],
      ["network_prediction", "bool", yes("Prediksi jaringan (prefetch DNS, preconnect)", "Network prediction (DNS prefetch, preconnect)"), yes("Brave Origin: nyala (speed fix).", "Brave Origin: on (speed fix)."), null, [R]],
      ["webrtc_policy", "select", yes("Kebijakan WebRTC", "WebRTC policy"), "", [["default", "Bawaan", "Default"], ["proxy_only", "Sembunyikan IP lokal", "Hide local IP"]], [R]],
      ["autoplay", "bool", yes("Putar media otomatis", "Autoplay media"), "", null, [R]],
      ["password_manager", "bool", yes("Pengelola kata sandi", "Password manager"), yes("Brave Origin: mati.", "Brave Origin: off.")],
      ["autofill", "bool", yes("Isi otomatis alamat dan kartu", "Autofill addresses and cards"), yes("Brave Origin: mati.", "Brave Origin: off.")],
      ["spellcheck", "bool", yes("Pemeriksa ejaan", "Spell check"), yes("Brave Origin: mati.", "Brave Origin: off.")],
      ["smartscreen", "bool", yes("SmartScreen", "SmartScreen"), yes("Cek reputasi alamat ke Microsoft.", "Checks address reputation with Microsoft."), null, [R]],
      ["edge_tracking_prevention", "bool", yes("Tracking prevention bawaan Edge", "Edge built-in tracking prevention"), yes("Shields Ovner sudah menangani ini; mati = lebih ringan.", "Ovner's Shields already handle this; off = lighter."), null, [R]],
      ["local_crash_reports", "bool", yes("Laporan crash disimpan lokal", "Keep crash reports local"), "", null, [R]],
      ["disable_webgl", "bool", yes("Matikan WebGL", "Disable WebGL"), yes("Kurangi sidik jari dan RAM; game/peta 3D tidak jalan.", "Less fingerprinting and RAM; 3D games/maps won't work."), null, [R]],
      ["popups_to_tabs", "bool", yes("Semua pop-up jadi tab", "Open all pop-ups as tabs"), yes("Termasuk jendela login kecil.", "Including small login windows.")],
      ["disable_beforeunload", "bool", yes("Abaikan dialog \"Tinggalkan situs?\"", "Ignore \"Leave site?\" dialogs"), ""],
    ]],
    ["downloads", ["Unduhan", "Downloads"], [
      ["download_dir", "text", yes("Folder unduhan", "Download folder"), yes("Kosong = folder Downloads Windows.", "Empty = Windows Downloads folder.")],
    ]],
    ["startup", ["Saat mulai", "On startup"], [
      ["restore_tabs", "bool", yes("Buka lagi tab terakhir", "Reopen last tabs"), yes("Semua tab tidur sampai diklik.", "All tabs sleep until clicked.")],
      ["autostart", "bool", yes("Mulai bersama Windows (di tray)", "Start with Windows (in tray)"), ""],
    ]],
    ["ram", ["Hemat RAM", "Save memory"], [
      ["sleep_tabs_minutes", "number", yes("Tidurkan tab setelah (menit)", "Sleep tabs after (minutes)"), yes("0 = tidak pernah. Tab yang memutar suara tidak ditidurkan.", "0 = never. Tabs playing audio are not slept.")],
      ["suspend_hidden_tabs", "bool", yes("Tangguhkan tab di belakang", "Suspend background tabs"), ""],
      ["close_to_tray", "bool", yes("Tombol X menyembunyikan Ovner ke tray", "Close button hides Ovner to the tray"), ""],
      ["low_memory_when_hidden", "bool", yes("Mode memori rendah saat diminimalkan/di tray", "Low memory mode when minimized/in tray"), ""],
      ["trim_when_hidden", "bool", yes("Rapikan RAM saat diminimalkan/di tray", "Trim memory when minimized/in tray"), ""],
      ["trim_every_minutes", "number", yes("Rapikan ulang tiap (menit)", "Trim again every (minutes)"), yes("0 = sekali saja.", "0 = once.")],
      ["efficiency_mode", "bool", yes("Mode efisiensi Windows saat tersembunyi", "Windows efficiency mode when hidden"), ""],
      ["simulate_memory_pressure", "bool", yes("Tekanan memori simulasi untuk tab tidak aktif", "Simulated memory pressure for inactive tabs"), "", null, [R]],
      ["low_end_mode", "bool", yes("Mode perangkat RAM kecil", "Low-end device mode"), "", null, [R]],
      ["v8_optimize_for_size", "bool", yes("JavaScript hemat memori", "Memory-saving JavaScript"), "", null, [R]],
      ["site_isolation", "bool", yes("Isolasi situs", "Site isolation"), yes("Lebih aman, lebih banyak RAM.", "Safer, more RAM."), null, [R]],
      ["renderer_process_limit", "number", yes("Batas proses halaman", "Page process limit"), yes("0 = otomatis. 2–4 menghemat RAM bila banyak tab (seperti mode satu proses Servo).", "0 = automatic. 2–4 saves RAM with many tabs (like Servo's single-process mode)."), null, [R]],
      ["process_per_site", "bool", yes("Satu proses per situs", "One process per site"), yes("Tab dari situs yang sama berbagi proses.", "Tabs of the same site share a process."), null, [R]],
      ["spare_renderer", "bool", yes("Proses renderer cadangan", "Spare renderer process"), "", null, [R]],
      ["no_gpu", "bool", yes("Matikan akselerasi GPU", "Disable GPU acceleration"), "", null, [R]],
      ["zero_copy", "bool", yes("Zero-copy rasterizer", "Zero-copy rasterizer"), yes("Brave Origin: nyala.", "Brave Origin: on."), null, [R]],
      ["parallel_downloading", "bool", yes("Unduhan paralel", "Parallel downloading"), yes("Brave Origin: nyala.", "Brave Origin: on."), null, [R]],
      ["extra_browser_args", "text", yes("Argumen tambahan WebView2", "Extra WebView2 arguments"), "", null, [R]],
    ]],
    ["system", ["Sistem", "System"], [
      ["check_updates", "bool", yes("Periksa versi baru saat dibuka", "Check for updates on start"), ""],
      ["update_channel", "select", yes("Kanal update", "Update channel"), yes("Nightly mendapat fitur baru lebih dulu, mungkin kurang stabil.", "Nightly gets new features first, may be less stable."), [["stable", "Stabil", "Stable"], ["nightly", "Nightly", "Nightly"]]],
      ["devtools", "bool", yes("Izinkan DevTools (F12)", "Allow DevTools (F12)"), yes("Brave Origin: mati.", "Brave Origin: off.")],
      ["diagnostics", "bool", yes("Catat pemakaian RAM ke log", "Log memory usage"), ""],
      ["extensions_enabled", "bool", yes("Ekstensi", "Extensions"), yes("Mis. uBlock Origin Lite yang sudah diekstrak.", "E.g. an extracted uBlock Origin Lite."), null, [R, X]],
      ["extension_dirs", "lines", yes("Folder ekstensi", "Extension folders"), yes("Satu folder per baris.", "One folder per line."), null, [R, X]],
    ]],
  ];

  let state = {}, browsers = [];
  const form = document.getElementById("form");
  const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const k in attrs) if (k === "html") e.innerHTML = attrs[k]; else e[k] = attrs[k]; e.append(...kids); return e; };
  const known = ["google", "duckduckgo", "brave", "bing"];

  function control(key, kind, opts) {
    const v = state[key];
    const set = (value) => post({ t: "set", key, value });
    if (kind === "bool") {
      const inp = h("input", { type: "checkbox", checked: !!v });
      inp.onchange = () => set(inp.checked);
      return h("label", { className: "switch" }, inp, h("span", {}));
    }
    if (kind === "select") {
      const sel = h("select", {});
      let any = false;
      for (const [val, id, en] of opts) { const o = h("option", { value: val, textContent: L === "id" ? id : en, selected: val === v }); any = any || val === v; sel.append(o); }
      if (!any && key === "search_engine") sel.append(h("option", { value: v, textContent: L === "id" ? "Alamat sendiri" : "Custom", selected: true }));
      sel.onchange = () => set(sel.value);
      return sel;
    }
    if (kind === "number") { const c = h("input", { type: "number", value: v ?? 0, min: 0 }); c.onchange = () => set(Number(c.value) || 0); return c; }
    if (kind === "list") { const c = h("input", { type: "text", value: (v || []).join(", ") }); c.onchange = () => set(c.value.split(",").map((x) => x.trim()).filter(Boolean)); return c; }
    if (kind === "lines") { const c = h("textarea", { value: (v || []).join("\n"), spellcheck: false }); c.onchange = () => set(c.value.split("\n").map((x) => x.trim()).filter(Boolean)); return c; }
    if (kind === "textarea") { const c = h("textarea", { value: v ?? "", spellcheck: false }); c.onchange = () => set(c.value); return c; }
    const c = h("input", { type: "text", value: key === "search_engine" && known.includes(v) ? "" : v ?? "" });
    c.onchange = () => set(key === "search_engine" ? (c.value.trim() || "google") : c.value);
    return c;
  }

  function build() {
    form.textContent = "";
    const nav = document.getElementById("nav"); nav.textContent = "";
    for (const [id, title, items] of schema) {
      nav.append(h("a", { href: "#s-" + id, textContent: T(title) }));
      form.append(h("h2", { id: "s-" + id, textContent: T(title) }));
      const card = h("div", { className: "card" });
      for (const [key, kind, label, hint, opts, flags] of items) {
        const wide = kind === "textarea" || kind === "lines";
        const row = h("div", { className: "row" + (wide ? " col" : "") });
        row.dataset.text = (T(label) + " " + T(hint) + " " + key).toLowerCase();
        const fl = flags || [];
        const mark = (fl.includes(R) ? " ↻" : "") + (fl.includes(X) ? `<span class="exp">${T(UI.exp)}</span>` : "");
        row.append(h("div", { className: "lbl", html: `${T(label)}${mark}<small>${T(hint)}</small>` }));
        row.append(control(key, kind, opts));
        card.append(row);
      }
      if (id === "look") {
        // Impor bookmark ada di bagian pertama supaya mudah ditemukan.
      }
      form.append(card);
    }
    // Impor bookmark
    form.append(h("h2", { id: "s-import", textContent: L === "id" ? "Impor bookmark" : "Import bookmarks" }));
    nav.append(h("a", { href: "#s-import", textContent: L === "id" ? "Impor" : "Import" }));
    const ic = h("div", { className: "card" });
    if (!browsers.length) ic.append(h("div", { className: "row" }, h("div", { className: "lbl muted", textContent: T(UI.importNone) })));
    for (const b of browsers) {
      const btn = h("button", { textContent: T(UI.importBtn) });
      btn.onclick = () => post({ t: "import", path: b.path });
      ic.append(h("div", { className: "row" }, h("div", { className: "lbl", html: `${b.name}<small></small>` }), btn));
      ic.lastChild.querySelector("small").textContent = b.path;
    }
    form.append(ic);
    filter();
  }

  function filter() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    for (const r of form.querySelectorAll(".row[data-text]")) r.classList.toggle("hide", !!q && !r.dataset.text.includes(q));
  }

  window.ovnerPage = (s) => {
    const langChanged = L !== s.lang;
    L = s.lang; state = s.settings; browsers = s.browsers || [];
    document.documentElement.lang = L;
    document.documentElement.dataset.theme = state.theme === "system" ? "" : state.theme;
    document.getElementById("h1").textContent = T(UI.h1);
    document.title = L === "id" ? "Pengaturan" : "Settings";
    document.getElementById("ver").textContent = "v" + s.version;
    document.getElementById("intro").innerHTML = T(UI.intro) + ` <button id="restart">${T(UI.restart)}</button>`;
    document.getElementById("restart").onclick = () => post({ t: "restart" });
    document.getElementById("q").placeholder = T(UI.search);
    document.getElementById("aboutH").textContent = T(UI.about);
    document.getElementById("update").textContent = T(UI.update);
    document.getElementById("about").innerHTML = `Ovner ${s.version}<small>${T(UI.engine)}: Microsoft Edge WebView2 ${s.engine}<br>${T(UI.blocker)}: adblock-rust (Brave), ${s.lists}<br>${T(UI.data)}: <span id="dd"></span><br>github.com/profrendi/ovner</small>`;
    document.getElementById("dd").textContent = s.data;
    const a = document.activeElement;
    if (!langChanged && a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT") && a.id !== "q") return;
    build();
  };
  document.getElementById("q").oninput = filter;
  document.getElementById("update").onclick = () => post({ t: "check-update" });
  post({ t: "page-ready" });
})();
</script>
</body>
</html>
