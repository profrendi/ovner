<title>Ovner</title>

<style>
  textarea { width: 100%; min-height: 90px; font: 12.5px/1.4 Consolas, "Cascadia Mono", monospace; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; box-sizing: border-box; resize: vertical; }
  .row.col { flex-direction: column; align-items: stretch; }
  .exp { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; font-size: 11px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  nav { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 0; background: var(--bg); }
  nav a { font-size: 12.5px; color: var(--muted); text-decoration: none; padding: 3px 9px; border: 1px solid var(--line); border-radius: 12px; }
  nav a:hover { color: var(--accent); border-color: var(--accent); }
  #q { width: 100%; box-sizing: border-box; margin-bottom: 6px; }
  .hide { display: none !important; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 4px; }
  .preset { text-align: left; padding: 14px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
  .preset:hover { border-color: var(--accent); }
  .preset.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .preset b { display: block; font-size: 15px; margin-bottom: 6px; }
  .preset span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  #details { margin: 14px 0 4px; }
  @media (max-width: 640px) { .presets { grid-template-columns: 1fr; } }
  h2 { scroll-margin-top: 96px; }
</style>
</head>

  let state = {}, browsers = [], defStatus = {};
  const form = document.getElementById("form");
  const h = (tag, attrs, ...kids) => { const e = document.createElement(tag); for (const k in attrs) if (k === "html") e.innerHTML = attrs[k]; else e[k] = attrs[k]; e.append(...kids); return e; };
  const known = ["google", "duckduckgo", "brave", "bing", "qwant", "startpage", "leta", "ecosia", "mojeek"];

  function control(key, kind, opts) {
    const v = state[key];
    const set = (value) => post({ t: "set", key, value });
    if (kind === "defaultbrowser") {
      const d = defStatus || {};
      const on = (x) => (x ? "✓" : "✗");
      const all = d.http && d.https && d.html && d.pdf;
      const txt = h("span", { className: "muted" });
      txt.textContent = !d.registered
        ? (L === "id" ? "Belum terdaftar" : "Not registered")
        : (all ? (L === "id" ? "Ovner adalah browser default ✓" : "Ovner is the default browser ✓") : (L === "id" ? "Terdaftar" : "Registered"))
          + ` — http ${on(d.http)} · https ${on(d.https)} · HTML ${on(d.html)} · PDF ${on(d.pdf)}`;
      const set = h("button", { className: "primary", textContent: L === "id" ? (all ? "Buka Aplikasi default" : "Jadikan browser default") : (all ? "Open Default apps" : "Make default browser") });
      set.onclick = () => post({ t: "action", name: "default-browser-set" });
      const box = h("div", { style: "display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end" }, txt, set);
      if (d.registered) {
        const rm = h("button", { textContent: L === "id" ? "Lepas" : "Unregister" });
        rm.title = L === "id" ? "Hapus pendaftaran Ovner sebagai browser" : "Remove Ovner's browser registration";
        rm.onclick = () => post({ t: "action", name: "default-browser-remove" });
        box.append(rm);
      }
      return box;
    }
    if (kind === "action") {
      const b = h("button", { textContent: T(opts) });
      if (key === "uninstall") b.className = "danger";
      b.onclick = () => post({ t: "action", name: key });
      return b;
    }
    if (kind === "bool") {
      const inp = h("input", { type: "checkbox", checked: !!v });
      inp.onchange = () => set(inp.checked);
      return h("label", { className: "switch" }, inp, h("span", {}));
    }
    if (kind === "select") {
      const sel = h("select", {});
      let any = false;
      for (const [val, id, en] of opts) { const o = h("option", { value: val, textContent: L === "id" ? id : en, selected: val === v }); any = any || val === v; sel.append(o); }
      if (!any && key === "search_engine") sel.append(h("option", { value: v, textContent: L === "id" ? "Alamat sendiri" : "Custom", selected: true }));
      sel.onchange = () => set(sel.value);
      return sel;
    }
    if (kind === "number") { const c = h("input", { type: "number", value: v ?? 0, min: 0 }); c.onchange = () => set(Number(c.value) || 0); return c; }
    if (kind === "list") { const c = h("input", { type: "text", value: (v || []).join(", ") }); c.onchange = () => set(c.value.split(",").map((x) => x.trim()).filter(Boolean)); return c; }
    if (kind === "lines") { const c = h("textarea", { value: (v || []).join("\n"), spellcheck: false }); c.onchange = () => set(c.value.split("\n").map((x) => x.trim()).filter(Boolean)); return c; }
    if (kind === "textarea") { const c = h("textarea", { value: v ?? "", spellcheck: false }); c.onchange = () => set(c.value); return c; }
    const c = h("input", { type: "text", value: key === "search_engine" && known.includes(v) ? "" : v ?? "" });
    c.onchange = () => set(key === "search_engine" ? (c.value.trim() || "google") : c.value);
    return c;
  }

  function build() {
    form.textContent = "";
    const nav = document.getElementById("nav"); nav.textContent = "";
    for (const [id, title, items] of schema) {
      nav.append(h("a", { href: "#s-" + id, textContent: T(title) }));
      form.append(h("h2", { id: "s-" + id, textContent: T(title) }));
      const card = h("div", { className: "card" });
      for (const [key, kind, label, hint, opts, flags] of items) {
        const wide = kind === "textarea" || kind === "lines";
        const row = h("div", { className: "row" + (wide ? " col" : "") });
        row.dataset.text = (T(label) + " " + T(hint) + " " + key).toLowerCase();
        const fl = flags || [];
        const mark = (fl.includes(R) ? " ↻" : "") + (fl.includes(X) ? `<span class="exp">${T(UI.exp)}</span>` : "");
        row.append(h("div", { className: "lbl", html: `${T(label)}${mark}<small>${T(hint)}</small>` }));
        row.append(control(key, kind, opts));
        card.append(row);
      }
      form.append(card);
      if (id === "shields") buildLists();
    }
    // Impor bookmark
    form.append(h("h2", { id: "s-import", textContent: L === "id" ? "Impor bookmark" : "Import bookmarks" }));
    nav.append(h("a", { href: "#s-import", textContent: L === "id" ? "Impor" : "Import" }));
    const ic = h("div", { className: "card" });
    if (!browsers.length) ic.append(h("div", { className: "row" }, h("div", { className: "lbl muted", textContent: T(UI.importNone) })));
    for (const b of browsers) {
      const btn = h("button", { textContent: T(UI.importBtn) });
      btn.onclick = () => post({ t: "import", path: b.path });
      ic.append(h("div", { className: "row" }, h("div", { className: "lbl", html: `${b.name}<small></small>` }), btn));
      ic.lastChild.querySelector("small").textContent = b.path;
    }
    form.append(ic);
    filter();
  }

  // Daftar filter opsional, seperti brave://settings/shields/filters.
  let catalog = [];
  function buildLists() {
    const title = L === "id" ? "Daftar filter" : "Filter lists";
    form.append(h("h2", { id: "s-lists", textContent: title }));
    document.getElementById("nav").append(h("a", { href: "#s-lists", textContent: title }));
    const card = h("div", { className: "card" });
    const row = (c) => {
      const r = h("div", { className: "row" });
      r.dataset.text = (c.title.join(" ") + " " + c.desc).toLowerCase();
      r.append(h("div", { className: "lbl", html: `${L === "id" ? c.title[0] : c.title[1]}<small></small>` }));
      r.querySelector("small").textContent = c.desc;
      const inp = h("input", { type: "checkbox", checked: !!c.on });
      inp.onchange = () => {
        if (c.setting) { post({ t: "set", key: c.setting, value: inp.checked }); return; }
        const cur = new Set(state.filter_lists || []);
        if (inp.checked) cur.add(c.id); else cur.delete(c.id);
        post({ t: "set", key: "filter_lists", value: [...cur] });
      };
      r.append(h("label", { className: "switch" }, inp, h("span", {})));
      return r;
    };
    for (const c of catalog.filter((c) => !c.regional)) card.append(row(c));
    const reg = h("details", {});
    const on = catalog.filter((c) => c.regional && c.on).length;
    reg.append(h("summary", { className: "row", textContent: (L === "id" ? "Daftar iklan situs berbahasa lain" : "Regional ad blocking lists") + (on ? ` (${on})` : "") }));
    for (const c of catalog.filter((c) => c.regional)) reg.append(row(c));
    card.append(reg);
    const upd = h("button", { textContent: L === "id" ? "Perbarui daftar sekarang" : "Update lists now" });
    upd.onclick = () => post({ t: "action", name: "update-filters" });
    card.append(h("div", { className: "row" }, h("div", { className: "lbl", html: (L === "id"
      ? "Selalu aktif: EasyList, EasyPrivacy, ABPindo, uBlock (filters, 2020–2026, privacy, badware, quick fixes, unbreak, resource abuse, link shorteners), URLhaus malware, Brave (unbreak, specific, social, first-party, sugarcoat)."
      : "Always on: EasyList, EasyPrivacy, ABPindo, uBlock (filters, 2020–2026, privacy, badware, quick fixes, unbreak, resource abuse, link shorteners), URLhaus malware, Brave (unbreak, specific, social, first-party, sugarcoat).") + "<small></small>" }), upd));
    form.append(card);
  }

  let showAll = false;
  try { showAll = localStorage.getItem("ovner-settings-all") === "1"; } catch (e) {}
  function renderPresets() {
    document.getElementById("presetH").textContent = T(UI.presetH);
    const box = document.getElementById("presets"); box.textContent = "";
    for (const [id, name, desc] of PRESETS) {
      const b = h("button", { className: "preset" + (state.preset === id ? " on" : "") });
      b.append(h("b", { textContent: T(name) }), h("span", { textContent: T(desc) }));
      b.onclick = () => post({ t: "preset", name: id });
      box.append(b);
    }
    document.getElementById("presetNote").textContent = state.preset === "custom" ? T(UI.custom) : T(UI.presetNote);
    const d = document.getElementById("details");
    d.textContent = showAll ? T(UI.hideAll) : T(UI.showAll);
    document.getElementById("all").classList.toggle("hide", !showAll);
  }
  document.getElementById("details").onclick = () => {
    showAll = !showAll;
    try { localStorage.setItem("ovner-settings-all", showAll ? "1" : "0"); } catch (e) {}
    renderPresets();
  };

  function filter() {
    const q = document.getElementById("q").value.trim().toLowerCase();
    for (const r of form.querySelectorAll(".row[data-text]")) r.classList.toggle("hide", !!q && !r.dataset.text.includes(q));
  }

  window.ovnerPage = (s) => {
    const langChanged = L !== s.lang;
    L = s.lang; state = s.settings; browsers = s.browsers || []; defStatus = s.defaultStatus || {}; catalog = s.catalog || [];
    document.documentElement.lang = L;
    document.documentElement.dataset.theme = state.theme === "system" ? "" : state.theme;
    document.getElementById("h1").textContent = T(UI.h1);
    document.title = L === "id" ? "Pengaturan" : "Settings";
    document.getElementById("ver").textContent = "v" + s.version;
    document.getElementById("intro").innerHTML = T(UI.intro) + ` <button id="restart">${T(UI.restart)}</button>`;
    document.getElementById("restart").onclick = () => post({ t: "restart" });
    document.getElementById("q").placeholder = T(UI.search);
    document.getElementById("aboutH").textContent = T(UI.about);
    document.getElementById("update").textContent = T(UI.update);
    for (const [id, a, b] of [["aDiag", "Diagnostik", "Diagnostics"], ["aLog", "Buka log", "Open log"], ["aApp", "Folder aplikasi", "App folder"], ["aData", "Folder data", "Data folder"], ["aUn", "Uninstall Ovner", "Uninstall Ovner"]]) {
      const el = document.getElementById(id);
      el.textContent = L === "id" ? a : b;
      el.onclick = () => post({ t: "action", name: el.dataset.act });
    }
    document.getElementById("about").innerHTML = `Ovner ${s.version}<small>${T(UI.engine)}: Microsoft Edge WebView2 ${s.engine}<br>${T(UI.blocker)}: adblock-rust (Brave), ${s.lists}<br>${T(UI.data)}: <span id="dd"></span><br>github.com/profrendi/ovner</small>`;
    document.getElementById("dd").textContent = s.data;
    const a = document.activeElement;
    renderPresets();
    if (!langChanged && a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT") && a.id !== "q") return;
    build();
    // Dibuka ke bagian tertentu (mis. #s-downloads dari menu tombol unduh video).
    if (location.hash && !window.__hashDone) {
      window.__hashDone = true;
      const el = document.getElementById(location.hash.slice(1));
      if (el) el.scrollIntoView();
    }
  };
  document.getElementById("q").oninput = filter;
  document.getElementById("update").onclick = () => post({ t: "check-update" });
  // Kembali dari Pengaturan Windows (Aplikasi default): perbarui status browser default.
  window.addEventListener("focus", () => post({ t: "action", name: "default-browser-refresh" }));
  post({ t: "page-ready" });
})();
</script>
</body>
</html>
