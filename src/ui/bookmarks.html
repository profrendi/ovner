<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Bookmark</title>
<link rel="stylesheet" href="ovner://page/page.css">
</head>
<body>
<div class="wrap">
<h1>Bookmark</h1>
<p class="muted">Tekan <b>Ctrl+D</b> atau klik bintang di kolom alamat untuk menyimpan halaman. Klik judul untuk mengubah namanya.</p>
<div id="list"></div>
</div>
<script>
(function () {
  const post = (o) => window.ipc.postMessage(JSON.stringify(o));
  const list = document.getElementById("list");
  window.ovnerPage = (s) => {
    document.documentElement.dataset.theme = s.theme === "system" ? "" : s.theme;
    list.textContent = "";
    if (!s.bookmarks.length) { list.innerHTML = '<div class="card"><div class="empty">Belum ada bookmark.</div></div>'; return; }
    const card = Object.assign(document.createElement("div"), { className: "card list" });
    for (const b of s.bookmarks) {
      const row = document.createElement("div"); row.className = "row";
      const a = document.createElement("a"); a.href = b.url;
      a.innerHTML = `<span class="t"></span><span class="u"></span>`;
      a.querySelector(".t").textContent = b.title; a.querySelector(".u").textContent = b.url;
      const ren = document.createElement("button"); ren.textContent = "Ubah nama";
      ren.onclick = () => { const t = prompt("Nama bookmark:", b.title); if (t !== null) post({ t: "bookmark-rename", url: b.url, title: t }); };
      const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.title = "Hapus bookmark";
      x.onclick = () => post({ t: "bookmark-remove", url: b.url });
      row.append(a, ren, x); card.append(row);
    }
    list.append(card);
  };
  post({ t: "page-ready" });
})();
</script>
</body>
</html>
